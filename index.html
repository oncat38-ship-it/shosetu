<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>綴り場｜執筆アプリ初期版</title>
<style>
:root{--bg:#eef1f4;--paper:#fff;--soft:#f7f8fa;--ink:#27313a;--muted:#77828d;--line:#dfe4e9;--accent:#486c82;--accentsoft:#e9f0f4;--gold:#956c32;--goldsoft:#fbf3e5;--green:#4f7960;--greensoft:#eaf3ed;--danger:#a44b4b;--shadow:0 2px 10px #1f344408}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:14px}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px}button:hover{background:var(--soft)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}.tiny{font-size:11px}.muted{color:var(--muted)}.hidden{display:none!important}
header{height:58px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;white-space:nowrap}.mark{display:grid;place-items:center;width:32px;height:32px;background:var(--accent);color:white;border-radius:10px}.header-status{font-size:11px;color:var(--green)}.header-spacer{flex:1}.app{max-width:1650px;margin:auto;padding:12px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}.sidebar{height:calc(100vh - 82px);position:sticky;top:70px;display:flex;flex-direction:column;overflow:hidden}.side-section{padding:12px;border-bottom:1px solid var(--line)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:7px;font-weight:750;font-size:12px;margin-bottom:9px}.work-list{overflow:auto;max-height:28vh}.work-item{padding:9px;border:1px solid transparent;border-radius:8px;cursor:pointer;margin-bottom:4px}.work-item:hover{background:var(--soft)}.work-item.active{background:var(--accentsoft);border-color:#d6e3ea}.work-item strong{display:block;font-size:12px;overflow-wrap:anywhere}.work-item small{font-size:10px;color:var(--muted)}.chapters{overflow:auto;flex:1;padding:9px}.chapter-row{display:flex;align-items:center;gap:7px;padding:8px;border-radius:7px;cursor:pointer;font-size:11px}.chapter-row:hover{background:var(--soft)}.chapter-row.active{background:var(--accentsoft);color:var(--accent);font-weight:750}.chapter-row .chapter-name{flex:1;overflow-wrap:anywhere}.chapter-row .chapter-state{font-size:9px;color:var(--muted)}.side-footer{padding:10px;display:grid;gap:6px}.side-footer button{font-size:11px}.main{min-width:0;display:flex;flex-direction:column;gap:10px}.work-info{padding:13px 16px;display:flex;gap:12px;align-items:flex-start}.work-info .details{flex:1;min-width:0}.work-info h1{font-size:17px;margin:0 0 4px;overflow-wrap:anywhere}.work-info p{font-size:11px;color:var(--muted);margin:0}.work-actions{display:flex;gap:5px;flex-wrap:wrap}.editor{overflow:hidden}.editor-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--soft);padding:8px 10px;border-bottom:1px solid var(--line)}.editor-toolbar button{font-size:11px;padding:6px 8px}.push{flex:1}.save-state{font-size:10px;color:var(--green);white-space:nowrap}.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:calc(100vh - 235px)}.writing{display:flex;flex-direction:column;min-width:0}.chapter-meta{padding:13px 23px 2px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11px}.chapter-title-input{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:20px;border:0;border-bottom:1px solid transparent;background:transparent;padding:4px 23px 9px;outline:none;width:100%}.chapter-title-input:focus{border-bottom-color:var(--line)}.story{flex:1;min-height:400px;width:100%;border:0;outline:none;resize:vertical;padding:10px 24px 28px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:16px;line-height:2.05;white-space:pre-wrap;background:var(--paper)}.writing-footer{padding:8px 13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--soft);font-size:10px;color:var(--muted)}.support{border-left:1px solid var(--line);background:#fbfcfd;padding:9px;display:flex;flex-direction:column;gap:8px;min-width:0}.support-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:750;padding:2px 1px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:9px;overflow:hidden}.panel summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:750;font-size:11px;padding:10px}.panel summary::-webkit-details-marker{display:none}.panel summary:after{content:"＋";color:var(--muted);font-weight:400}.panel[open] summary:after{content:"−"}.panel-content{padding:0 10px 10px}.panel-description{font-size:10px;color:var(--muted);margin:0 0 7px}.plot-row{display:flex;gap:7px;align-items:flex-start;padding:7px 0;border-top:1px solid #f0f2f4;font-size:11px}.plot-row input{margin:3px 0 0;accent-color:var(--accent)}.plot-row label{flex:1;overflow-wrap:anywhere}.plot-row.done label{text-decoration:line-through;color:#9aa3ac}.inline-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.inline-actions button{font-size:10px;padding:5px 7px}.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.filter{font-size:10px;padding:4px 7px}.filter.active{background:var(--accentsoft);color:var(--accent);border-color:#d6e3ea}.todo-row{padding:8px 0;border-top:1px solid #f0f2f4}.todo-main{display:flex;align-items:flex-start;gap:6px;font-size:11px}.todo-main input{margin:3px 0 0;accent-color:var(--accent)}.todo-main label{flex:1;overflow-wrap:anywhere}.todo-meta{font-size:10px;color:var(--muted);padding-left:20px;margin-top:3px}.tag{font-size:9px;border-radius:4px;padding:2px 5px;margin-right:4px;white-space:nowrap}.tag.goal{background:#e9f0f6;color:#456b88}.tag.foil{background:#f8efdf;color:#96713a}.tag.seed{background:#edf2eb;color:#5d795c}.due{margin-top:5px;background:var(--goldsoft);color:var(--gold);font-size:10px;padding:5px 7px;border-radius:6px}.note{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line);border-radius:7px;padding:8px;font-size:11px}.term-note{font-size:11px;line-height:1.6}.term-word{font-weight:750}.term-word button{font-size:10px;padding:3px 6px;margin-left:5px}.status-pill{font-size:9px;padding:2px 5px;border-radius:99px;background:var(--greensoft);color:var(--green)}.bottom-tools{display:flex;gap:6px;flex-wrap:wrap}.bottom-tools button{font-size:10px}.empty{padding:15px;text-align:center;color:var(--muted);font-size:11px}.modal-backdrop{position:fixed;inset:0;background:#18232b66;z-index:20;display:none;align-items:center;justify-content:center;padding:14px}.modal-backdrop.open{display:flex}.modal{background:var(--paper);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:18px;box-shadow:0 20px 70px #0003}.modal h2{font-size:17px;margin:0 0 5px}.modal p{font-size:11px;color:var(--muted);margin:0 0 14px}.field{display:grid;gap:5px;margin:11px 0}.field label{font-size:11px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--paper)}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:space-between;gap:7px;margin-top:15px;flex-wrap:wrap}.modal-actions .right-actions{display:flex;gap:7px;margin-left:auto}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.settings-row select{border:1px solid var(--line);border-radius:7px;padding:6px;background:var(--paper)}.settings-row input{accent-color:var(--accent)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#26323b;color:white;padding:9px 14px;border-radius:99px;font-size:11px;z-index:30;display:none;max-width:90vw}.toast.show{display:block}.focus .sidebar{display:none}.focus.app{grid-template-columns:minmax(0,1fr);max-width:1350px}.focus .editor-grid{grid-template-columns:minmax(0,1fr)}.focus .support{display:none}.focus .story{min-height:calc(100vh - 270px)}
@media(max-width:980px){.app{grid-template-columns:190px minmax(0,1fr);padding:8px;gap:8px}.editor-grid{grid-template-columns:minmax(0,1fr) 255px}.story{padding-left:18px;padding-right:18px}.chapter-title-input{padding-left:18px}.chapter-meta{padding-left:18px}}
@media(max-width:720px){header{height:auto;min-height:54px;padding:8px 10px;gap:8px;flex-wrap:wrap}.brand{font-size:15px}.header-status{display:none}header button{font-size:11px;padding:6px 8px}.app{display:flex;flex-direction:column;padding:7px}.sidebar{height:auto;position:static}.side-section{padding:8px}.work-list{display:flex;gap:5px;max-height:none;overflow:auto}.work-item{min-width:135px;margin:0;padding:8px}.chapters{display:flex;gap:3px;overflow:auto;flex:none;padding:6px}.chapter-row{white-space:nowrap;flex:none;padding:7px}.side-footer{display:flex;flex-wrap:wrap}.side-footer button{flex:1}.work-info{padding:11px}.work-info h1{font-size:15px}.work-actions{max-width:110px}.editor-grid{display:flex;flex-direction:column;min-height:0}.story{min-height:50vh;font-size:15px;line-height:2;padding:9px 16px 24px}.chapter-title-input{font-size:18px;padding-left:16px}.chapter-meta{padding-left:16px}.support{border-left:0;border-top:1px solid var(--line);padding:8px;display:grid;grid-template-columns:1fr 1fr;align-items:start}.support-head{grid-column:1/-1}.panel{min-width:0}.focus .support{display:none}.focus .story{min-height:68vh}.writing-footer{font-size:9px}.modal{padding:14px}}
@media(max-width:420px){.support{grid-template-columns:1fr}.support-head{grid-column:auto}.header-spacer{flex-basis:5px}.save-state{display:none}.editor-toolbar{gap:4px}.editor-toolbar button{font-size:10px}.work-actions{max-width:none}.work-info{flex-wrap:wrap}.work-info .details{flex-basis:100%}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark">綴</div><span>綴り場 <span class="tiny muted">初期版</span></span></div>
  <span class="header-status" id="saveStatus">● ブラウザに保存</span>
  <span class="header-spacer"></span>
  <button id="focusBtn">集中執筆</button><button id="settingsBtn">表示設定</button>
</header>
<div class="app" id="app">
  <aside class="sidebar card">
    <div class="side-section">
      <div class="section-head"><span>作品一覧</span><button id="addWorkBtn" class="tiny">＋ 新規</button></div>
      <div class="work-list" id="workList"></div>
    </div>
    <div class="side-section">
      <div class="section-head"><span>章・場面</span><button id="addChapterBtn" class="tiny">＋ 章</button></div>
    </div>
    <div class="chapters" id="chapterList"></div>
    <div class="side-footer">
      <button id="renameWorkBtn">作品情報を編集</button>
      <button id="backupBtn">バックアップ・復元</button>
    </div>
  </aside>
  <main class="main">
    <section class="work-info card">
      <div class="details"><h1 id="workTitle">作品名</h1><p id="workSubtitle">章を選択して執筆できます</p></div>
      <div class="work-actions"><button id="addTodoBtn">＋ ToDo</button><button id="editChapterBtn">章の設定</button></div>
    </section>
    <section class="editor card">
      <div class="editor-toolbar">
        <button id="rubyBtn">ルビを付ける</button><button id="chapterMemoBtn">章メモ</button><button id="exportChapterBtn">章を書き出す</button>
        <span class="push"></span><span class="save-state" id="inlineSave">自動保存</span>
      </div>
      <div class="editor-grid">
        <section class="writing">
          <div class="chapter-meta"><span id="chapterNumber">第1章</span><span>·</span><span id="chapterState" class="status-pill">執筆中</span></div>
          <input id="chapterTitle" class="chapter-title-input" placeholder="章タイトルを入力">
          <textarea id="storyText" class="story" placeholder="ここから物語を書き始めます。入力内容はこのブラウザに自動保存されます。"></textarea>
          <div class="writing-footer"><span>文字数：<b id="charCount">0</b>　空白除く：<b id="charNoSpace">0</b>　行数：<b id="lineCount">1</b></span><span id="saveTime">このブラウザに自動保存</span></div>
        </section>
        <aside class="support" id="support">
          <div class="support-head"><span>執筆サポート</span><button id="collapsePanels" class="tiny">折りたたむ</button></div>
          <details class="panel" id="plotPanel" open>
            <summary>章のプロット <span class="muted tiny" id="plotCount">0項目</span></summary>
            <div class="panel-content"><p class="panel-description">この章で描くこと・場面の順番</p><div id="plotList"></div><div class="inline-actions"><button id="addPlotBtn">＋ 項目</button><button id="editPlotBtn">まとめて編集</button></div></div>
          </details>
          <details class="panel" id="todoPanel" open>
            <summary>作品全体のToDo <span class="muted tiny" id="todoCount">0件</span></summary>
            <div class="panel-content"><div class="filters" id="todoFilters"><button class="filter active" data-filter="すべて">すべて</button><button class="filter" data-filter="目標">目標</button><button class="filter" data-filter="布石">布石</button><button class="filter" data-filter="伏線">伏線</button></div><div id="todoList"></div><div class="inline-actions"><button id="addTodoBtn2">＋ ToDoを追加</button></div></div>
          </details>
          <details class="panel" id="glossaryPanel" open>
            <summary>用語・人物メモ <span class="muted tiny">試作</span></summary>
            <div class="panel-content"><p class="panel-description">登録した用語を本文から参照する機能の土台</p><div id="termList"></div><div class="inline-actions"><button id="addTermBtn">＋ 用語を追加</button><button id="toggleTermsBtn">本文の強調：オン</button></div></div>
          </details>
          <details class="panel" id="proofPanel">
            <summary>文章チェック <span class="muted tiny">簡易</span></summary>
            <div class="panel-content"><p class="panel-description">初期版では簡易的な重複表現のみ確認します。完全な校正機能ではありません。</p><label class="plot-row"><input type="checkbox" id="proofEnabled"><label for="proofEnabled">文章チェックを有効にする</label></label><button id="runProofBtn">この章をチェック</button><div id="proofResults"></div></div>
          </details>
          <details class="panel" id="memoPanel">
            <summary>ひとことメモ</summary>
            <div class="panel-content"><textarea id="quickMemo" class="note" placeholder="思いついたことを一時メモ…"></textarea></div>
          </details>
        </aside>
      </div>
    </section>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><div id="modalContent"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='tsuzuriba_initial_v2';
const $=id=>document.getElementById(id);
let data, currentWorkId, currentChapterId, currentTodoFilter='すべて', saveTimer, termsOn=true, focused=false;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const sample=()=>({
 version:2, works:[{
  id:uid(),title:'月影と帰還の剣',genre:'ファンタジー・冒険',description:'アルとアルマが、言葉を失った武器たちの声を探す旅。',created:Date.now(),
  chapters:[
   {id:uid(),title:'古い剣',body:'　古道具屋の奥で、アルは一本の剣を見つけた。\\n\\n「こいつ、ずいぶん長いことここにいるな」\\n\\n剣は答えなかった。けれど、柄に触れた瞬間、アルには微かな違和感が伝わってきた。',memo:'旅の始まり。アルが武器の気配を感じることを示す。',plots:[{id:uid(),text:'古道具屋で剣を見つける',done:true},{id:uid(),text:'アルだけが違和感に気づく',done:true}],updated:Date.now()},
   {id:uid(),title:'旅立ち',body:'　「で、これを持っていくの？」\\n\\nアルマが剣を見た。\\n\\n「まあ、行くあてもないみたいだしな。俺たちも、ちょうど暇だった」\\n\\n「暇だから旅をする人って初めて見た」',memo:'二人の軽いやり取りを見せる。',plots:[{id:uid(),text:'アルとアルマが旅に出る',done:true},{id:uid(),text:'剣がわずかに反応する',done:false}],updated:Date.now()},
   {id:uid(),title:'王都への帰還',body:'　王都の門をくぐった瞬間、遠くから鐘の音が響いた。\\n\\n　澄んだ音だった。けれど、行き交う人々は誰ひとり空を見上げない。まるで、その音が聞こえていないかのように。\\n\\n「……今の、聞こえたか？」\\n\\n　アルが足を止める。腰に吊った剣は、いつもと変わらず沈黙していた。\\n\\n「鐘なら、毎日鳴っているんじゃないの？」\\n\\n　アルマが首を傾げると、アルは少しだけ眉を寄せた。\\n\\n「そういう音じゃないんだよな。なんていうか……誰かが、呼んでるみたいな」\\n\\n　その言葉に、アルマは笑いかけて、やめた。王都の奥。尖塔の向こうに、昼間だというのに薄い月が浮かんでいた。',memo:'鐘の正体は第6章以降で少しずつ明かす。',plots:[{id:uid(),text:'王都へ到着する',done:true},{id:uid(),text:'人々には聞こえない鐘の音を聞く',done:false},{id:uid(),text:'アルが剣の異変に気づく',done:false}],updated:Date.now()},
   {id:uid(),title:'鐘の秘密',body:'',memo:'',plots:[],updated:Date.now()}
  ],
  todos:[
   {id:uid(),category:'目標',text:'ルナと父の過去を明かす',done:false,chapterFrom:3,chapterTo:3,details:'ルナが父の剣に抱いている気持ちも描く。',tags:'ルナ,父親'},
   {id:uid(),category:'布石',text:'アルが剣の異変に気づく',done:false,chapterFrom:3,chapterTo:4,details:'武器の微細な変化をアルだけが感じ取る。後の展開につなげる。',tags:'アル,剣'},
   {id:uid(),category:'伏線',text:'王都で聞こえる謎の鐘',done:false,chapterFrom:3,chapterTo:4,details:'鐘の音が聞こえる条件と正体を決める。',tags:'王都,鐘'}
  ],
  terms:[{id:uid(),name:'アル',kind:'人物',summary:'気楽で人当たりのよい旅人。武器の微妙な変化を感じ取れる。'},{id:uid(),name:'アルマ',kind:'人物',summary:'アルの相棒。観察眼が鋭く、アルの無茶を軽くいなす。'},{id:uid(),name:'王都',kind:'場所',summary:'古い鐘楼と尖塔がある大きな都市。'}],
  memo:''
 },{
  id:uid(),title:'メアの夢と現',genre:'幻想・旅',description:'記憶を失った少女が、過去の世界を旅する物語。',created:Date.now(),chapters:[{id:uid(),title:'最初の夢',body:'',memo:'',plots:[],updated:Date.now()}],todos:[],terms:[],memo:''
 }]
});
function normalize(d){if(!d||!Array.isArray(d.works))return sample();d.works.forEach(w=>{w.chapters||=[];w.todos||=[];w.terms||=[];w.memo||='';w.chapters.forEach(c=>{c.plots||=[];c.memo||='';c.body||='';});});return d}
try{data=normalize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){data=sample()}
if(!data.works.length)data=sample();
currentWorkId=data.works[0].id;currentChapterId=data.works[0].chapters[0]?.id;
function work(){return data.works.find(w=>w.id===currentWorkId)||data.works[0]}
function chapter(){return work().chapters.find(c=>c.id===currentChapterId)||work().chapters[0]}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2100)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('saveStatus').textContent='● 保存済み';$('inlineSave').textContent='保存済み';$('saveTime').textContent='最終保存 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}catch(e){$('saveStatus').textContent='保存できません';$('inlineSave').textContent='保存エラー'} }
function queueSave(){ $('saveStatus').textContent='保存中…';$('inlineSave').textContent='保存中…';clearTimeout(saveTimer);saveTimer=setTimeout(save,350)}
function render(){renderWorks();renderChapters();renderEditor();renderSupport()}
function renderWorks(){const el=$('workList');el.innerHTML='';data.works.forEach(w=>{const b=document.createElement('div');b.className='work-item'+(w.id===currentWorkId?' active':'');b.innerHTML=`<strong>${escapeHTML(w.title||'名称未設定')}</strong><small>${escapeHTML(w.genre||'ジャンル未設定')}</small>`;b.onclick=()=>{currentWorkId=w.id;currentChapterId=w.chapters[0]?.id;render();};el.appendChild(b)});$('workTitle').textContent=work().title||'名称未設定';$('workSubtitle').textContent=(work().genre||'ジャンル未設定')+(work().description?' · '+work().description:'')}
function renderChapters(){const el=$('chapterList');el.innerHTML='';work().chapters.forEach((c,i)=>{const b=document.createElement('div');b.className='chapter-row'+(c.id===currentChapterId?' active':'');b.innerHTML=`<span class="chapter-name">${i+1}. ${escapeHTML(c.title||'無題の章')}</span><span class="chapter-state">${c.body?.trim()?'本文あり':'空'}</span>`;b.onclick=()=>{pullEditor();currentChapterId=c.id;renderChapters();renderEditor();renderSupport();};el.appendChild(b)})}
function pullEditor(){const c=chapter();if(!c)return;c.title=$('chapterTitle').value;c.body=$('storyText').value;c.memo=c.memo??'';c.updated=Date.now();const note=$('quickMemo');work().memo=note.value}
function renderEditor(){const c=chapter();if(!c){$('chapterTitle').value='';$('storyText').value='';$('chapterNumber').textContent='章がありません';return}const i=work().chapters.indexOf(c)+1;$('chapterNumber').textContent=`第${i}章`;$('chapterTitle').value=c.title||'';$('storyText').value=c.body||'';$('quickMemo').value=work().memo||'';counts();$('chapterState').textContent=c.body?.trim()?'執筆中':'未執筆';$('saveStatus').textContent='● ブラウザに保存';}
function counts(){const s=$('storyText').value;$('charCount').textContent=s.length;$('charNoSpace').textContent=s.replace(/\s/g,'').length;$('lineCount').textContent=s.length?s.split('\n').length:1}
function renderSupport(){const c=chapter(),w=work();$('plotList').innerHTML='';if(!c)return;const plots=c.plots||[];$('plotCount').textContent=`${plots.filter(p=>p.done).length}/${plots.length}`;plots.forEach(p=>{const row=document.createElement('div');row.className='plot-row'+(p.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!p.done;const lab=document.createElement('label');lab.textContent=p.text;cb.onchange=()=>{p.done=cb.checked;queueSave();renderSupport()};row.append(cb,lab);$('plotList').appendChild(row)});if(!plots.length)$('plotList').innerHTML='<div class="empty">この章のプロットはまだありません。</div>';
 const todos=w.todos||[];const active=todos.filter(t=>!t.done);$('todoCount').textContent=`未完了 ${active.length}件`;document.querySelectorAll('#todoFilters button').forEach(b=>b.classList.toggle('active',b.dataset.filter===currentTodoFilter));$('todoList').innerHTML='';const visible=todos.filter(t=>(currentTodoFilter==='すべて'||t.category===currentTodoFilter));if(!visible.length)$('todoList').innerHTML='<div class="empty">該当する項目はありません。</div>';visible.forEach(t=>{const row=document.createElement('div');row.className='todo-row';const main=document.createElement('div');main.className='todo-main';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;const label=document.createElement('label');const cls=t.category==='目標'?'goal':t.category==='布石'?'foil':'seed';label.innerHTML=`<span class="tag ${cls}">${escapeHTML(t.category)}</span>${escapeHTML(t.text)}`;if(t.done)label.style.textDecoration='line-through';cb.onchange=()=>{t.done=cb.checked;queueSave();renderSupport()};label.onclick=()=>openTodo(t.id);main.append(cb,label);row.appendChild(main);const from=Number(t.chapterFrom),to=Number(t.chapterTo);let meta='章未定';if(from>0&&to>0)meta=from===to?`予定：第${from}章`:`予定：第${from}〜${to}章`;else if(from>0)meta=`予定：第${from}章以降`;const m=document.createElement('div');m.className='todo-meta';m.textContent=meta;row.appendChild(m);const current=work().chapters.indexOf(chapter())+1;if(!t.done&&from>0&&to>0&&current>=from&&current<=to){const d=document.createElement('div');d.className='due';d.textContent='現在の章が予定範囲です';row.appendChild(d)}$('todoList').appendChild(row)});
 $('termList').innerHTML='';if(!w.terms.length)$('termList').innerHTML='<div class="empty">用語はまだ登録されていません。</div>';w.terms.slice(0,5).forEach(t=>{const d=document.createElement('div');d.className='term-note';d.style.padding='5px 0';d.style.borderTop='1px solid #f0f2f4';d.innerHTML=`<span class="term-word">${escapeHTML(t.name)}</span> <span class="muted tiny">${escapeHTML(t.kind||'用語')}</span><div class="muted">${escapeHTML(t.summary||'説明なし')}</div>`;$('termList').appendChild(d)});
}
function modal(title,desc,body,actions){$('modalContent').innerHTML=`<h2>${title}</h2><p>${desc||''}</p>${body}<div class="modal-actions">${actions||'<span></span><div class="right-actions"><button data-close>閉じる</button></div>'}</div>`;$('modalBackdrop').classList.add('open');$('modalContent').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){$('modalBackdrop').classList.remove('open')}
$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});
function field(id,label,value='',type='text',placeholder=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${escapeHTML(value)}" placeholder="${escapeHTML(placeholder)}"></div>`}
function addWork(){modal('新しい作品を作成','作品情報を入力してください。',field('fTitle','作品名','','text','例：星渡りの旅')+field('fGenre','ジャンル','','text','例：ファンタジー')+`<div class="field"><label for="fDesc">作品の概要（任意）</label><textarea id="fDesc" placeholder="短い説明"></textarea></div>`,`<button data-close>キャンセル</button><div class="right-actions"><button class="primary" id="saveNewWork">作品を作成</button></div>`);$('saveNewWork').onclick=()=>{const title=$('fTitle').value.trim();if(!title){toast('作品名を入力してください');return}const w={id:uid(),title,genre:$('fGenre').value.trim(),description:$('fDesc').value.trim(),created:Date.now(),chapters:[{id:uid(),title:'第1章',body:'',memo:'',plots:[],updated:Date.now()}],todos:[],terms:[],memo:''};data.works.push(w);currentWorkId=w.id;currentChapterId=w.chapters[0].id;closeModal();render();save();toast('作品を作成しました')}}
function addChapter(){const n=work().chapters.length+1;modal('章を追加','章のタイトルは後から変更できます。',field('fChapter','章タイトル',`第${n}章`),`<button data-close>キャンセル</button><div class="right-actions"><button class="primary" id="saveNewChapter">章を追加</button></div>`);$('saveNewChapter').onclick=()=>{const c={id:uid(),title:$('fChapter').value.trim()||`第${n}章`,body:'',memo:'',plots:[],updated:Date.now()};pullEditor();work().chapters.push(c);currentChapterId=c.id;closeModal();render();queueSave()}}
function editWork(){const w=work();modal('作品情報を編集','作品名や概要を更新できます。',field('fTitle','作品名',w.title)+field('fGenre','ジャンル',w.genre||'')+`<div class="field"><label for="fDesc">作品の概要</label><textarea id="fDesc">${escapeHTML(w.description||'')}</textarea></div>`,`<button class="danger" id="deleteWork">作品を削除</button><div class="right-actions"><button data-close>キャンセル</button><button class="primary" id="saveWork">保存</button></div>`);$('saveWork').onclick=()=>{const title=$('fTitle').value.trim();if(!title){toast('作品名を入力してください');return}w.title=title;w.genre=$('fGenre').value.trim();w.description=$('fDesc').value.trim();closeModal();render();queueSave()};$('deleteWork').onclick=()=>{if(data.works.length===1){toast('最後の1作品は削除できません');return}if(confirm(`「${w.title}」を削除しますか？ この作品の本文とメモも削除されます。`)){data.works=data.works.filter(x=>x.id!==w.id);currentWorkId=data.works[0].id;currentChapterId=data.works[0].chapters[0]?.id;closeModal();render();save();toast('作品を削除しました')}}}
function editChapter(){const c=chapter();if(!c)return;modal('章の設定','章タイトルと執筆メモを編集できます。',field('fChapter','章タイトル',c.title)+`<div class="field"><label for="fMemo">章メモ</label><textarea id="fMemo">${escapeHTML(c.memo||'')}</textarea></div>`,`<button class="danger" id="deleteChapter">章を削除</button><div class="right-actions"><button data-close>キャンセル</button><button class="primary" id="saveChapter">保存</button></div>`);$('saveChapter').onclick=()=>{c.title=$('fChapter').value.trim()||'無題の章';c.memo=$('fMemo').value;closeModal();render();queueSave()};$('deleteChapter').onclick=()=>{if(work().chapters.length===1){toast('最後の章は削除できません');return}if(confirm('この章と本文を削除しますか？')){work().chapters=work().chapters.filter(x=>x.id!==c.id);currentChapterId=work().chapters[0].id;closeModal();render();save()}}}
function editMemo(){const c=chapter();modal('章メモ','この章の執筆方針や注意点を記録します。',`<div class="field"><label for="fMemo">章メモ</label><textarea id="fMemo" style="min-height:180px">${escapeHTML(c.memo||'')}</textarea></div>`,`<button data-close>キャンセル</button><div class="right-actions"><button class="primary" id="saveMemo">保存</button></div>`);$('saveMemo').onclick=()=>{c.memo=$('fMemo').value;closeModal();queueSave();toast('章メモを保存しました')}}
function editPlots(){const c=chapter();modal('プロットをまとめて編集','1行につき1項目として登録します。既存のチェック状態はリセットされます。',`<div class="field"><label for="fPlots">プロット（1行1項目）</label><textarea id="fPlots" style="min-height:230px">${escapeHTML((c.plots||[]).map(p=>p.text).join('\n'))}</textarea></div>`,`<button data-close>キャンセル</button><div class="right-actions"><button class="primary" id="savePlots">保存</button></div>`);$('savePlots').onclick=()=>{c.plots=$('fPlots').value.split('\n').map(s=>s.trim()).filter(Boolean).map(text=>({id:uid(),text,done:false}));closeModal();renderSupport();queueSave()}}
function addPlot(){const c=chapter();modal('プロット項目を追加','この章で描く出来事や場面を入力します。',field('fPlot','項目名','','text','例：鐘の音の正体に触れる')+`<div class="field"><label for="fPlotDetail">補足（任意）</label><textarea id="fPlotDetail" placeholder="セリフ案、演出、注意点など"></textarea></div>`,`<button data-close>キャンセル</button><div class="right-actions"><button class="primary" id="savePlot">追加</button></div>`);$('savePlot').onclick=()=>{const text=$('fPlot').value.trim();if(!text)return toast('項目名を入力してください');c.plots.push({id:uid(),text,done:false,details:$('fPlotDetail').value});closeModal();renderSupport();queueSave()}}
function addTodo(){modal('ToDoを追加','作品全体の目標、仕込んだ布石、回収する伏線などを登録します。',`<div class="field"><label for="fCategory">区分</label><select id="fCategory"><option>目標</option><option>布石</option><option>伏線</option></select></div>`+field('fTodo','内容','','text','例：王都で聞こえる謎の鐘')+`<div class="field"><label>予定する章の範囲（任意）</label><div style="display:flex;gap:8px"><input id="fFrom" type="number" min="1" placeholder="開始章"><input id="fTo" type="number" min="1" placeholder="終了章"></div><span class="tiny muted">未定なら空欄のままで構いません。</span></div>`+`<div class="field"><label for="fTodoDetails">詳細メモ</label><textarea id="fTodoDetails" placeholder="何をするか、どこで回収するか"></textarea></div>`+field('fTags','タグ（任意）','','text','人物名、場所など'),`<button data-close>キャンセル</button><div class="right-actions"><button class="primary" id="saveTodo">追加</button></div>`);$('saveTodo').onclick=()=>{const text=$('fTodo').value.trim();if(!text)return toast('内容を入力してください');work().todos.push({id:uid(),category:$('fCategory').value,text,done:false,chapterFrom:Number($('fFrom').value)||null,chapterTo:Number($('fTo').value)||null,details:$('fTodoDetails').value,tags:$('fTags').value});closeModal();renderSupport();queueSave();toast('ToDoを追加しました')}}
function openTodo(id){const t=work().todos.find(x=>x.id===id);if(!t)return;modal('ToDoの詳細','区分や予定章は後から変更できます。',`<div class="field"><label for="fCategory">区分</label><select id="fCategory">${['目標','布石','伏線'].map(x=>`<option ${x===t.category?'selected':''}>${x}</option>`).join('')}</select></div>`+field('fTodo','内容',t.text)+`<div class="field"><label>予定する章の範囲</label><div style="display:flex;gap:8px"><input id="fFrom" type="number" min="1" value="${t.chapterFrom||''}" placeholder="開始章"><input id="fTo" type="number" min="1" value="${t.chapterTo||''}" placeholder="終了章"></div></div>`+`<div class="field"><label for="fTodoDetails">詳細メモ</label><textarea id="fTodoDetails">${escapeHTML(t.details||'')}</textarea></div>`+field('fTags','タグ',t.tags||''),`<button class="danger" id="deleteTodo">削除</button><div class="right-actions"><button data-close>キャンセル</button><button class="primary" id="saveTodo">保存</button></div>`);$('saveTodo').onclick=()=>{const text=$('fTodo').value.trim();if(!text)return toast('内容を入力してください');Object.assign(t,{category:$('fCategory').value,text,chapterFrom:Number($('fFrom').value)||null,chapterTo:Number($('fTo').value)||null,details:$('fTodoDetails').value,tags:$('fTags').value});closeModal();renderSupport();queueSave()};$('deleteTodo').onclick=()=>{if(confirm('このToDoを削除しますか？')){work().todos=work().todos.filter(x=>x.id!==id);closeModal();renderSupport();queueSave()}}}
function addTerm(){modal('用語・人物メモを追加','登録した情報を後から本文と連携させるための簡易データベースです。',field('fTerm','用語・人物名','','text','例：アルマ')+field('fKind','種類','','text','人物・場所・道具など')+`<div class="field"><label for="fSummary">概要</label><textarea id="fSummary"></textarea></div>`,`<button data-close>キャンセル</button><div class="right-actions"><button class="primary" id="saveTerm">追加</button></div>`);$('saveTerm').onclick=()=>{const name=$('fTerm').value.trim();if(!name)return toast('用語名を入力してください');work().terms.push({id:uid(),name,kind:$('fKind').value,summary:$('fSummary').value});closeModal();renderSupport();queueSave()}}
function exportFile(filename,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
function backup(){modal('バックアップ・復元','データは現在このブラウザ内に保存されています。端末変更やブラウザのデータ消去に備え、定期的にバックアップしてください。',`<div class="field"><label>全作品をバックアップ</label><button id="exportAll">JSONファイルを書き出す</button></div><div class="field"><label for="importFile">バックアップから復元</label><input type="file" id="importFile" accept=".json,application/json"><span class="tiny muted">復元すると現在のデータを置き換えます。先にバックアップをおすすめします。</span></div>`,`<button data-close>閉じる</button>`);$('exportAll').onclick=()=>{pullEditor();save();exportFile('tsuzuriba-backup.json',JSON.stringify(data,null,2),'application/json');toast('バックアップを書き出しました')};$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=normalize(JSON.parse(await f.text()));if(!Array.isArray(d.works)||!d.works.length)throw Error();if(!confirm('現在の全データを置き換えて復元しますか？'))return;data=d;currentWorkId=data.works[0].id;currentChapterId=data.works[0].chapters[0]?.id;save();closeModal();render();toast('バックアップを復元しました')}catch(err){toast('読み込めないバックアップファイルです')}}}
function ruby(){const ta=$('storyText');const a=ta.selectionStart,b=ta.selectionEnd;if(a===b){toast('先にルビを付けたい文字を選択してください');return}const selected=ta.value.slice(a,b);modal('ルビを付ける','選択した文字に読み仮名を付けます。',field('fRuby','読み仮名','','text','例：かんじ')+`<div class="field"><label>対象の文字</label><div>${escapeHTML(selected)}</div></div>`,`<button data-close>キャンセル</button><div class="right-actions"><button class="primary" id="applyRuby">挿入</button></div>`);$('applyRuby').onclick=()=>{const reading=$('fRuby').value.trim();if(!reading)return toast('読み仮名を入力してください');const insert=`｜${selected}《${reading}》`;ta.setRangeText(insert,a,b,'end');pullEditor();counts();queueSave();closeModal();ta.focus()}}
function proof(){if(!$('proofEnabled').checked){toast('文章チェックがオフです');return}const s=$('storyText').value;const findings=[];const patterns=[/(は){2,}/g,/(が){2,}/g,/(を){2,}/g,/(に){2,}/g,/(。){2,}/g,/(、){2,}/g,/([ぁ-んァ-ヶ一-龠])\1{2,}/g];patterns.forEach(re=>{let m;while((m=re.exec(s))!==null)findings.push({text:m[0],index:m.index,reason:'同じ文字・助詞・句読点が重複している可能性'})});const out=$('proofResults');out.innerHTML='';if(!findings.length){out.innerHTML='<div class="empty">簡易チェックでは明らかな重複を見つけませんでした。誤字脱字がないことを保証するものではありません。</div>';return}findings.slice(0,20).forEach(f=>{const d=document.createElement('div');d.className='todo-row';d.innerHTML=`<div><b>${escapeHTML(f.text)}</b><div class="tiny muted">${escapeHTML(f.reason)}</div><button class="tiny" style="margin-top:4px">該当箇所へ移動</button></div>`;d.querySelector('button').onclick=()=>{$('storyText').focus();$('storyText').setSelectionRange(f.index,f.index+f.text.length);toast('該当箇所を選択しました')};out.appendChild(d)})}
$('addWorkBtn').onclick=addWork;$('addChapterBtn').onclick=addChapter;$('renameWorkBtn').onclick=editWork;$('editChapterBtn').onclick=editChapter;$('chapterMemoBtn').onclick=editMemo;$('addPlotBtn').onclick=addPlot;$('editPlotBtn').onclick=editPlots;$('addTodoBtn').onclick=addTodo;$('addTodoBtn2').onclick=addTodo;$('addTermBtn').onclick=addTerm;$('backupBtn').onclick=backup;$('rubyBtn').onclick=ruby;$('runProofBtn').onclick=proof;
$('storyText').addEventListener('input',()=>{pullEditor();counts();queueSave()});$('chapterTitle').addEventListener('input',()=>{pullEditor();renderChapters();queueSave()});$('quickMemo').addEventListener('input',()=>{work().memo=$('quickMemo').value;queueSave()});
$('todoFilters').onclick=e=>{const b=e.target.closest('button[data-filter]');if(!b)return;currentTodoFilter=b.dataset.filter;renderSupport()};
$('collapsePanels').onclick=()=>{const ps=[...document.querySelectorAll('#support details')],shouldOpen=ps.some(p=>p.open);ps.forEach(p=>p.open=!shouldOpen);$('collapsePanels').textContent=shouldOpen?'展開する':'折りたたむ'};
$('focusBtn').onclick=()=>{focused=!focused;$('app').classList.toggle('focus',focused);$('focusBtn').textContent=focused?'通常表示':'集中執筆'};
$('settingsBtn').onclick=()=>{modal('表示設定','執筆画面を自分の使い方に合わせて調整します。',`<div class="settings-row"><span>補助パネルの位置</span><select id="sPosition"><option value="right">右側</option><option value="left">左側</option><option value="hidden">非表示</option></select></div><div class="settings-row"><span>用語メモを表示</span><input id="sTerms" type="checkbox" checked></div><div class="settings-row"><span>文章チェックを表示</span><input id="sProof" type="checkbox" checked></div><div class="settings-row"><span>章のプロットを表示</span><input id="sPlot" type="checkbox" checked></div><div class="settings-row"><span>作品全体のToDoを表示</span><input id="sTodo" type="checkbox" checked></div><div class="settings-row"><span>ひとことメモを表示</span><input id="sMemo" type="checkbox" checked></div>`,`<button data-close>キャンセル</button><div class="right-actions"><button class="primary" id="applySettings">反映</button></div>`);$('applySettings').onclick=()=>{const pos=$('sPosition').value;const support=$('support'),writing=document.querySelector('.writing');support.style.display=pos==='hidden'?'none':'';if(pos==='left'&&support.parentElement){const grid=support.parentElement;grid.insertBefore(support,writing);support.style.borderLeft='0';support.style.borderRight='1px solid var(--line)'}else if(pos==='right'){const grid=support.parentElement;grid.appendChild(support);support.style.borderRight='0';support.style.borderLeft='1px solid var(--line)'}[['sTerms','glossaryPanel'],['sProof','proofPanel'],['sPlot','plotPanel'],['sTodo','todoPanel'],['sMemo','memoPanel']].forEach(([a,b])=>$(b).style.display=$(a).checked?'':'none');closeModal();toast('表示設定を反映しました（この画面内）')}};
$('exportChapterBtn').onclick=()=>{pullEditor();const c=chapter();exportFile(`${work().title}_${c.title||'無題'}.txt`,`${c.title||'無題'}\n\n${c.body||''}\n`);toast('章の本文を書き出しました')};
$('toggleTermsBtn').onclick=()=>{termsOn=!termsOn;$('toggleTermsBtn').textContent='本文の強調：'+(termsOn?'オン':'オフ');toast('用語の強調表示を'+(termsOn?'オン':'オフ')+'にしました（連携表示は今後拡張）')};
$('chapterMemoBtn').title='章メモを編集';$('proofEnabled').onchange=()=>toast($('proofEnabled').checked?'文章チェックを有効にしました':'文章チェックを無効にしました');
window.addEventListener('beforeunload',()=>{pullEditor();save()});
render();save();
</script>
