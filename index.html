<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chic Novelist Studio - UI Mockup V1.6</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Inter', 'Noto Serif JP', serif;
            touch-action: manipulation;
        }
        /* Custom scrollbar for chic look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Draggable buttons style */
        .draggable-btn {
            touch-action: none;
            user-select: none;
            cursor: grab;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .draggable-btn:active {
            cursor: grabbing;
        }
        .draggable-btn.locked {
            cursor: pointer;
        }
        .draggable-btn.hidden-mode {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-200 min-h-screen flex flex-col antialiased selection:bg-slate-700 selection:text-white">

    <!-- Top Banner -->
    <header class="bg-dark-800/90 backdrop-blur-md border-b border-dark-700 px-4 py-2.5 sticky top-0 z-40 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <!-- App Icon -->
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-slate-700 to-dark-900 flex items-center justify-center border border-slate-600 shadow-inner">
                <i class="fa-solid fa-feather-pointed text-[11px] text-slate-300"></i>
            </div>
            <!-- Work Title & Subtitle Container -->
            <div class="flex items-center space-x-3">
                <button id="openWorkSelectorBtn" class="text-left group flex flex-col focus:outline-none" title="作品の切り替え・新規登録">
                    <div class="flex items-center space-x-1.5">
                        <h1 id="currentWorkTitleDisplay" class="text-xs md:text-sm font-semibold tracking-wide text-slate-100 group-hover:text-white transition">深夜特急のレプリカント</h1>
                        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 group-hover:text-slate-200 transition"></i>
                    </div>
                    <span id="currentWorkSubTitleDisplay" class="text-[10px] text-slate-400 font-medium tracking-wide">第1部・覚醒編</span>
                </button>
            </div>
        </div>

        <!-- Focus Mode Button -->
        <button id="focusModeBtn" title="集中モード" class="p-1.5 px-2.5 rounded-lg bg-dark-700/60 hover:bg-dark-700 text-slate-300 hover:text-white transition border border-dark-600/50 flex items-center space-x-1.5 text-xs">
            <i id="focusIcon" class="fa-solid fa-expand"></i>
            <span class="hidden sm:inline" id="focusText">集中モード</span>
        </button>
    </header>

    <!-- Compact Progress Dashboard (Controlled by Focus Mode) -->
    <section id="targetSection" class="bg-dark-800/50 border-b border-dark-700/60 px-4 py-2 text-xs transition-all duration-300 overflow-hidden">
        <div id="targetGridContainer" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-2.5">
            <!-- Overall Progress -->
            <div id="goalOverall" class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span class="text-slate-400">全体目標</span>
                    <span class="font-mono text-slate-200"><span id="overallCurrentText">0</span> / <span id="overallGoalText" class="text-slate-400">50,000字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div id="overallBar" class="bg-slate-400 h-1.5 rounded-full" style="width: 0%;"></div>
                </div>
            </div>
            <!-- Chapter Progress -->
            <div id="goalChapter" class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span id="chapterGoalLabel" class="text-slate-400">第3章目標</span>
                    <span class="font-mono text-slate-200"><span id="chapterCurrentText">0</span> / <span id="chapterGoalLimitText" class="text-slate-400">5,000字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div id="chapterBar" class="bg-slate-500 h-1.5 rounded-full" style="width: 0%;"></div>
                </div>
            </div>
            <!-- Episode Progress -->
            <div id="goalEpisode" class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span class="text-slate-400">本話（第12話）</span>
                    <span class="font-mono text-slate-200"><span id="episodeCurrentText">0</span> / <span id="episodeGoalText" class="text-slate-400">1,500字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div id="episodeBar" class="bg-slate-300 h-1.5 rounded-full" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col space-y-3">

        <!-- Chapter & Title Header (Clickable Chapter Button & Expanded Synopsis) -->
        <div class="bg-dark-800/60 border border-dark-700/70 rounded-xl px-3.5 py-2.5 shadow-sm flex flex-col space-y-2">
            <div class="flex items-center space-x-3">
                <!-- Clickable Chapter Selector Button -->
                <button id="openChapterSelectorBtn" class="flex items-center space-x-1.5 bg-dark-700/80 hover:bg-dark-700 border border-dark-600 rounded px-2.5 py-1 shrink-0 text-slate-200 text-xs font-semibold transition group" title="章の切り替え・管理">
                    <i class="fa-solid fa-bookmark text-[10px] text-slate-400"></i>
                    <span id="currentChapterDisplay">第3章</span>
                    <i class="fa-solid fa-chevron-down text-[9px] text-slate-400 group-hover:text-slate-200 transition"></i>
                </button>
                <!-- Chapter / Episode Title Input -->
                <input type="text" id="chapterTitleInput" value="雨音のプロムナード" class="bg-transparent border-b border-dark-600/60 focus:border-slate-400 outline-none text-sm md:text-base font-semibold text-slate-100 py-0.5 transition w-full" placeholder="話・サブタイトルを入力...">
            </div>
            <!-- Synopsis Field (Expanded to minimum 2 rows) -->
            <div class="relative pt-1">
                <span class="absolute top-0 left-2.5 px-1 bg-dark-800 text-[9px] text-slate-400 font-medium uppercase tracking-wider border border-dark-700 rounded">あらすじ</span>
                <textarea id="synopsisInput" rows="2" class="w-full bg-dark-900/60 border border-dark-700 rounded-lg px-2.5 py-2 text-xs text-slate-300 focus:outline-none focus:border-slate-500 transition resize-none leading-relaxed" placeholder="章のあらすじやプロットの指針を記入...">主人公がネオン街の裏路地で情報屋と接触し、過去の記憶の手がかりとなる古いデータチップを受け取る。</textarea>
            </div>
        </div>

        <!-- Editor Section with Plot Column on the Left -->
        <div class="flex-1 grid grid-cols-12 gap-3 items-stretch">
            
            <!-- Plot No. Vertical Column (Left Side) -->
            <div class="col-span-3 md:col-span-2 bg-dark-800/40 border border-dark-700/60 rounded-xl p-2.5 flex flex-col space-y-2.5">
                <div class="flex items-center justify-between border-b border-dark-700 pb-1.5">
                    <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">プロットNo.</span>
                    <button title="プロット追加" class="text-slate-400 hover:text-slate-200 text-xs"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="flex flex-col space-y-2 overflow-y-auto max-h-[500px] pr-0.5">
                    <!-- Plot Item 1 (Active) -->
                    <div class="p-2 rounded-lg bg-dark-700/60 border border-slate-600 cursor-pointer text-xs transition shadow-sm">
                        <div class="font-mono text-[10px] text-slate-400">#PLOT-012</div>
                        <div class="font-medium text-slate-200 truncate mt-0.5">裏路地での密会</div>
                    </div>
                    <!-- Plot Item 2 -->
                    <div class="p-2 rounded-lg bg-dark-800/80 border border-dark-700/60 hover:bg-dark-700/40 cursor-pointer text-xs transition text-slate-400">
                        <div class="font-mono text-[10px] text-slate-500">#PLOT-013</div>
                        <div class="truncate mt-0.5">雨のハイウェイ</div>
                    </div>
                    <!-- Plot Item 3 -->
                    <div class="p-2 rounded-lg bg-dark-800/80 border border-dark-700/60 hover:bg-dark-700/40 cursor-pointer text-xs transition text-slate-400">
                        <div class="font-mono text-[10px] text-slate-500">#PLOT-014</div>
                        <div class="truncate mt-0.5">記憶の残響</div>
                    </div>
                </div>
            </div>

            <!-- Main Body Writing Field -->
            <div class="col-span-9 md:col-span-10 bg-dark-800/50 border border-dark-700/70 rounded-xl p-3.5 flex flex-col shadow-inner relative">
                <div class="flex justify-between items-center mb-2 text-xs text-slate-400 border-b border-dark-700/50 pb-1.5">
                    <div class="flex items-center space-x-1.5">
                        <i class="fa-solid fa-pen-nib"></i>
                        <span>本文エディタ</span>
                    </div>
                    <span class="font-mono text-[10px]">Markdown / 縦書き風プレビュー対応予定</span>
                </div>
                <textarea id="mainEditor" rows="16" class="w-full flex-1 bg-transparent border-none text-slate-200 text-sm md:text-base leading-relaxed focus:outline-none resize-none font-serif" placeholder="ここに本文を記入してください...">ネオンの光がアスファルトの雨粒に反射し、まるで細かな星屑が地面に散らばっているかのように揺れていた。
襟を立てたコートのポケットの中で、冷え切った指先がかすかに震える。

「……遅かったな」

影の中から低く枯れた声が響く。振り返ると、古びた自動販売機の光に照らされた男が、煙草の火を赤く点滅させていた。</textarea>
            </div>
        </div>
    </main>

    <!-- Version Footer -->
    <footer class="py-3 text-center border-t border-dark-800 text-[11px] text-slate-500 font-mono tracking-wider">
        Chic Novelist Studio &mdash; V1.6
    </footer>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl max-w-md w-full p-5 shadow-2xl flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-dark-700 pb-3">
                <div class="flex items-center space-x-2 text-slate-100 font-semibold text-sm">
                    <i class="fa-solid fa-gear text-slate-400"></i>
                    <span>アプリケーション設定</span>
                </div>
                <button id="closeSettingsBtn" class="text-slate-400 hover:text-slate-200 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex flex-col space-y-4 text-xs">
                <div class="flex flex-col space-y-2">
                    <span class="text-slate-400 font-medium uppercase tracking-wider text-[10px]">文字数目標の表示項目</span>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="flex items-center space-x-2 bg-dark-900/50 p-2 rounded border border-dark-700/60 cursor-pointer hover:border-slate-600 transition">
                            <input type="checkbox" id="chkOverall" class="rounded bg-dark-700 border-dark-600 text-slate-500 focus:ring-0">
                            <span class="text-slate-200">全体目標</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-dark-900/50 p-2 rounded border border-dark-700/60 cursor-pointer hover:border-slate-600 transition">
                            <input type="checkbox" id="chkChapter" class="rounded bg-dark-700 border-dark-600 text-slate-500 focus:ring-0">
                            <span class="text-slate-200">章目標</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-dark-900/50 p-2 rounded border border-dark-700/60 cursor-pointer hover:border-slate-600 transition">
                            <input type="checkbox" id="chkEpisode" class="rounded bg-dark-700 border-dark-600 text-slate-500 focus:ring-0">
                            <span class="text-slate-200">話目標</span>
                        </label>
                    </div>
                </div>

                <div class="flex flex-col space-y-2 pt-2 border-t border-dark-700">
                    <span class="text-slate-400 font-medium uppercase tracking-wider text-[10px]">ボタン位置固定</span>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center justify-between bg-dark-900/50 p-2.5 rounded border border-dark-700/60 cursor-pointer hover:border-slate-600 transition">
                            <span class="text-slate-200 font-medium">ツールボタン固定</span>
                            <input type="checkbox" id="chkLockToolBtn" class="rounded bg-dark-700 border-dark-600 text-slate-500 focus:ring-0">
                        </label>
                        <label class="flex items-center justify-between bg-dark-900/50 p-2.5 rounded border border-dark-700/60 cursor-pointer hover:border-slate-600 transition">
                            <span class="text-slate-200 font-medium">ルビボタン固定</span>
                            <input type="checkbox" id="chkLockRubyBtn" class="rounded bg-dark-700 border-dark-600 text-slate-500 focus:ring-0">
                        </label>
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-2">
                <button id="saveSettingsBtn" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium transition shadow">設定を保存</button>
            </div>
        </div>
    </div>

    <!-- Work Selector & Registration / Editing Modal -->
    <div id="workSelectorModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl max-w-lg w-full p-5 shadow-2xl flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-dark-700 pb-3">
                <div id="workModalTitle" class="flex items-center space-x-2 text-slate-100 font-semibold text-sm">
                    <i class="fa-solid fa-book-bookmark text-slate-400"></i>
                    <span>作品の選択・新規登録</span>
                </div>
                <button id="closeWorkSelectorBtn" class="text-slate-400 hover:text-slate-200 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="workModalTabs" class="flex space-x-2 border-b border-dark-700 pb-2 text-xs">
                <button id="tabListBtn" class="px-3 py-1.5 rounded-lg bg-dark-700 text-slate-100 font-medium transition">作品一覧・切替</button>
                <button id="tabNewBtn" class="px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition">新規作品登録</button>
            </div>

            <div id="workListView" class="flex flex-col space-y-2.5 max-h-64 overflow-y-auto pr-1 text-xs"></div>

            <div id="workFormView" class="hidden flex flex-col space-y-3 text-xs">
                <input type="hidden" id="editingWorkId" value="">
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">作品名 <span class="text-rose-400">*</span></label>
                    <input type="text" id="formTitleInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 虚空のアンソロジー">
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">サブタイトル・シリーズ名</label>
                    <input type="text" id="formSubTitleInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 第1部・覚醒編">
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">あらすじ</label>
                    <textarea id="formSynopsisInput" rows="2" class="w-full bg-dark-900 border border-dark-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-slate-500 resize-none leading-relaxed" placeholder="作品全体のあらすじ..."></textarea>
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">目標文字数</label>
                    <input type="number" id="formGoalInput" value="50000" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500 font-mono">
                </div>
                <div class="flex items-center justify-between pt-2">
                    <button id="deleteWorkBtn" type="button" class="hidden px-3 py-2 rounded-lg bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 transition border border-rose-800/50">この作品を削除</button>
                    <div class="flex space-x-2 ml-auto">
                        <button id="cancelFormBtn" type="button" class="px-3 py-2 rounded-lg bg-dark-700 hover:bg-dark-600 text-slate-300 transition">キャンセル</button>
                        <button id="saveWorkFormBtn" type="button" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium transition shadow">保存する</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chapter Selector & Registration / Editing Modal -->
    <div id="chapterSelectorModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl max-w-lg w-full p-5 shadow-2xl flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-dark-700 pb-3">
                <div id="chapterModalTitle" class="flex items-center space-x-2 text-slate-100 font-semibold text-sm">
                    <i class="fa-solid fa-bookmark text-slate-400"></i>
                    <span>章の選択・新規登録</span>
                </div>
                <button id="closeChapterSelectorBtn" class="text-slate-400 hover:text-slate-200 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="chapterModalTabs" class="flex space-x-2 border-b border-dark-700 pb-2 text-xs">
                <button id="tabChapterListBtn" class="px-3 py-1.5 rounded-lg bg-dark-700 text-slate-100 font-medium transition">章一覧・切替</button>
                <button id="tabChapterNewBtn" class="px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition">新規章登録</button>
            </div>

            <div id="chapterListView" class="flex flex-col space-y-2.5 max-h-64 overflow-y-auto pr-1 text-xs"></div>

            <div id="chapterFormView" class="hidden flex flex-col space-y-3 text-xs">
                <input type="hidden" id="editingChapterId" value="">
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">章タイトル <span class="text-rose-400">*</span></label>
                    <input type="text" id="formChapterTitleInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 第3章 雨音のプロムナード">
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">あらすじ</label>
                    <textarea id="formChapterSynopsisInput" rows="2" class="w-full bg-dark-900 border border-dark-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-slate-500 resize-none leading-relaxed" placeholder="章のあらすじやプロット指針..."></textarea>
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">目標文字数</label>
                    <input type="number" id="formChapterGoalInput" value="5000" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500 font-mono">
                </div>
                <div class="flex items-center justify-between pt-2">
                    <button id="deleteChapterBtn" type="button" class="hidden px-3 py-2 rounded-lg bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 transition border border-rose-800/50">この章を削除</button>
                    <div class="flex space-x-2 ml-auto">
                        <button id="cancelChapterFormBtn" type="button" class="px-3 py-2 rounded-lg bg-dark-700 hover:bg-dark-600 text-slate-300 transition">キャンセル</button>
                        <button id="saveChapterFormBtn" type="button" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium transition shadow">保存する</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Draggable Floating Action Buttons -->
    <div id="toolBtnContainer" class="draggable-btn fixed z-50 select-none" style="left: 24px; bottom: 24px;">
        <button id="toolBtn" class="w-11 h-11 rounded-full bg-dark-800 hover:bg-dark-700 text-slate-300 hover:text-white border border-dark-600 shadow-xl flex items-center justify-center transition active:scale-95" title="ツール・設定">
            <i class="fa-solid fa-toolbox text-xs"></i>
        </button>
    </div>

    <div id="rubyBtnContainer" class="draggable-btn fixed z-50 select-none" style="right: 24px; bottom: 24px;">
        <button id="rubyBtn" class="w-11 h-11 rounded-full bg-dark-800 hover:bg-dark-700 text-slate-300 hover:text-white border border-dark-600 shadow-xl flex items-center justify-center transition active:scale-95" title="ルビ付与">
            <i class="fa-solid fa-font text-xs"></i>
        </button>
    </div>

    <!-- Interactive Scripts -->
    <script>
        function showNotice(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-14 right-4 z-50 bg-dark-800 border border-slate-600 text-slate-200 px-3.5 py-2 rounded-lg shadow-xl text-xs flex items-center space-x-2 transition-all duration-300';
            toast.innerHTML = `<i class="fa-solid fa-info-circle text-slate-400"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2200);
        }

        // Focus Mode Toggle
        const targetSection = document.getElementById('targetSection');

        // Draggable Functionality
        function makeDraggable(elm, isLockedCheck, storageKey) {
            let startX = 0, startY = 0, initialX = 0, initialY = 0;
            let isDragging = false;
            let hasMoved = false;

            function dragStart(e) {
                if (isLockedCheck() || isFocusMode) return;
                isDragging = true;
                hasMoved = false;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX; startY = clientY;
                const rect = elm.getBoundingClientRect();
                initialX = rect.left; initialY = rect.top;
                elm.style.left = initialX + 'px'; elm.style.top = initialY + 'px';
                elm.style.right = 'auto'; elm.style.bottom = 'auto';

                document.addEventListener('mousemove', dragMove);
                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchmove', dragMove, { passive: false });
                document.addEventListener('touchend', dragEnd);
            }

            function dragMove(e) {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - startX; const dy = clientY - startY;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
                let newX = initialX + dx; let newY = initialY + dy;
                const maxX = window.innerWidth - elm.offsetWidth; const maxY = window.innerHeight - elm.offsetHeight;
                newX = Math.max(10, Math.min(newX, maxX - 10)); newY = Math.max(10, Math.min(newY, maxY - 10));
                elm.style.left = newX + 'px'; elm.style.top = newY + 'px';
                if (e.touches && hasMoved) e.preventDefault();
            }

            function dragEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                document.removeEventListener('mousemove', dragMove);
                document.removeEventListener('mouseup', dragEnd);
                document.removeEventListener('touchmove', dragMove);
                document.removeEventListener('touchend', dragEnd);

                if (hasMoved) {
                    const currentRect = elm.getBoundingClientRect();
                    localStorage.setItem(storageKey, JSON.stringify({ left: currentRect.left + 'px', top: currentRect.top + 'px' }));
                    const innerBtn = elm.querySelector('button');
                    const clickPreventer = (event) => { event.preventDefault(); event.stopPropagation(); innerBtn.removeEventListener('click', clickPreventer, true); };
                    innerBtn.addEventListener('click', clickPreventer, true);
                }
            }

            elm.addEventListener('mousedown', dragStart);
            elm.addEventListener('touchstart', dragStart, { passive: false });
        }

        makeDraggable(document.getElementById('toolBtnContainer'), () => isToolLockedCurrent, 'tool_btn_pos');
        makeDraggable(document.getElementById('rubyBtnContainer'), () => isRubyLockedCurrent, 'ruby_btn_pos');
    </script>
</body>
</html>
