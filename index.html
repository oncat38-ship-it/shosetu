<script>
(()=>{'use strict';const KEY='tsuzuriba_v3_data';const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const fresh=()=>({settings:{halfWidth:false,showNotes:true},works:[{id:uid(),title:'新しい作品',memo:'',chapters:[{id:uid(),title:'第1章',body:'',plots:[]}],todos:[],terms:[],proofMemo:''}]});let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!data||!Array.isArray(data.works)||!data.works.length)data=fresh();data.settings ||= {halfWidth:false,showNotes:true};data.activeWork ||= data.works[0].id;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){/* file-preview environments may block local storage; editing remains usable */}}function work(){return data.works.find(w=>w.id===data.activeWork)||data.works[0]}function chapter(){let w=work();w.chapters ||= [];if(!w.chapters.length)w.chapters.push({id:uid(),title:'第1章',body:'',plots:[]});if(!w.activeChapter||!w.chapters.some(c=>c.id===w.activeChapter))w.activeChapter=w.chapters[0].id;return w.chapters.find(c=>c.id===w.activeChapter)||w.chapters[0]}function countChars(s){if(data.settings.halfWidth)return [...s].length;let n=0;for(const ch of s)n+=/[\u0000-\u00ff]/.test(ch)?0.5:1;return Math.round(n*10)/10}function header(){ $('workTitle').textContent=(work().title||'無題の作品')+' ▾';$('chapterBtn').textContent=(chapter().title||'無題の章')+' ▾';$('chapterLabel').textContent=chapter().title||'無題の章'}function renderEditor(){header();$('editor').value=chapter().body||'';renderPlots();renderTodos();updateCount()}function updateCount(){let n=countChars($('editor').value);$('count').textContent=n.toLocaleString()+'文字';$('topCount').textContent=n.toLocaleString()+'文字';$('countMode').textContent=data.settings.halfWidth?'文字数：半角も1文字として計算':'文字数：全角1・半角0.5の目安';renderPlots(false)}
function renderPlots(rebuild=true){let c=chapter(),list=$('plotList'),plots=c.plots||[];if(rebuild){list.innerHTML='';plots.forEach((p,i)=>{let d=document.createElement('div');d.className='plot';d.innerHTML='<div class="plotline"><input type="checkbox" aria-label="完了"><div class="plottext" contenteditable="true" spellcheck="false"></div></div><div class="plotmeta"><span class="muted">目標</span><input type="number" min="0" step="100" placeholder="文字数" aria-label="目標文字数"><span class="muted">文字</span><button class="small noteBtn">メモ</button><button class="small danger delBtn">削除</button></div><textarea class="plotnote" placeholder="補足メモ"></textarea><div class="plotactions"><button class="small upBtn">↑</button><button class="small downBtn">↓</button></div>';d.querySelector('.plottext').textContent=p.text||'';d.querySelector('input[type=checkbox]').checked=!!p.done;d.querySelector('input[type=number]').value=p.target||'';d.querySelector('.plotnote').value=p.note||'';d.querySelector('.plotnote').classList.toggle('hidden',!data.settings.showNotes);d.querySelector('.plottext').oninput=e=>{p.text=e.target.textContent;save()};d.querySelector('input[type=checkbox]').onchange=e=>{p.done=e.target.checked;save();renderPlots()};d.querySelector('input[type=number]').oninput=e=>{p.target=Number(e.target.value)||0;save();renderPlots(false)};d.querySelector('.plotnote').oninput=e=>{p.note=e.target.value;save()};d.querySelector('.noteBtn').onclick=()=>{let n=d.querySelector('.plotnote');n.classList.toggle('hidden');if(!n.classList.contains('hidden'))n.focus()};d.querySelector('.delBtn').onclick=()=>{if(confirm('このプロットを削除しますか？')){c.plots.splice(i,1);save();renderPlots()}};d.querySelector('.upBtn').onclick=()=>movePlot(i,-1);d.querySelector('.downBtn').onclick=()=>movePlot(i,1);list.appendChild(d)})}let current=countChars($('editor').value),cum=0,active=-1,total=0;plots.forEach((p,i)=>{let t=Number(p.target)||0;total+=t;if(t>0){if(active<0&&current>=cum&&current<cum+t)active=i;cum+=t}});if(active<0)active=plots.findIndex(p=>!p.done);[...list.children].forEach((el,i)=>{el.classList.toggle('active',i===active);el.classList.toggle('done',!!plots[i].done);el.querySelector('.plotnote').classList.toggle('hidden',!data.settings.showNotes)});$('progressBar').style.width=(total?Math.min(100,current/total*100):0)+'%';$('progressText').textContent=plots.length?`${plots.filter(p=>p.done).length}/${plots.length}項目完了 ・ 本文 ${current}文字${total?' / 目標合計 '+total+'文字':''}${active>=0?' ・ 現在の目安：'+(plots[active].text||'（内容未入力）'):''}`:'プロット未登録';renderPlotMarkers(plots,current,total,active)}function renderPlotMarkers(plots,current,total,active){const box=$('plotMarkers');if(!box)return;box.innerHTML='';if(!plots.length){box.innerHTML='<span class="plot-marker-empty">＋</span>';return}const targetTotal=plots.reduce((n,p)=>n+(Number(p.target)||0),0);let cumulative=0;plots.forEach((p,i)=>{let pct=targetTotal>0?(cumulative/targetTotal)*100:(i/Math.max(1,plots.length))*100;let marker=document.createElement('button');marker.type='button';marker.className='plot-marker'+(i===active?' current':'')+(p.done?' done':'');marker.style.top=Math.min(96,Math.max(2,pct))+'%';marker.textContent=String(i+1);marker.title=(p.text||('プロット'+(i+1)))+' ・ '+(Number(p.target)||0)+'文字目安';marker.onclick=()=>{box.classList.add('marker-detail-open');const item=$('plotList').children[i];if(item){item.scrollIntoView({block:'nearest',behavior:'smooth'});item.classList.add('active')}};box.appendChild(marker);cumulative+=Number(p.target)||0});if(targetTotal>0){const progress=document.createElement('div');progress.className='plot-marker-progress';progress.style.height=Math.min(100,current/targetTotal*100)+'%';box.appendChild(progress)}}
function movePlot(i,delta){let a=chapter().plots,j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderPlots()}
function renderTodos(){let box=$('todoList'),a=work().todos||[];box.innerHTML='';if(!a.length){box.innerHTML='<div class="empty">作品全体で忘れたくないことを登録できます。</div>';return}a.forEach((t,i)=>{let d=document.createElement('div');d.className='todorow'+(t.done?' done':'');d.innerHTML='<input type="checkbox"><button class="todo-detail"><span></span><small></small></button><button class="small danger">削除</button>';d.querySelector('input').checked=!!t.done;d.querySelector('.todo-detail span').textContent=t.text;d.querySelector('.todo-detail small').textContent=t.memo?'メモあり・タップして詳細':'タップして詳細・メモ';d.querySelector('input').onchange=e=>{t.done=e.target.checked;save();renderTodos()};d.querySelector('.todo-detail').onclick=()=>editTodo(t);d.querySelector('.danger').onclick=()=>{if(confirm('このToDoを削除しますか？')){a.splice(i,1);save();renderTodos()}};box.appendChild(d)})}
function editTodo(t){modal(t?'ToDoの詳細':'ToDoを追加',`<div class="field"><label>項目</label><input id="todoText" value="${esc(t?.text||'')}" placeholder="忘れたくないこと"></div><div class="field"><label>メモ・詳細</label><textarea id="todoMemo" placeholder="補足や具体的な内容">${esc(t?.memo||'')}</textarea></div>`);foot('保存',()=>{let text=$('todoText').value.trim();if(!text){alert('項目を入力してください');return}if(!t){work().todos||=[];work().todos.push({id:uid(),text,memo:$('todoMemo').value,done:false})}else{t.text=text;t.memo=$('todoMemo').value}save();close();renderTodos()},true)}
function close(){ $('modalRoot').innerHTML=''}function modal(title,html){let root=$('modalRoot');root.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="mhead"><button id="backModal" class="header-action hidden" aria-label="戻る">←</button><h2>${esc(title)}</h2><button id="modalWorkList" class="header-action hidden">作品一覧</button><button id="closeModal" class="closex" aria-label="閉じる" title="閉じる">×</button></div><div class="mbody">${html}</div><div class="mfoot" id="mfoot"></div></div></div>`;root.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))close()};$('closeModal').onclick=close;return root.querySelector('.modal')}function foot(label,fn,primary=false){let b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=fn;$('mfoot').appendChild(b)}
function workMenu(){modal('作品メニュー','<div class="grid"><button class="tile" id="editWork"><strong>作品設定</strong><span>作品名・メモを編集</span></button><button class="tile" id="backup"><strong>バックアップ</strong><span>データを書き出す・読み込む</span></button></div>');$('editWork').onclick=editWork;$('backup').onclick=backup;let b=$('modalWorkList');b.classList.remove('hidden');b.onclick=workList}function editWork(){let w=work();modal('作品設定',`<div class="field"><label>作品名</label><input id="wname" value="${esc(w.title)}"></div><div class="field"><label>メモ</label><textarea id="wmemo">${esc(w.memo||'')}</textarea></div>`);foot('保存',()=>{w.title=$('wname').value.trim()||'無題の作品';w.memo=$('wmemo').value;save();close();header()},true);$('backModal').classList.remove('hidden');$('backModal').onclick=workMenu}function workList(){let html='<div class="rows">'+data.works.map(w=>`<div class="itemrow"><div class="rowmain"><div class="rowtitle">${esc(w.title||'無題の作品')}</div><div class="rowsub">${w.chapters.length}章</div></div><button class="small" data-open="${w.id}">開く</button><button class="small danger" data-delete="${w.id}">削除</button></div>`).join('')+'</div><p><button id="newWork" class="primary">＋ 新しい作品</button></p>';modal('作品一覧',html);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{data.activeWork=b.dataset.open;save();close();renderEditor()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(data.works.length<2){alert('最後の1作品は削除できません');return}if(confirm('この作品を削除しますか？')){data.works=data.works.filter(w=>w.id!==b.dataset.delete);if(data.activeWork===b.dataset.delete)data.activeWork=data.works[0].id;save();workList();renderEditor()}});$('newWork').onclick=()=>{let w={id:uid(),title:'新しい作品',memo:'',chapters:[{id:uid(),title:'第1章',body:'',plots:[]}],todos:[],terms:[]};data.works.push(w);data.activeWork=w.id;save();close();renderEditor()}}
function chapterList(){const w=work(),panel=$('chapterAccordion');function draw(){panel.innerHTML='<div class="rows">'+w.chapters.map(c=>`<div class="itemrow chapter-row" data-chapter-row="${c.id}"><div class="rowmain"><div class="rowtitle">${esc(c.title||'無題の章')}</div><div class="rowsub">${countChars(c.body||'')}文字</div></div><button class="small" data-open-ch="${c.id}">選択</button></div>`).join('')+'</div><div class="field" style="margin-top:8px"><label>追加する位置</label><select id="chapterInsertAt"><option value="end">一番下に追加</option>'+w.chapters.map((c,i)=>`<option value="${i}">「${esc(c.title)}」の前</option>`).join('')+'</select></div><button id="newChapter" class="chapter-add primary">＋ 章を追加</button><p class="muted">章を長押しすると、タイトル編集・削除ができます。</p>';panel.querySelectorAll('[data-open-ch]').forEach(b=>b.onclick=()=>{w.activeChapter=b.dataset.openCh;save();panel.classList.add('hidden');dismissLayer('chapter');renderEditor()});panel.querySelectorAll('[data-chapter-row]').forEach(row=>{let timer;const begin=()=>{timer=setTimeout(()=>actions(row.dataset.chapterRow),600)};const cancel=()=>clearTimeout(timer);row.addEventListener('touchstart',begin,{passive:true});['touchend','touchmove','touchcancel'].forEach(ev=>row.addEventListener(ev,cancel));row.addEventListener('contextmenu',e=>{e.preventDefault();actions(row.dataset.chapterRow)})});$('newChapter').onclick=()=>{let val=$('chapterInsertAt').value,idx=val==='end'?w.chapters.length:Number(val),c={id:uid(),title:'第'+(w.chapters.length+1)+'章',body:'',plots:[]};w.chapters.splice(idx,0,c);w.activeChapter=c.id;save();renderEditor();draw()}}function actions(id){let c=w.chapters.find(x=>x.id===id);if(!c)return;panel.innerHTML=`<div class="itemrow"><div class="rowmain"><div class="rowtitle">${esc(c.title)}</div></div><button class="small" id="chapterActionBack">戻る</button></div><button class="chapter-add" id="renameChapter">タイトルを編集</button><button class="chapter-add danger" id="deleteChapter">章を削除</button>`;$('chapterActionBack').onclick=draw;$('renameChapter').onclick=()=>{let n=prompt('章タイトル',c.title);if(n!==null){c.title=n.trim()||'無題の章';save();header();draw()}};$('deleteChapter').onclick=()=>{if(w.chapters.length<2){alert('最後の1章は削除できません');return}if(confirm('この章と本文・プロットを削除しますか？')){w.chapters=w.chapters.filter(x=>x.id!==id);if(w.activeChapter===id)w.activeChapter=w.chapters[0].id;save();renderEditor();draw()}}}draw()}
function backup(){modal('バックアップ','<p class="muted">作品・章・本文・プロット・ToDo・用語集・設定をJSON形式で保存します。端末変更やブラウザのデータ消去に備えて、定期的に書き出してください。</p><button id="export" class="primary">バックアップを書き出す</button><hr><div class="field"><label>バックアップを読み込む</label><input id="importFile" type="file" accept=".json,application/json"></div><button id="import">読み込んで置き換える</button>');$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='tsuzuriba-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=async()=>{let f=$('importFile').files[0];if(!f){alert('ファイルを選択してください');return}try{let d=JSON.parse(await f.text());if(!Array.isArray(d.works)||!d.works.length)throw 0;if(confirm('現在のデータを置き換えますか？')){data=d;data.activeWork=data.works[0].id;data.settings||={halfWidth:false,showNotes:true};save();close();renderEditor()}}catch{alert('ファイルを読み込めませんでした')}}}
function tools(){modal('ツール','<div class="grid"><button class="tile" id="proof"><strong>文章の見直しメモ</strong><span>推敲時の確認事項をメモ</span></button><button class="tile" id="gloss"><strong>用語集</strong><span>用語の検索・登録・編集</span></button><button class="tile" id="settings"><strong>表示・文字数設定</strong><span>文字数基準、メモ表示</span></button><button class="tile" id="backupTool"><strong>バックアップ</strong><span>保存データを書き出す</span></button></div><p class="hint" style="margin-top:12px">この版ではデータはこのブラウザ内に保存されます。別端末とは自動同期されないため、バックアップを保管してください。</p>');$('proof').onclick=proof;$('gloss').onclick=glossary;$('settings').onclick=settings;$('backupTool').onclick=backup}function proof(){modal('文章の見直し','<div class="hint">確認の観点：誤字脱字／主語と述語／視点のぶれ／時間・場所のつながり／説明の重複／会話文の話者</div><div class="field" style="margin-top:12px"><label>作品全体の見直しメモ</label><textarea id="proofMemo" placeholder="気になる点、後で確認する点など"></textarea></div><p class="muted">これは確認用メモで、自動校正機能ではありません。</p>');$('proofMemo').value=work().proofMemo||'';foot('保存',()=>{work().proofMemo=$('proofMemo').value;save();close()},true)}function glossary(){let w=work();w.terms||=[];modal('用語集','<input id="termSearch" class="search" placeholder="用語・説明を検索"><div id="terms" class="rows" style="margin-top:10px"></div><hr><div class="field"><label>用語</label><input id="termName"></div><div class="field"><label>説明</label><textarea id="termDesc"></textarea></div><button id="addTerm" class="primary">用語を登録</button>');function draw(){let q=$('termSearch').value.toLowerCase(),box=$('terms');box.innerHTML='';let a=w.terms.filter(t=>(t.name+' '+t.desc).toLowerCase().includes(q));if(!a.length)box.innerHTML='<div class="empty">該当する用語はありません。</div>';a.forEach(t=>{let d=document.createElement('div');d.className='itemrow';d.innerHTML='<div class="rowmain"><div class="rowtitle"></div><div class="rowsub"></div></div><button class="small">編集</button><button class="small danger">削除</button>';d.querySelector('.rowtitle').textContent=t.name;d.querySelector('.rowsub').textContent=t.desc;d.querySelectorAll('button')[0].onclick=()=>{let n=prompt('用語名',t.name);if(n===null)return;let v=prompt('説明',t.desc);if(v===null)return;t.name=n;t.desc=v;save();draw()};d.querySelectorAll('button')[1].onclick=()=>{if(confirm('用語を削除しますか？')){w.terms=w.terms.filter(x=>x.id!==t.id);save();draw()}};box.appendChild(d)})}$('termSearch').oninput=draw;$('addTerm').onclick=()=>{let n=$('termName').value.trim();if(!n){alert('用語名を入力してください');return}w.terms.push({id:uid(),name:n,desc:$('termDesc').value.trim()});save();$('termName').value='';$('termDesc').value='';draw()};draw()}function settings(){modal('表示・文字数設定','<label style="display:flex;gap:8px;margin-bottom:14px"><input type="checkbox" id="half"> <span><strong>半角も1文字として数える</strong><br><span class="muted">オフの場合は全角1、半角0.5の目安で表示します。</span></span></label><label style="display:flex;gap:8px;margin-bottom:14px"><input type="checkbox" id="notes"> <span><strong>プロットの補足メモを表示</strong></span></label><p class="muted">プロットを本文の文字の背面に重ねる機能はこの版では未実装です。現在は左欄のプロットを目標文字数に応じて強調します。</p>');$('half').checked=!!data.settings.halfWidth;$('notes').checked=data.settings.showNotes!==false;foot('保存',()=>{data.settings.halfWidth=$('half').checked;data.settings.showNotes=$('notes').checked;save();close();renderEditor()},true)}
function focusMode(){document.body.classList.toggle('focus-mode');$('focusBtn').textContent=document.body.classList.contains('focus-mode')?'戻る':'集中'}const outsideHandlers={};function dismissLayer(id){if(outsideHandlers[id]){document.removeEventListener('pointerdown',outsideHandlers[id],true);delete outsideHandlers[id]}const old=$('dismiss_'+id);if(old)old.remove()}function showDismiss(id,onClose){dismissLayer(id);const map={chapter:[$('chapterAccordion'),$('chapterBtn')],writing:[$('writeToolsAccordion'),$('writeToolsBtn')],plot:[$('plotPanel'),$('plotRailToggle')]};const inside=map[id]||[];const handler=e=>{if(inside.some(el=>el&&el.contains(e.target)))return;dismissLayer(id);onClose()};outsideHandlers[id]=handler;document.addEventListener('pointerdown',handler,true)}function toggleChapterMenu(){const panel=$('chapterAccordion');if(!panel.classList.contains('hidden')){panel.classList.add('hidden');dismissLayer('chapter');return}chapterList();panel.classList.remove('hidden');showDismiss('chapter',()=>panel.classList.add('hidden'))}function writingTools(){const panel=$('writeToolsAccordion');if(!panel.classList.contains('hidden')){panel.classList.add('hidden');dismissLayer('writing');return}panel.classList.remove('hidden');showDismiss('writing',()=>panel.classList.add('hidden'))}
$('workTitle').onclick=workMenu;$('chapterBtn').onclick=toggleChapterMenu;$('toolsBtn').onclick=tools;$('writeToolsBtn').onclick=writingTools;/* toolRuby is created dynamically inside renderPlotToolList; its handler is attached there. */$('focusBtn').onclick=focusMode;$('addPlot').onclick=()=>{let t=prompt('プロットの内容');if(t===null)return;chapter().plots.push({id:uid(),text:t,note:'',target:0,done:false});save();renderPlots()};$('addTodo').onclick=()=>editTodo(null);$('editor').oninput=()=>{chapter().body=$('editor').value;save();updateCount()};$('rubyBtn').onclick=()=>{let ta=$('editor'),s=ta.selectionStart,e=ta.selectionEnd,txt=ta.value.slice(s,e);if(!txt){alert('先に本文の文字を選択してください。');return}let r=prompt('「'+txt+'」の読み方');if(r===null||!r.trim())return;ta.setRangeText('｜'+txt+'《'+r.trim()+'》',s,e,'end');chapter().body=ta.value;save();updateCount();ta.focus()};$('currentPlotBtn').onclick=()=>{let p=chapter().plots.find(x=>!x.done);alert(p?'現在の目安：'+(p.text||'（内容未入力）')+(p.note?'\nメモ：'+p.note:''):'未完了のプロットはありません')};if(window.matchMedia('(max-width:760px)').matches||localStorage.getItem('tsuzuriba_plot_rail')==='1')$('plotPanel').classList.add('rail');$('plotRailToggle').onclick=()=>{let p=$('plotPanel');if(p.classList.contains('rail')){p.classList.remove('rail');localStorage.setItem('tsuzuriba_plot_rail','0');showDismiss('plot',()=>{p.classList.add('rail');localStorage.setItem('tsuzuriba_plot_rail','1')})}else{p.classList.add('rail');localStorage.setItem('tsuzuriba_plot_rail','1');dismissLayer('plot')}};renderEditor();
/* v9: stable tools and body-linked plot checkboxes */
const originalRenderPlots=renderPlots;
function renderPlotToolList(){
 const panel=$('writeToolsAccordion'); if(!panel)return;
 const plots=chapter().plots||[];
 let html='<div class="plot-tool-head">この章のプロット</div>';
 if(!plots.length) html+='<p class="muted" style="padding:5px">まだプロットはありません。下の「＋プロット追加」から登録できます。</p>';
 plots.forEach((p,i)=>{html+='<label class="plot-tool-row"><input type="checkbox" data-plot-check="'+i+'" '+(p.done?'checked':'')+'><span class="plot-tool-text"><strong>'+(i+1)+'.</strong> '+esc(p.text||'（内容未入力）')+'</span></label>'});
 html+='<button type="button" class="tile" id="toolAddPlot"><strong>＋ プロット追加</strong><span>チェック項目を増やす</span></button><div class="plot-tool-head" style="border-top:1px solid #ddd9d080;margin-top:6px;padding-top:8px">執筆ツール</div><button type="button" class="tile" id="toolRuby"><strong>ルビを付ける</strong><span>選択範囲に読みを付ける</span></button>';
 panel.innerHTML=html;
 panel.querySelectorAll('[data-plot-check]').forEach(el=>el.onchange=()=>{const p=chapter().plots[Number(el.dataset.plotCheck)];if(!p)return;p.done=el.checked;save();originalRenderPlots();renderPlotToolList();renderInlinePlotRail()});
 const add=$('toolAddPlot');if(add)add.onclick=()=>{const t=prompt('プロットの内容');if(t===null||!t.trim())return;chapter().plots.push({id:uid(),text:t.trim(),note:'',target:0,done:false});save();originalRenderPlots();renderPlotToolList();renderInlinePlotRail()};
 const ruby=$('toolRuby');if(ruby)ruby.onclick=()=>{closeWritingTools();$('rubyBtn').click()};
}
function closeWritingTools(){const panel=$('writeToolsAccordion');panel.classList.add('hidden');dismissLayer('writing')}
function writingTools(){const panel=$('writeToolsAccordion');if(!panel)return;if(!panel.classList.contains('hidden')){closeWritingTools();return}renderPlotToolList();panel.classList.remove('hidden')}
$('writeToolsBtn').onclick=writingTools;
// Bubble-phase outside click avoids intercepting the initial touch/click on other controls.

function renderInlinePlotRail(){
 const rail=$('inlinePlotRail'),ta=$('editor');if(!rail||!ta)return;
 rail.innerHTML='';const plots=chapter().plots||[];if(!plots.length)return;
 const style=getComputedStyle(ta),lineHeight=parseFloat(style.lineHeight)||32,fontSize=parseFloat(style.fontSize)||16;
 const charsPerLine=Math.max(8,Math.floor((ta.clientWidth||300)/(fontSize*.54)));
 const maxScroll=Math.max(ta.scrollHeight,ta.clientHeight);
 plots.forEach((p,i)=>{
   let y;
   if(Number(p.target)>0)y=(Number(p.target)/charsPerLine)*lineHeight;
   else y=plots.length===1?lineHeight/2:(ta.clientHeight-24)*(i/(plots.length-1));
   y=Math.max(14,Math.min(maxScroll-14,y-ta.scrollTop));
   const b=document.createElement('button');b.type='button';b.className='inline-plot-check'+(p.done?' done':'')+(!p.done&&i===plots.findIndex(x=>!x.done)?' current':'');b.style.top=y+'px';b.textContent=p.done?'✓':String(i+1);b.title=(p.text||'プロット')+'（チェック切替）';b.setAttribute('aria-label',(p.text||'プロット')+' 完了状態を切り替え');b.onclick=()=>{p.done=!p.done;save();originalRenderPlots();renderPlotToolList();renderInlinePlotRail()};rail.appendChild(b);
 });
}

// Add goal line as a visual guide in the editor area, based on estimated text lines.
function updateGoalLine(){const wrap=document.querySelector('.editorwrap'),ta=$('editor');if(!wrap||!ta)return;let line=wrap.querySelector('.goal-line');if(!line){line=document.createElement('div');line.className='goal-line';wrap.appendChild(line)}const c=chapter(),target=Number(c.target)||Number(work().target)||0;if(!target){line.style.display='none';return}const st=getComputedStyle(ta),lh=parseFloat(st.lineHeight)||32,fs=parseFloat(st.fontSize)||16,chars=Math.max(8,Math.floor((ta.clientWidth||300)/(fs*.54)));let y=22+Math.ceil(target/chars)*lh-ta.scrollTop;if(y<0||y>ta.clientHeight){line.style.display='none';return}line.style.display='block';line.style.top=y+'px';line.innerHTML='<span class="goal-line-label">目標 '+target.toLocaleString()+'文字</span>'}

// Chapter picker uses a native scrollable selection list; long-press a row to edit it.
const oldChapterList=chapterList;
chapterList=function(){const w=work(),panel=$('chapterAccordion');panel.innerHTML='';const title=document.createElement('div');title.className='muted';title.textContent='章を選択（長押しで編集）';panel.appendChild(title);const sel=document.createElement('select');sel.className='plot-picker';sel.size=Math.min(5,Math.max(2,w.chapters.length));w.chapters.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.title||'無題の章';o.selected=c.id===chapter().id;sel.appendChild(o)});sel.onchange=()=>{w.activeChapter=sel.value;save();renderEditor();chapterList()};panel.appendChild(sel);const current=document.createElement('div');current.className='plot-current';current.textContent=chapter().detail||'章の詳細は未設定です';panel.appendChild(current);const actions=document.createElement('div');actions.className='plot-tool-actions';actions.innerHTML='<button type="button" id="chapterEditNow">章を編集</button><button type="button" id="chapterAddNow">＋ 章を追加</button>';panel.appendChild(actions);$('chapterEditNow').onclick=()=>editChapter(chapter());$('chapterAddNow').onclick=()=>{const t=prompt('章の名前','第'+(w.chapters.length+1)+'章');if(t===null)return;const c={id:uid(),title:t,detail:'',body:'',plots:[],target:0};w.chapters.push(c);w.activeChapter=c.id;save();renderEditor();chapterList()};let timer;sel.addEventListener('touchstart',()=>{timer=setTimeout(()=>editChapter(chapter()),650)},{passive:true});['touchend','touchmove','touchcancel'].forEach(ev=>sel.addEventListener(ev,()=>clearTimeout(timer),{passive:true}));}
function editChapter(c){const t=prompt('章の名前',c.title||'');if(t===null)return;const d=prompt('章の詳細（この章の目的・内容など）',c.detail||'');if(d===null)return;const target=prompt('この章の目標文字数（0で未設定）',String(c.target||0));if(target===null)return;c.title=t.trim()||'無題の章';c.detail=d;c.target=Math.max(0,Number(target)||0);save();header();renderEditor();chapterList()}

// Writing tools: one selected plot at a time, details, scroll-to-position, edit/add.
function renderPlotToolList(){const panel=$('writeToolsAccordion');if(!panel)return;const c=chapter(),plots=c.plots||[];panel.innerHTML='<div class="plot-tool-head">この章のプロット</div>';if(!plots.length){panel.innerHTML+='<div class="muted" style="padding:6px">プロットはまだありません。</div>'}else{const sel=document.createElement('select');sel.className='plot-picker';sel.id='plotPicker';plots.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+(p.text||'内容未入力');sel.appendChild(o)});let selected=Math.max(0,plots.findIndex(p=>!p.done));sel.value=String(selected);panel.appendChild(sel);const detail=document.createElement('div');detail.className='plot-current';detail.id='selectedPlotDetail';panel.appendChild(detail);const buttons=document.createElement('div');buttons.className='plot-tool-actions';buttons.innerHTML='<button id="plotJump">本文の目安へ</button><button id="plotEdit">編集</button><button id="plotAddNew">＋追加</button>';panel.appendChild(buttons);function show(){const p=plots[Number(sel.value)];detail.textContent=(p.text||'内容未入力')+(p.note?'\n\n詳細：'+p.note:'')+'\n\n'+(p.done?'✓ 完了':'未完了')+(p.target?' ・ 目安 '+p.target+'文字':'');}sel.onchange=show;show();$('plotJump').onclick=()=>{const p=plots[Number(sel.value)];if(!p)return;const ta=$('editor'),n=Number(p.target)||countChars(ta.value);const ratio=countChars(ta.value)?Math.min(1,n/Math.max(1,countChars(ta.value))):0;ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);ta.scrollTop=Math.max(0,ratio*ta.scrollHeight-ta.clientHeight/2);};$('plotEdit').onclick=()=>{const p=plots[Number(sel.value)];if(!p)return;const text=prompt('プロット',p.text||'');if(text===null)return;const note=prompt('詳細・補足',p.note||'');if(note===null)return;const target=prompt('このプロットまでの目安文字数（累計）',String(p.target||0));if(target===null)return;p.text=text;p.note=note;p.target=Math.max(0,Number(target)||0);save();originalRenderPlots();renderPlotToolList();renderInlinePlotRail()};$('plotAddNew').onclick=()=>{const text=prompt('追加するプロット');if(text===null||!text.trim())return;const note=prompt('詳細・補足（省略可）','')||'';const target=Number(prompt('本文の累計目安文字数（0で未設定）','0'))||0;plots.push({id:uid(),text:text.trim(),note,target:Math.max(0,target),done:false});save();originalRenderPlots();renderPlotToolList();renderInlinePlotRail()};}
const rest=document.createElement('div');rest.className='plot-tool-head';rest.textContent='執筆ツール';panel.appendChild(rest);const ruby=document.createElement('button');ruby.className='tile';ruby.innerHTML='<strong>ルビを付ける</strong><span>本文で文字を選択してから押す</span>';ruby.onclick=()=>{closeWritingTools();const ta=$('editor'),s=ta.selectionStart,e=ta.selectionEnd,txt=ta.value.slice(s,e);if(!txt){alert('先に本文の文字を選択してください。');return}const r=prompt('「'+txt+'」の読み方');if(r===null||!r.trim())return;ta.setRangeText('｜'+txt+'《'+r.trim()+'》',s,e,'end');chapter().body=ta.value;save();updateCount();ta.focus()};panel.appendChild(ruby);const goals=document.createElement('button');goals.className='tile';goals.innerHTML='<strong>目標文字数</strong><span>作品・章それぞれに設定</span>';goals.onclick=()=>{const w=work(),c=chapter();const wt=prompt('作品全体の目標文字数（0で未設定）',String(w.target||0));if(wt===null)return;const ct=prompt('この章の目標文字数（0で未設定）',String(c.target||0));if(ct===null)return;w.target=Math.max(0,Number(wt)||0);c.target=Math.max(0,Number(ct)||0);save();refreshChapterDetails();renderPlotToolList()};panel.appendChild(goals)}

// Allow long-press drag to reposition both floating tool buttons, saved for this browser.
function makeDraggable(el,key){let timer=null,startX=0,startY=0,dragging=false,ox=0,oy=0;try{const pos=JSON.parse(localStorage.getItem(key)||'null');if(pos){el.style.left=pos.x+'px';el.style.top=pos.y+'px';el.style.right='auto';el.style.bottom='auto'}}catch{}el.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;dragging=false;timer=setTimeout(()=>{dragging=true;el.classList.add('dragging');el.setPointerCapture?.(e.pointerId)},500)});el.addEventListener('pointermove',e=>{if(!timer||!dragging)return;const dx=e.clientX-startX,dy=e.clientY-startY;const rect=el.getBoundingClientRect();el.style.left=Math.max(0,Math.min(innerWidth-rect.width,rect.left+dx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-rect.height,rect.top+dy))+'px';el.style.right='auto';el.style.bottom='auto';startX=e.clientX;startY=e.clientY});el.addEventListener('pointerup',()=>{if(timer)clearTimeout(timer);timer=null;if(dragging){const r=el.getBoundingClientRect();localStorage.setItem(key,JSON.stringify({x:r.left,y:r.top}));el.classList.remove('dragging');setTimeout(()=>dragging=false,80)}});el.addEventListener('click',e=>{if(dragging){e.preventDefault();e.stopImmediatePropagation();dragging=false}},true)}
