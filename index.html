<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f2ed"><title>綴り場</title>
<style>
:root{--bg:#f4f2ed;--paper:#fffefa;--ink:#292a2d;--muted:#777a80;--line:#ddd9d0;--accent:#566b82;--soft:#e8edf2;--danger:#a13d3d;--shadow:0 8px 24px #20242a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8da9c5;outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:#f4f2edee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px}.toprow{display:flex;align-items:center;gap:10px;max-width:900px;margin:auto}.brand{font-weight:800;letter-spacing:.08em;font-size:1.1rem;white-space:nowrap}.work-select{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px}.iconbtn,.btn{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px 12px;color:var(--ink)}.stats{max-width:900px;margin:8px auto 0;display:flex;align-items:center;gap:12px;font-size:.88rem;color:var(--muted)}.stats strong{color:var(--ink)}.progress{height:4px;background:#e3e0d9;border-radius:9px;overflow:hidden;flex:1}.progress span{display:block;height:100%;width:0;background:var(--accent)}main{max-width:900px;margin:20px auto;padding:0 14px 100px}.chapter-head{padding:18px 18px 12px;background:var(--paper);border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation}.eyebrow{font-size:.78rem;color:var(--muted);margin-bottom:3px}.chapter-title-row{display:flex;align-items:center;gap:10px}.chapter-title{font-size:1.25rem;font-weight:750;flex:1;min-width:0;overflow-wrap:anywhere}.tap-hint{color:var(--muted);font-size:.8rem;white-space:nowrap}.chapter-detail{font-size:.9rem;color:#666b71;white-space:pre-wrap;margin-top:9px}.editor-wrap{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;box-shadow:var(--shadow);overflow:hidden}.editor{display:block;width:100%;min-height:55vh;resize:vertical;border:0;background:transparent;padding:20px;font-size:1.02rem;line-height:1.9;color:var(--ink)}.editor:focus{outline:none}.editor-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 14px;color:var(--muted);font-size:.82rem}.save-state{color:var(--muted)}.hidden{display:none!important}.focus-mode .stats,.focus-mode .chapter-detail,.focus-mode .editor-foot,.focus-mode .tap-hint{display:none!important}.focus-mode main{margin-top:8px}.focus-mode .chapter-head{border-radius:14px 14px 0 0}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#17191dcc;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{background:var(--paper);width:min(100%,620px);max-height:88dvh;overflow:auto;border-radius:20px 20px 14px 14px;padding:18px;box-shadow:0 20px 60px #0003}.modal h2{font-size:1.15rem;margin:0 0 14px}.field{display:block;margin:12px 0}.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:white;padding:10px}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:var(--danger);border-color:#d9aaaa}.chapter-list{display:flex;flex-direction:column;gap:8px}.chapter-item{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;background:white}.chapter-pick{border:0;background:transparent;text-align:left;flex:1;min-width:0;padding:4px}.chapter-pick strong{display:block;overflow-wrap:anywhere}.chapter-pick small{color:var(--muted)}.chapter-item.active{border-color:var(--accent);background:var(--soft)}.mini-actions{display:flex;gap:5px}.mini-actions button{padding:7px 8px;font-size:.82rem;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.empty{color:var(--muted);padding:10px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#292a2d;color:white;border-radius:99px;padding:8px 14px;z-index:30;font-size:.85rem;max-width:90vw}.settings-panel{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:16px;margin-top:14px}.settings-panel h3{margin:0 0 8px;font-size:1rem}.target-row{display:flex;align-items:center;gap:8px}.target-row input{width:100px;border:1px solid var(--line);border-radius:8px;padding:7px}
@media(min-width:650px){.modal-backdrop{align-items:center}.modal{border-radius:18px}.editor{min-height:65vh;padding:26px;font-size:1.08rem}}
</style></head>
<body>
<header class="top" id="topBar"><div class="toprow"><div class="brand">綴り場</div><select class="work-select" id="workSelect" aria-label="作品を選択"></select><button class="iconbtn" id="newWorkBtn" type="button" aria-label="作品を追加">＋作品</button><button class="iconbtn" id="focusBtn" type="button">集中</button></div><div class="stats"><span>作品文字数 <strong id="workCount">0</strong></span><span>/</span><span>目標 <strong id="workTarget">0</strong></span><div class="progress"><span id="progressBar"></span></div></div></header>
<main><section class="chapter-head" id="chapterHead" role="button" tabindex="0" aria-label="章の選択・管理"><div class="eyebrow" id="chapterNumber">第1章</div><div class="chapter-title-row"><div class="chapter-title" id="chapterTitle">はじまり</div><div class="tap-hint">章を管理 ›</div></div><div class="chapter-detail" id="chapterDetail"></div></section><section class="editor-wrap"><textarea class="editor" id="bodyEditor" placeholder="ここから物語を書き始めましょう…" spellcheck="false"></textarea><div class="editor-foot"><span id="chapterCount">章の文字数 0</span><span class="save-state" id="saveState">自動保存</span></div></section><section class="settings-panel hidden" id="settingsPanel"><h3>作品設定</h3><label class="field"><span>作品タイトル</span><input id="settingsTitle" type="text"></label><label class="field"><span>目標文字数</span><div class="target-row"><input id="settingsTarget" type="number" min="0" step="100" value="10000"><span>文字</span><button class="btn primary" id="saveSettingsBtn" type="button">保存</button></div></label></section></main>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const STORAGE_KEY='tsuzuriba_rebuild_v1';
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const makeChapter=(title='新しい章')=>({id:uid(),title,detail:'',body:''});
const initial=()=>{const c=makeChapter('はじまり');return {activeWorkId:'work1',works:[{id:'work1',title:'新しい作品',target:10000,activeChapterId:c.id,chapters:[c]}]}};
let state;
try{state=JSON.parse(localStorage.getItem(STORAGE_KEY))||initial()}catch{state=initial()}
function normalize(){if(!state||!Array.isArray(state.works)||!state.works.length)state=initial();state.works.forEach(w=>{if(!Array.isArray(w.chapters)||!w.chapters.length)w.chapters=[makeChapter('はじまり')];if(!w.chapters.some(c=>c.id===w.activeChapterId))w.activeChapterId=w.chapters[0].id;if(!Number.isFinite(+w.target))w.target=10000});if(!state.works.some(w=>w.id===state.activeWorkId))state.activeWorkId=state.works[0].id}
normalize();
let focus=false,saveTimer=null;
const work=()=>state.works.find(w=>w.id===state.activeWorkId)||state.works[0];
const chapter=()=>work().chapters.find(c=>c.id===work().activeChapterId)||work().chapters[0];
const count=s=>(s||'').replace(/\s/g,'').length;
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$('saveState').textContent='保存済み'}catch{$('saveState').textContent='保存できません（容量等を確認）'}}
function scheduleSave(){ $('saveState').textContent='保存中…';clearTimeout(saveTimer);saveTimer=setTimeout(persist,180)}
function render(){const w=work(),c=chapter();$('workSelect').innerHTML=state.works.map(x=>`<option value="${escapeHtml(x.id)}" ${x.id===w.id?'selected':''}>${escapeHtml(x.title||'無題の作品')}</option>`).join('');$('chapterNumber').textContent=`第${w.chapters.findIndex(x=>x.id===c.id)+1}章`;$('chapterTitle').textContent=c.title||'無題の章';$('chapterDetail').textContent=c.detail||'';$('chapterDetail').classList.toggle('hidden',!c.detail);$('bodyEditor').value=c.body||'';updateCounts();$('settingsTitle').value=w.title||'';$('settingsTarget').value=w.target||0;document.body.classList.toggle('focus-mode',focus);$('focusBtn').textContent=focus?'通常':'集中';}
function updateCounts(){const w=work(),total=w.chapters.reduce((n,c)=>n+count(c.body),0),target=Math.max(0,+w.target||0);$('workCount').textContent=total.toLocaleString('ja-JP');$('workTarget').textContent=target.toLocaleString('ja-JP');$('chapterCount').textContent=`章の文字数 ${count(chapter().body).toLocaleString('ja-JP')}`;$('progressBar').style.width=(target?Math.min(100,total/target*100):0)+'%'}
function toast(msg){$('toastRoot').innerHTML=`<div class="toast">${escapeHtml(msg)}</div>`;setTimeout(()=>$('toastRoot').replaceChildren(),1800)}
function closeModal(){$('modalRoot').replaceChildren()}
function showModal(title,content,actions){$('modalRoot').innerHTML=`<div class="modal-backdrop" data-close="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><h2>${escapeHtml(title)}</h2>${content}<div class="modal-actions">${actions}</div></section></div>`;$('modalRoot').querySelector('[data-close="backdrop"]').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()})}
function chapterManager(){const w=work();const rows=w.chapters.map((c,i)=>`<div class="chapter-item ${c.id===w.activeChapterId?'active':''}"><button type="button" class="chapter-pick" data-action="pick" data-id="${escapeHtml(c.id)}"><strong>${i+1}. ${escapeHtml(c.title||'無題の章')} ${c.id===w.activeChapterId?'（執筆中）':''}</strong><small>${count(c.body).toLocaleString('ja-JP')}文字${c.detail?' ・ 詳細あり':''}</small></button><div class="mini-actions"><button type="button" data-action="edit" data-id="${escapeHtml(c.id)}">編集</button><button type="button" data-action="delete" data-id="${escapeHtml(c.id)}">削除</button></div></div>`).join('');showModal('章の管理',`<div class="chapter-list">${rows}</div>`,`<button type="button" class="btn" data-modal-action="close">閉じる</button><button type="button" class="btn primary" data-modal-action="add">＋ 章を追加</button>`);$('modalRoot').querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id,action=b.dataset.action;if(action==='pick'){w.activeChapterId=id;persist();render();closeModal();toast('章を切り替えました')}else if(action==='edit')editChapter(id);else if(action==='delete')deleteChapter(id)}));$('modalRoot').querySelector('[data-modal-action="close"]').addEventListener('click',closeModal);$('modalRoot').querySelector('[data-modal-action="add"]').addEventListener('click',()=>editChapter(null));}
function editChapter(id){const w=work(),old=w.chapters.find(c=>c.id===id),isNew=!old,c=old||{title:`第${w.chapters.length+1}章`,detail:'',body:''};showModal(isNew?'章を追加':'章を編集',`<label class="field"><span>章タイトル</span><input id="chapterEditTitle" maxlength="120" value="${escapeHtml(c.title)}" placeholder="章タイトル"></label><label class="field"><span>章の詳細・メモ</span><textarea id="chapterEditDetail" placeholder="この章のあらすじやメモ">${escapeHtml(c.detail||'')}</textarea></label>`,`<button type="button" class="btn" id="chapterEditCancel">戻る</button><button type="button" class="btn primary" id="chapterEditSave">保存</button>`);$('chapterEditCancel').addEventListener('click',chapterManager);$('chapterEditSave').addEventListener('click',()=>{const title=$('chapterEditTitle').value.trim()||'無題の章',detail=$('chapterEditDetail').value;if(isNew){const fresh=makeChapter(title);fresh.detail=detail;w.chapters.push(fresh);w.activeChapterId=fresh.id}else{old.title=title;old.detail=detail}persist();render();chapterManager();toast(isNew?'章を追加しました':'章を更新しました')});}
function deleteChapter(id){const w=work();if(w.chapters.length<=1){toast('最後の1章は削除できません');return}const c=w.chapters.find(x=>x.id===id);if(!c)return;showModal('章を削除',`<p>「${escapeHtml(c.title||'無題の章')}」を削除しますか？</p><p>本文も一緒に削除されます。この操作は取り消せません。</p>`,`<button type="button" class="btn" id="deleteCancel">キャンセル</button><button type="button" class="btn danger" id="deleteConfirm">削除する</button>`);$('deleteCancel').addEventListener('click',chapterManager);$('deleteConfirm').addEventListener('click',()=>{w.chapters=w.chapters.filter(x=>x.id!==id);if(w.activeChapterId===id)w.activeChapterId=w.chapters[0].id;persist();render();chapterManager();toast('章を削除しました')});}
function addWork(){showModal('作品を追加',`<label class="field"><span>作品タイトル</span><input id="newWorkTitle" maxlength="120" placeholder="新しい作品"></label><label class="field"><span>目標文字数</span><input id="newWorkTarget" type="number" min="0" value="10000"></label>`,`<button type="button" class="btn" id="newWorkCancel">キャンセル</button><button type="button" class="btn primary" id="newWorkSave">作成</button>`);$('newWorkCancel').addEventListener('click',closeModal);$('newWorkSave').addEventListener('click',()=>{const c=makeChapter('はじまり'),w={id:uid(),title:$('newWorkTitle').value.trim()||'無題の作品',target:Math.max(0,+$('newWorkTarget').value||0),activeChapterId:c.id,chapters:[c]};state.works.push(w);state.activeWorkId=w.id;persist();render();closeModal();toast('作品を作成しました')})}
$('bodyEditor').addEventListener('input',e=>{chapter().body=e.target.value;updateCounts();scheduleSave()});$('chapterHead').addEventListener('click',chapterManager);$('chapterHead').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chapterManager()}});$('workSelect').addEventListener('change',e=>{state.activeWorkId=e.target.value;persist();render()});$('newWorkBtn').addEventListener('click',addWork);$('focusBtn').addEventListener('click',()=>{focus=!focus;document.body.classList.toggle('focus-mode',focus);$('focusBtn').textContent=focus?'通常':'集中'});$('saveSettingsBtn').addEventListener('click',()=>{const w=work();w.title=$('settingsTitle').value.trim()||'無題の作品';w.target=Math.max(0,+$('settingsTarget').value||0);persist();render();toast('作品設定を保存しました')});
// Settings are reachable by tapping the work title in the top bar.
$('workSelect').addEventListener('dblclick',()=>{$('settingsPanel').classList.toggle('hidden')});
// Long press is intentionally avoided; settings open via a small, explicit title action.
const settingsBtn=document.createElement('button');settingsBtn.type='button';settingsBtn.className='iconbtn';settingsBtn.textContent='設定';settingsBtn.addEventListener('click',()=>{$('settingsPanel').classList.toggle('hidden');if(!$('settingsPanel').classList.contains('hidden'))$('settingsPanel').scrollIntoView({behavior:'smooth',block:'nearest'})});$('topBar').querySelector('.toprow').insertBefore(settingsBtn,$('focusBtn'));
render();
})();
</script></body></html>
