<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f2ed"><title>綴り場</title>
<style>
:root{--bg:#f4f2ed;--paper:#fffefa;--ink:#292a2d;--muted:#777a80;--line:#ddd9d0;--accent:#566b82;--soft:#e8edf2;--danger:#a13d3d;--shadow:0 8px 24px #20242a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8da9c5;outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:#f4f2edee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px}.toprow{display:flex;align-items:center;gap:10px;max-width:900px;margin:auto}
.brand-btn{background:transparent;border:0;padding:4px 6px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:1.05rem;color:var(--ink);border-radius:8px}
.brand-btn:hover{background:var(--soft)}
.current-work-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.95rem;color:var(--muted);text-align:left;padding:6px 8px;border:1px dashed var(--line);border-radius:8px;background:var(--paper);cursor:pointer}
.current-work-title:hover{border-color:var(--accent);color:var(--ink)}
.iconbtn,.btn{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px 12px;color:var(--ink)}.stats{max-width:900px;margin:8px auto 0;display:flex;align-items:center;gap:12px;font-size:.88rem;color:var(--muted)}.stats strong{color:var(--ink)}.progress{height:4px;background:#e3e0d9;border-radius:9px;overflow:hidden;flex:1}.progress span{display:block;height:100%;width:0;background:var(--accent)}main{max-width:900px;margin:20px auto;padding:0 14px 40px}.chapter-head{padding:18px 18px 12px;background:var(--paper);border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation}.eyebrow{font-size:.78rem;color:var(--muted);margin-bottom:3px}.chapter-title-row{display:flex;align-items:center;gap:10px}.chapter-title{font-size:1.25rem;font-weight:750;flex:1;min-width:0;overflow-wrap:anywhere}.tap-hint{color:var(--muted);font-size:.80rem;white-space:nowrap}.chapter-detail{font-size:.9rem;color:#666b71;white-space:pre-wrap;margin-top:9px}.editor-wrap{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;box-shadow:var(--shadow);overflow:hidden}.editor{display:block;width:100%;min-height:55vh;resize:vertical;border:0;background:transparent;padding:20px;font-size:1.02rem;line-height:1.9;color:var(--ink)}.editor:focus{outline:none}.editor-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 14px;color:var(--muted);font-size:.82rem}.save-state{color:var(--muted)}.hidden{display:none!important}.focus-mode .stats,.focus-mode .chapter-detail,.focus-mode .editor-foot,.focus-mode .tap-hint,.focus-mode .app-version-footer{display:none!important}.focus-mode main{margin-top:8px}.focus-mode .chapter-head{border-radius:14px 14px 0 0}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#17191dcc;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{background:var(--paper);width:min(100%,620px);max-height:88dvh;overflow:auto;border-radius:20px 20px 14px 14px;padding:18px;box-shadow:0 20px 60px #0003}.modal h2{font-size:1.15rem;margin:0 0 14px}.field{display:block;margin:12px 0}.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:white;padding:10px}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:var(--danger);border-color:#d9aaaa}.chapter-list,.work-list{display:flex;flex-direction:column;gap:8px}.chapter-item,.work-item{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;background:white}.chapter-pick,.work-pick{border:0;background:transparent;text-align:left;flex:1;min-width:0;padding:4px}.chapter-pick strong,.work-pick strong{display:block;overflow-wrap:anywhere}.chapter-pick small,.work-pick small{color:var(--muted)}.chapter-item.active,.work-item.active{border-color:var(--accent);background:var(--soft)}.mini-actions{display:flex;gap:5px}.mini-actions button{padding:7px 8px;font-size:.82rem;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.empty{color:var(--muted);padding:10px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#292a2d;color:white;border-radius:99px;padding:8px 14px;z-index:30;font-size:.85rem;max-width:90vw}.settings-panel{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:16px;margin-top:14px}.settings-panel h3{margin:0 0 8px;font-size:1rem}.target-row{display:flex;align-items:center;gap:8px}.target-row input{width:100px;border:1px solid var(--line);border-radius:8px;padding:7px}
.app-version-footer{max-width:900px;margin:20px auto 10px;text-align:center;font-size:0.78rem;color:var(--muted)}
@media(min-width:650px){.modal-backdrop{align-items:center}.modal{border-radius:18px}.editor{min-height:65vh;padding:26px;font-size:1.08rem}}
</style></head>
<body>
<header class="top" id="topBar">
  <div class="toprow">
    <button class="brand-btn" id="brandBtn" type="button" title="綴り場について">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.5 7.5"></path></svg>
      <span style="font-size:0.9rem;">綴り場</span>
    </button>
    <button class="current-work-title" id="currentWorkTitle" type="button" title="作品を選択・切り替え">作品名読み込み中…</button>
    <button class="iconbtn" id="focusBtn" type="button">集中</button>
  </div>
  <div class="stats"><span>作品文字数 <strong id="workCount">0</strong></span><span>/</span><span>目標 <strong id="workTarget">0</strong></span><div class="progress"><span id="progressBar"></span></div></div>
</header>
<main>
  <section class="chapter-head" id="chapterHead" role="button" tabindex="0" aria-label="章の選択・管理">
    <div class="eyebrow" id="chapterNumber">第1章</div>
    <div class="chapter-title-row">
      <div class="chapter-title" id="chapterTitle">はじまり</div>
      <div class="tap-hint">章を管理 ›</div>
    </div>
    <div class="chapter-detail" id="chapterDetail"></div>
  </section>
  <section class="editor-wrap">
    <textarea class="editor" id="bodyEditor" placeholder="ここから物語を書き始めましょう…" spellcheck="false"></textarea>
    <div class="editor-foot">
      <span id="chapterCount">章の文字数 0</span>
      <span class="save-state" id="saveState">自動保存</span>
    </div>
  </section>
  <section class="settings-panel hidden" id="settingsPanel">
    <h3>作品設定</h3>
    <label class="field"><span>作品タイトル</span><input id="settingsTitle" type="text"></label>
    <label class="field"><span>目標文字数
