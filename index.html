<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>綴り場</title>
<style>
:root{--bg:#f4f2ed;--paper:#fffefa;--ink:#292a2d;--muted:#777a80;--line:#ddd9d0;--accent:#566b82;--soft:#e8edf2;--shadow:0 8px 24px #20242a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:9px;padding:8px 11px;color:var(--ink)}button:hover{background:#f4f5f6}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.small{font-size:12px;padding:5px 8px}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fffefaed;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.icon{font-size:20px}.worktitle{border:0;background:transparent;text-align:left;font-weight:700;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.grow{flex:1}.chapterbtn{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}main{max-width:1450px;margin:auto;padding:13px;display:grid;grid-template-columns:minmax(220px,290px) minmax(0,1fr);gap:13px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);min-width:0}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}.head h2{font-size:15px;margin:0}.body{padding:11px}.plotpanel{position:sticky;top:62px;max-height:calc(100dvh - 75px);overflow:auto}.muted{color:var(--muted);font-size:12px;line-height:1.55}.plot{padding:9px;border:1px solid var(--line);border-radius:10px;background:white;margin:8px 0}.plot.active{border-color:var(--accent);box-shadow:0 0 0 2px #566b821b}.plot.done .plottext{text-decoration:line-through;color:var(--muted)}.plotline{display:flex;gap:7px;align-items:flex-start}.plotline input{margin-top:5px;accent-color:var(--accent)}.plottext{flex:1;min-width:0;font-size:13px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}.plotmeta{display:flex;gap:5px;align-items:center;margin:7px 0 0 24px;flex-wrap:wrap}.plotmeta input{width:75px;border:1px solid var(--line);border-radius:7px;padding:5px;font-size:12px}.plotnote{width:100%;margin-top:7px;padding:7px;border:1px solid var(--line);border-radius:7px;font-size:12px;min-height:36px}.plotactions{display:flex;justify-content:flex-end;gap:5px;margin-top:6px}.progress{height:6px;background:#e8e6e1;border-radius:99px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--accent);width:0}.editorhead{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}.editorhead h2{font-size:15px;margin:0}.edittools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line)}.editor{display:block;width:100%;min-height:55vh;resize:vertical;border:0;outline:0;background:transparent;color:var(--ink);padding:22px clamp(15px,4vw,55px);font-size:16px;line-height:2;letter-spacing:.02em}.editor:focus{box-shadow:inset 0 0 0 2px #566b8214}.editfoot{padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.todo{margin-top:12px}.todorow{display:flex;gap:7px;align-items:flex-start;margin:7px 0;font-size:13px}.todorow span{flex:1}.todorow.done span{text-decoration:line-through;color:var(--muted)}.fab{position:fixed;right:16px;bottom:16px;z-index:20;border-radius:999px;padding:12px 16px;box-shadow:0 5px 20px #1e293b30;background:var(--accent);color:white;border:0;font-weight:650}.overlay{position:fixed;inset:0;background:#171a1f66;z-index:30;display:flex;align-items:center;justify-content:center;padding:13px}.modal{width:min(640px,100%);max-height:88dvh;overflow:auto;background:var(--paper);border-radius:15px;box-shadow:0 20px 70px #0003}.mhead,.mfoot{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}.mhead h2{font-size:17px;margin:0}.mfoot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;flex-wrap:wrap}.mbody{padding:15px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select,.search{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.field textarea{min-height:75px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{text-align:left;padding:12px}.tile strong{display:block;margin-bottom:4px}.tile span{font-size:12px;color:var(--muted)}.rows{display:flex;flex-direction:column;gap:8px}.itemrow{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:9px}.rowmain{flex:1;min-width:0}.rowtitle{font-weight:650;font-size:14px;overflow-wrap:anywhere}.rowsub{font-size:12px;color:var(--muted);margin-top:3px}.empty{text-align:center;padding:16px;color:var(--muted);font-size:13px}.hint{background:var(--soft);padding:10px;border-radius:9px;font-size:12px;line-height:1.6}.danger{color:#a43f3f}.hidden{display:none!important}hr{border:0;border-top:1px solid var(--line);margin:15px 0}
@media(max-width:760px){main{grid-template-columns:1fr;padding:9px;gap:10px}.plotpanel{position:static;order:2;max-height:none}.writing{order:1}.editor{min-height:48vh;padding:16px 14px}.top{padding:8px}.worktitle{max-width:43vw;font-size:14px}.chapterbtn{max-width:42vw;font-size:12px;padding:7px}.grid{grid-template-columns:1fr 1fr}}

/* v4 adjustments */
.plotpanel.rail{width:44px;min-width:44px;overflow:hidden}.plotpanel.rail .head{justify-content:center;padding:7px 3px}.plotpanel.rail .head h2,.plotpanel.rail .head #addPlot,.plotpanel.rail .body{display:none}.plotpanel.rail #plotRailToggle{display:block}.plotpanel #plotRailToggle{display:block;border:0;background:transparent;padding:5px}.plotpanel.rail #plotRailToggle{writing-mode:vertical-rl;min-height:100px}
.fab{left:4px;right:auto;bottom:4px;padding:8px 10px;font-size:12px;opacity:.68;background:#566b82c9;backdrop-filter:blur(5px)}.writefab{position:fixed;right:4px;bottom:4px;z-index:20;border:0;border-radius:999px;padding:9px 12px;color:#fff;background:#566b82c9;box-shadow:0 5px 20px #1e293b20;opacity:.68;backdrop-filter:blur(5px)}.fab:hover,.writefab:hover{opacity:1}
.mhead{position:sticky;top:0;background:var(--paper);z-index:2}.mhead h2{flex:1}.mhead .closex{font-size:22px;line-height:1;padding:4px 9px}.mhead .header-action{font-size:12px;padding:5px 8px}
.chapter-scroll{max-height:55dvh;overflow:auto}.chapter-row{touch-action:pan-y;user-select:none}.chapter-row:active{background:#f5f6f7}.todo-detail{flex:1;text-align:left;background:transparent;border:0;padding:2px 0}.todo-detail small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.focus-mode main{grid-template-columns:minmax(0,1fr)}.focus-mode .plotpanel,.focus-mode .todo,.focus-mode .icon,.focus-mode #workTitle{display:none!important}.focus-mode .editor{min-height:calc(100dvh - 150px)}.focus-mode .top{justify-content:flex-end}.focus-mode .chapterbtn{max-width:65vw}
@media(max-width:760px){.plotpanel.rail{width:100%;min-width:0;height:42px;max-height:42px;order:2}.plotpanel.rail .head{height:40px}.plotpanel.rail #plotRailToggle{writing-mode:initial;min-height:0}.plotpanel.rail .head h2,.plotpanel.rail .head #addPlot{display:none}.fab{left:3px;bottom:3px}.writefab{right:3px;bottom:3px}.focus-mode .editor{min-height:calc(100dvh - 120px)}}
</style></head><body>
<header class="top"><span class="icon" aria-label="綴り場">📖</span><button class="worktitle" id="workTitle">新しい作品 ▾</button><span class="grow"></span><button class="chapterbtn" id="chapterBtn">第1章 ▾</button><button id="focusBtn" class="small" title="執筆に集中">集中</button></header>
<main><aside class="panel plotpanel" id="plotPanel"><div class="head"><h2>章のプロット</h2><button class="small" id="addPlot">＋ 追加</button><button id="plotRailToggle" title="プロット欄を開く">☷</button></div><div class="body"><p class="muted">目標文字数に応じて、現在の目安を強調表示します。チェックを付けると完了扱いになります。</p><div class="progress"><span id="progressBar"></span></div><div id="progressText" class="muted">プロット未登録</div><div id="plotList"></div></div></aside>
<section class="writing"><div class="panel"><div class="editorhead"><h2>本文</h2><span class="muted" id="chapterLabel">第1章</span></div><div class="edittools"><button id="rubyBtn">選択範囲にルビ</button><button id="currentPlotBtn">現在のプロット</button><span class="grow"></span><span class="muted" id="count">0文字</span></div><textarea id="editor" class="editor" placeholder="ここから本文を書き始めます。作品名や章名は上部から変更できます。"></textarea><div class="editfoot"><span id="countMode">文字数：全角基準</span>　・　入力内容はこのブラウザに自動保存されます</div></div><div class="panel todo"><div class="head"><h2>作品全体のToDo</h2><button class="small" id="addTodo">＋ 追加</button></div><div class="body" id="todoList"></div></div></section></main><button class="fab" id="toolsBtn">☰ ツール</button><button class="writefab" id="writeToolsBtn" aria-label="執筆ツール">✎</button><div id="modalRoot"></div>
<script>
(()=>{'use strict';const KEY='tsuzuriba_v3_data';const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const fresh=()=>({settings:{halfWidth:false,showNotes:true},works:[{id:uid(),title:'新しい作品',memo:'',chapters:[{id:uid(),title:'第1章',body:'',plots:[]}],todos:[],terms:[],proofMemo:''}]});let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!data||!Array.isArray(data.works)||!data.works.length)data=fresh();data.settings ||= {halfWidth:false,showNotes:true};data.activeWork ||= data.works[0].id;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function work(){return data.works.find(w=>w.id===data.activeWork)||data.works[0]}function chapter(){let w=work();w.chapters ||= [];if(!w.chapters.length)w.chapters.push({id:uid(),title:'第1章',body:'',plots:[]});if(!w.activeChapter||!w.chapters.some(c=>c.id===w.activeChapter))w.activeChapter=w.chapters[0].id;return w.chapters.find(c=>c.id===w.activeChapter)||w.chapters[0]}function countChars(s){if(data.settings.halfWidth)return [...s].length;let n=0;for(const ch of s)n+=/[\u0000-\u00ff]/.test(ch)?0.5:1;return Math.round(n*10)/10}function header(){ $('workTitle').textContent=(work().title||'無題の作品')+' ▾';$('chapterBtn').textContent=(chapter().title||'無題の章')+' ▾';$('chapterLabel').textContent=chapter().title||'無題の章'}function renderEditor(){header();$('editor').value=chapter().body||'';renderPlots();renderTodos();updateCount()}function updateCount(){let n=countChars($('editor').value);$('count').textContent=n.toLocaleString()+'文字';$('countMode').textContent=data.settings.halfWidth?'文字数：半角も1文字として計算':'文字数：全角1・半角0.5の目安';renderPlots(false)}
function renderPlots(rebuild=true){let c=chapter(),list=$('plotList'),plots=c.plots||[];if(rebuild){list.innerHTML='';plots.forEach((p,i)=>{let d=document.createElement('div');d.className='plot';d.innerHTML='<div class="plotline"><input type="checkbox" aria-label="完了"><div class="plottext" contenteditable="true" spellcheck="false"></div></div><div class="plotmeta"><span class="muted">目標</span><input type="number" min="0" step="100" placeholder="文字数" aria-label="目標文字数"><span class="muted">文字</span><button class="small noteBtn">メモ</button><button class="small danger delBtn">削除</button></div><textarea class="plotnote" placeholder="補足メモ"></textarea><div class="plotactions"><button class="small upBtn">↑</button><button class="small downBtn">↓</button></div>';d.querySelector('.plottext').textContent=p.text||'';d.querySelector('input[type=checkbox]').checked=!!p.done;d.querySelector('input[type=number]').value=p.target||'';d.querySelector('.plotnote').value=p.note||'';d.querySelector('.plotnote').classList.toggle('hidden',!data.settings.showNotes);d.querySelector('.plottext').oninput=e=>{p.text=e.target.textContent;save()};d.querySelector('input[type=checkbox]').onchange=e=>{p.done=e.target.checked;save();renderPlots()};d.querySelector('input[type=number]').oninput=e=>{p.target=Number(e.target.value)||0;save();renderPlots(false)};d.querySelector('.plotnote').oninput=e=>{p.note=e.target.value;save()};d.querySelector('.noteBtn').onclick=()=>{let n=d.querySelector('.plotnote');n.classList.toggle('hidden');if(!n.classList.contains('hidden'))n.focus()};d.querySelector('.delBtn').onclick=()=>{if(confirm('このプロットを削除しますか？')){c.plots.splice(i,1);save();renderPlots()}};d.querySelector('.upBtn').onclick=()=>movePlot(i,-1);d.querySelector('.downBtn').onclick=()=>movePlot(i,1);list.appendChild(d)})}let current=countChars($('editor').value),cum=0,active=-1,total=0;plots.forEach((p,i)=>{let t=Number(p.target)||0;total+=t;if(t>0){if(active<0&&current>=cum&&current<cum+t)active=i;cum+=t}});if(active<0)active=plots.findIndex(p=>!p.done);[...list.children].forEach((el,i)=>{el.classList.toggle('active',i===active);el.classList.toggle('done',!!plots[i].done);el.querySelector('.plotnote').classList.toggle('hidden',!data.settings.showNotes)});$('progressBar').style.width=(total?Math.min(100,current/total*100):0)+'%';$('progressText').textContent=plots.length?`${plots.filter(p=>p.done).length}/${plots.length}項目完了 ・ 本文 ${current}文字${total?' / 目標合計 '+total+'文字':''}${active>=0?' ・ 現在の目安：'+(plots[active].text||'（内容未入力）'):''}`:'プロット未登録'}function movePlot(i,delta){let a=chapter().plots,j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderPlots()}
function renderTodos(){let box=$('todoList'),a=work().todos||[];box.innerHTML='';if(!a.length){box.innerHTML='<div class="empty">作品全体で忘れたくないことを登録できます。</div>';return}a.forEach((t,i)=>{let d=document.createElement('div');d.className='todorow'+(t.done?' done':'');d.innerHTML='<input type="checkbox"><button class="todo-detail"><span></span><small></small></button><button class="small danger">削除</button>';d.querySelector('input').checked=!!t.done;d.querySelector('.todo-detail span').textContent=t.text;d.querySelector('.todo-detail small').textContent=t.memo?'メモあり・タップして詳細':'タップして詳細・メモ';d.querySelector('input').onchange=e=>{t.done=e.target.checked;save();renderTodos()};d.querySelector('.todo-detail').onclick=()=>editTodo(t);d.querySelector('.danger').onclick=()=>{if(confirm('このToDoを削除しますか？')){a.splice(i,1);save();renderTodos()}};box.appendChild(d)})}
function editTodo(t){modal(t?'ToDoの詳細':'ToDoを追加',`<div class="field"><label>項目</label><input id="todoText" value="${esc(t?.text||'')}" placeholder="忘れたくないこと"></div><div class="field"><label>メモ・詳細</label><textarea id="todoMemo" placeholder="補足や具体的な内容">${esc(t?.memo||'')}</textarea></div>`);foot('保存',()=>{let text=$('todoText').value.trim();if(!text){alert('項目を入力してください');return}if(!t){work().todos||=[];work().todos.push({id:uid(),text,memo:$('todoMemo').value,done:false})}else{t.text=text;t.memo=$('todoMemo').value}save();close();renderTodos()},true)}
function close(){ $('modalRoot').innerHTML=''}function modal(title,html){let root=$('modalRoot');root.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="mhead"><button id="backModal" class="header-action hidden" aria-label="戻る">←</button><h2>${esc(title)}</h2><button id="modalWorkList" class="header-action hidden">作品一覧</button><button id="closeModal" class="closex" aria-label="閉じる" title="閉じる">×</button></div><div class="mbody">${html}</div><div class="mfoot" id="mfoot"></div></div></div>`;root.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))close()};$('closeModal').onclick=close;return root.querySelector('.modal')}function foot(label,fn,primary=false){let b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=fn;$('mfoot').appendChild(b)}
function workMenu(){modal('作品メニュー','<div class="grid"><button class="tile" id="editWork"><strong>作品設定</strong><span>作品名・メモを編集</span></button><button class="tile" id="backup"><strong>バックアップ</strong><span>データを書き出す・読み込む</span></button></div>');$('editWork').onclick=editWork;$('backup').onclick=backup;let b=$('modalWorkList');b.classList.remove('hidden');b.onclick=workList}function editWork(){let w=work();modal('作品設定',`<div class="field"><label>作品名</label><input id="wname" value="${esc(w.title)}"></div><div class="field"><label>メモ</label><textarea id="wmemo">${esc(w.memo||'')}</textarea></div>`);foot('保存',()=>{w.title=$('wname').value.trim()||'無題の作品';w.memo=$('wmemo').value;save();close();header()},true);$('backModal').classList.remove('hidden');$('backModal').onclick=workMenu}function workList(){let html='<div class="rows">'+data.works.map(w=>`<div class="itemrow"><div class="rowmain"><div class="rowtitle">${esc(w.title||'無題の作品')}</div><div class="rowsub">${w.chapters.length}章</div></div><button class="small" data-open="${w.id}">開く</button><button class="small danger" data-delete="${w.id}">削除</button></div>`).join('')+'</div><p><button id="newWork" class="primary">＋ 新しい作品</button></p>';modal('作品一覧',html);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{data.activeWork=b.dataset.open;save();close();renderEditor()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(data.works.length<2){alert('最後の1作品は削除できません');return}if(confirm('この作品を削除しますか？')){data.works=data.works.filter(w=>w.id!==b.dataset.delete);if(data.activeWork===b.dataset.delete)data.activeWork=data.works[0].id;save();workList();renderEditor()}});$('newWork').onclick=()=>{let w={id:uid(),title:'新しい作品',memo:'',chapters:[{id:uid(),title:'第1章',body:'',plots:[]}],todos:[],terms:[]};data.works.push(w);data.activeWork=w.id;save();close();renderEditor()}}
function chapterList(){let w=work();function draw(){let html='<div class="rows chapter-scroll">'+w.chapters.map(c=>`<div class="itemrow chapter-row" data-chapter-row="${c.id}"><div class="rowmain"><div class="rowtitle">${esc(c.title)}</div><div class="rowsub">${countChars(c.body||'')}文字</div></div><button class="small" data-open-ch="${c.id}">選択</button></div>`).join('')+'</div><div class="field" style="margin-top:12px"><label>追加する位置</label><select id="chapterInsertAt"><option value="end">一番下に追加</option>'+w.chapters.map((c,i)=>`<option value="${i}">「${esc(c.title)}」の前</option>`).join('')+'</select></div><button id="newChapter" class="primary" style="width:100%">＋ 章を追加</button><p class="muted">章を長押しすると、タイトル編集・削除ができます。</p>';modal('章を選択',html);document.querySelectorAll('[data-open-ch]').forEach(b=>b.onclick=()=>{w.activeChapter=b.dataset.openCh;save();close();renderEditor()});document.querySelectorAll('[data-chapter-row]').forEach(row=>{let timer;const begin=()=>{timer=setTimeout(()=>actions(row.dataset.chapterRow),550)};const cancel=()=>clearTimeout(timer);row.addEventListener('touchstart',begin,{passive:true});row.addEventListener('touchend',cancel);row.addEventListener('touchmove',cancel);row.addEventListener('contextmenu',e=>{e.preventDefault();actions(row.dataset.chapterRow)});row.addEventListener('mousedown',begin);row.addEventListener('mouseup',cancel);row.addEventListener('mouseleave',cancel)});$('newChapter').onclick=()=>{let val=$('chapterInsertAt').value,idx=val==='end'?w.chapters.length:Number(val),c={id:uid(),title:'第'+(w.chapters.length+1)+'章',body:'',plots:[]};w.chapters.splice(idx,0,c);w.activeChapter=c.id;save();close();renderEditor()}}
function actions(id){let c=w.chapters.find(x=>x.id===id);if(!c)return;modal('章の操作',`<p><strong>${esc(c.title)}</strong></p><div class="grid"><button class="tile" id="renameChapter"><strong>タイトルを編集</strong><span>章の名前を変更</span></button><button class="tile" id="deleteChapter"><strong>章を削除</strong><span>本文とプロットも削除</span></button></div>`);$('renameChapter').onclick=()=>{let n=prompt('章タイトル',c.title);if(n!==null){c.title=n.trim()||'無題の章';save();draw();header()}};$('deleteChapter').onclick=()=>{if(w.chapters.length<2){alert('最後の1章は削除できません');return}if(confirm('この章と本文・プロットを削除しますか？')){w.chapters=w.chapters.filter(x=>x.id!==id);if(w.activeChapter===id)w.activeChapter=w.chapters[0].id;save();close();renderEditor();draw()}};$('backModal').classList.remove('hidden');$('backModal').onclick=draw}draw()}
function backup(){modal('バックアップ','<p class="muted">作品・章・本文・プロット・ToDo・用語集・設定をJSON形式で保存します。端末変更やブラウザのデータ消去に備えて、定期的に書き出してください。</p><button id="export" class="primary">バックアップを書き出す</button><hr><div class="field"><label>バックアップを読み込む</label><input id="importFile" type="file" accept=".json,application/json"></div><button id="import">読み込んで置き換える</button>');$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='tsuzuriba-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=async()=>{let f=$('importFile').files[0];if(!f){alert('ファイルを選択してください');return}try{let d=JSON.parse(await f.text());if(!Array.isArray(d.works)||!d.works.length)throw 0;if(confirm('現在のデータを置き換えますか？')){data=d;data.activeWork=data.works[0].id;data.settings||={halfWidth:false,showNotes:true};save();close();renderEditor()}}catch{alert('ファイルを読み込めませんでした')}}}
function tools(){modal('ツール','<div class="grid"><button class="tile" id="proof"><strong>文章の見直しメモ</strong><span>推敲時の確認事項をメモ</span></button><button class="tile" id="gloss"><strong>用語集</strong><span>用語の検索・登録・編集</span></button><button class="tile" id="settings"><strong>表示・文字数設定</strong><span>文字数基準、メモ表示</span></button><button class="tile" id="backupTool"><strong>バックアップ</strong><span>保存データを書き出す</span></button></div><p class="hint" style="margin-top:12px">この版ではデータはこのブラウザ内に保存されます。別端末とは自動同期されないため、バックアップを保管してください。</p>');$('proof').onclick=proof;$('gloss').onclick=glossary;$('settings').onclick=settings;$('backupTool').onclick=backup}function proof(){modal('文章の見直し','<div class="hint">確認の観点：誤字脱字／主語と述語／視点のぶれ／時間・場所のつながり／説明の重複／会話文の話者</div><div class="field" style="margin-top:12px"><label>作品全体の見直しメモ</label><textarea id="proofMemo" placeholder="気になる点、後で確認する点など"></textarea></div><p class="muted">これは確認用メモで、自動校正機能ではありません。</p>');$('proofMemo').value=work().proofMemo||'';foot('保存',()=>{work().proofMemo=$('proofMemo').value;save();close()},true)}function glossary(){let w=work();w.terms||=[];modal('用語集','<input id="termSearch" class="search" placeholder="用語・説明を検索"><div id="terms" class="rows" style="margin-top:10px"></div><hr><div class="field"><label>用語</label><input id="termName"></div><div class="field"><label>説明</label><textarea id="termDesc"></textarea></div><button id="addTerm" class="primary">用語を登録</button>');function draw(){let q=$('termSearch').value.toLowerCase(),box=$('terms');box.innerHTML='';let a=w.terms.filter(t=>(t.name+' '+t.desc).toLowerCase().includes(q));if(!a.length)box.innerHTML='<div class="empty">該当する用語はありません。</div>';a.forEach(t=>{let d=document.createElement('div');d.className='itemrow';d.innerHTML='<div class="rowmain"><div class="rowtitle"></div><div class="rowsub"></div></div><button class="small">編集</button><button class="small danger">削除</button>';d.querySelector('.rowtitle').textContent=t.name;d.querySelector('.rowsub').textContent=t.desc;d.querySelectorAll('button')[0].onclick=()=>{let n=prompt('用語名',t.name);if(n===null)return;let v=prompt('説明',t.desc);if(v===null)return;t.name=n;t.desc=v;save();draw()};d.querySelectorAll('button')[1].onclick=()=>{if(confirm('用語を削除しますか？')){w.terms=w.terms.filter(x=>x.id!==t.id);save();draw()}};box.appendChild(d)})}$('termSearch').oninput=draw;$('addTerm').onclick=()=>{let n=$('termName').value.trim();if(!n){alert('用語名を入力してください');return}w.terms.push({id:uid(),name:n,desc:$('termDesc').value.trim()});save();$('termName').value='';$('termDesc').value='';draw()};draw()}function settings(){modal('表示・文字数設定','<label style="display:flex;gap:8px;margin-bottom:14px"><input type="checkbox" id="half"> <span><strong>半角も1文字として数える</strong><br><span class="muted">オフの場合は全角1、半角0.5の目安で表示します。</span></span></label><label style="display:flex;gap:8px;margin-bottom:14px"><input type="checkbox" id="notes"> <span><strong>プロットの補足メモを表示</strong></span></label><p class="muted">プロットを本文の文字の背面に重ねる機能はこの版では未実装です。現在は左欄のプロットを目標文字数に応じて強調します。</p>');$('half').checked=!!data.settings.halfWidth;$('notes').checked=data.settings.showNotes!==false;foot('保存',()=>{data.settings.halfWidth=$('half').checked;data.settings.showNotes=$('notes').checked;save();close();renderEditor()},true)}
function focusMode(){document.body.classList.toggle('focus-mode');$('focusBtn').textContent=document.body.classList.contains('focus-mode')?'戻る':'集中'}function writingTools(){modal('執筆ツール','<div class="grid"><button class="tile" id="toolRuby"><strong>ルビを付ける</strong><span>選択範囲に読みを付ける</span></button><button class="tile" id="toolPlot"><strong>現在のプロット</strong><span>未完了の目安を確認</span></button><button class="tile" id="toolSettings"><strong>文字数・表示設定</strong><span>執筆画面を調整</span></button><button class="tile" id="toolFocus"><strong>集中モード</strong><span>本文だけに集中する</span></button></div>');$('toolRuby').onclick=()=>{close();$('rubyBtn').click()};$('toolPlot').onclick=()=>{close();$('currentPlotBtn').click()};$('toolSettings').onclick=()=>{close();settings()};$('toolFocus').onclick=()=>{close();focusMode()}}
$('workTitle').onclick=workMenu;$('chapterBtn').onclick=chapterList;$('toolsBtn').onclick=tools;$('writeToolsBtn').onclick=writingTools;$('focusBtn').onclick=focusMode;$('addPlot').onclick=()=>{let t=prompt('プロットの内容');if(t===null)return;chapter().plots.push({id:uid(),text:t,note:'',target:0,done:false});save();renderPlots()};$('addTodo').onclick=()=>editTodo(null);$('editor').oninput=()=>{chapter().body=$('editor').value;save();updateCount()};$('rubyBtn').onclick=()=>{let ta=$('editor'),s=ta.selectionStart,e=ta.selectionEnd,txt=ta.value.slice(s,e);if(!txt){alert('先に本文の文字を選択してください。');return}let r=prompt('「'+txt+'」の読み方');if(r===null||!r.trim())return;ta.setRangeText('｜'+txt+'《'+r.trim()+'》',s,e,'end');chapter().body=ta.value;save();updateCount();ta.focus()};$('currentPlotBtn').onclick=()=>{let p=chapter().plots.find(x=>!x.done);alert(p?'現在の目安：'+(p.text||'（内容未入力）')+(p.note?'\nメモ：'+p.note:''):'未完了のプロットはありません')};if(localStorage.getItem('tsuzuriba_plot_rail')==='1')$('plotPanel').classList.add('rail');$('plotRailToggle').onclick=()=>{let p=$('plotPanel');p.classList.toggle('rail');localStorage.setItem('tsuzuriba_plot_rail',p.classList.contains('rail')?'1':'0')};renderEditor();})();
</script></body></html>
