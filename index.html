</style></head><body>
<header class="top"><button class="worktitle" id="workTitle">新しい作品 ▾</button><span id="topCount" class="top-count">0文字</span><button id="focusBtn" class="small" title="執筆に集中">集中</button></header>
<main><aside class="panel plotpanel" id="plotPanel"><div class="head"><h2>章のプロット</h2><button class="small" id="addPlot">＋ 追加</button><button id="plotRailToggle" title="プロット欄を開く">☷</button></div><div id="plotMarkers" class="plot-markers" aria-label="プロット位置"></div><div class="body"><p class="muted">目標文字数に応じて、現在の目安を強調表示します。チェックを付けると完了扱いになります。</p><div class="progress"><span id="progressBar"></span></div><div id="progressText" class="muted">プロット未登録</div><div id="plotList"></div></div></aside>
<section class="writing"><div class="panel"><div class="editorhead chapter-editor-head"><div class="chapter-heading-main"><h2 id="chapterHeading">第1章　無題の章</h2><span class="chapter-char-count" id="chapterHeadingCount">0文字</span></div><div class="chapter-accordion-wrap" style="display:none!important"><select id="chapterSelect" class="chapter-select" aria-label="章を選択"></select><button id="chapterBtn" class="chapter-add-mini" aria-label="章一覧・編集" title="章一覧・編集">▾</button><button id="chapterAddBtn" class="chapter-add-mini" aria-label="章を追加" title="章を追加">＋</button><div id="chapterAccordion" class="chapter-accordion hidden"></div></div></div><div hidden><button id="rubyBtn">ルビ</button><button id="currentPlotBtn">プロット</button></div><div class="edittools chapter-details"><div id="chapterDetails" class="chapter-detail-text">章の詳細は未設定です</div><span class="grow"></span><span class="muted" id="goalRemain" style="display:none!important">目標未設定</span><span class="muted" id="count" style="display:none!important">0文字</span></div><div id="inlinePlotDetail" class="inline-plot-detail hidden"></div><div class="editorwrap"><div id="inlinePlotRail" aria-label="本文連動プロット"></div><textarea id="editor" class="editor" placeholder="ここから本文を書き始めます。作品名や章名は上部から変更できます。"></textarea></div><div class="editfoot"><span id="countMode">文字数：全角基準</span>　・　入力内容はこのブラウザに自動保存されます</div></div><div class="panel todo"><div class="head"><h2>作品全体のToDo</h2><button class="small" id="addTodo">＋ 追加</button></div><div class="body" id="todoList"></div></div></section></main><button class="fab" id="toolsBtn">☰ ツール</button><button class="ruby-fab" id="rubyFab" aria-label="ルビを設定" title="ルビ">ルビ</button><button id="writeToolsBtn" hidden aria-hidden="true" tabindex="-1"></button><div id="writeToolsAccordion" hidden aria-hidden="true"></div><div id="modalRoot"></div><footer class="app-version">綴り場 v24</footer>
<script>
(()=>{'use strict';const KEY='tsuzuriba_v3_data';const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const fresh=()=>({settings:{halfWidth:false,showNotes:true},works:[{id:uid(),title:'新しい作品',memo:'',chapters:[{id:uid(),title:'第1章',body:'',plots:[]}],todos:[],terms:[],proofMemo:''}]});let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!data||!Array.isArray(data.works)||!data.works.length)data=fresh();data.settings ||= {halfWidth:false,showNotes:true};if(data.settings.lockFloating===undefined)data.settings.lockFloating=false;if(!data.settings.countDisplay)data.settings.countDisplay='currentTarget';data.activeWork ||= data.works[0].id;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){/* file-preview environments may block local storage; editing remains usable */}}function work(){return data.works.find(w=>w.id===data.activeWork)||data.works[0]}function chapter(){let w=work();w.chapters ||= [];if(!w.chapters.length)w.chapters.push({id:uid(),title:'第1章',body:'',plots:[]});if(!w.activeChapter||!w.chapters.some(c=>c.id===w.activeChapter))w.activeChapter=w.chapters[0].id;return w.chapters.find(c=>c.id===w.activeChapter)||w.chapters[0]}function countChars(s){if(data.settings.halfWidth)return [...s].length;let n=0;for(const ch of s)n+=/[\u0000-\u00ff]/.test(ch)?0.5:1;return Math.round(n*10)/10}function refreshChapterDetails(){const c=chapter(),d=$('chapterDetails');if(d)d.textContent=c.detail||'章の詳細は未設定です';const n=countChars($('editor')?.value||''),t=Number(c.target)||Number(work().target)||0,r=$('goalRemain');if(r)r.textContent=t?'残り '+Math.max(0,t-n).toLocaleString()+'文字':'目標未設定'}function renderInlinePlotRail(){const rail=$('inlinePlotRail'),ta=$('editor');if(!rail||!ta)return;rail.innerHTML='';const plots=chapter().plots||[],style=getComputedStyle(ta),lh=parseFloat(style.lineHeight)||32,fs=parseFloat(style.fontSize)||16,per=Math.max(8,Math.floor((ta.clientWidth||300)/(fs*.54))),max=Math.max(ta.scrollHeight,ta.clientHeight);plots.forEach((p,i)=>{let y=Number(p.target)>0?Number(p.target)/per*lh:(plots.length===1?lh/2:(ta.clientHeight-24)*i/Math.max(1,plots.length-1));y=Math.max(14,Math.min(max-14,y-ta.scrollTop));const b=document.createElement('button');b.type='button';b.className='inline-plot-check'+(p.done?' done':'')+(!p.done&&i===plots.findIndex(x=>!x.done)?' current':'');b.style.top=y+'px';b.textContent=String(i+1);b.title=p.text||'プロット';b.onclick=()=>showInlinePlotDetail(i);rail.appendChild(b)});const m=document.createElement('button');m.type='button';m.className='plot-rail-menu';m.textContent='☰';m.title='プロット編集';m.onclick=()=>managePlots();rail.appendChild(m)}function showInlinePlotDetail(i){const p=(chapter().plots||[])[i],box=$('inlinePlotDetail');if(!p||!box)return;box.classList.remove('hidden');box.innerHTML='';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!p.done;cb.onchange=()=>{p.done=cb.checked;save();renderPlots();renderInlinePlotRail()};const copy=document.createElement('div');copy.className='detail-copy';copy.textContent=(p.text||'内容未入力')+(p.note?'\n\n'+p.note:'')+(p.target?'\n\n目安：'+p.target+'文字':'');const x=document.createElement('button');x.className='detail-close';x.textContent='×';x.onclick=()=>box.classList.add('hidden');box.append(cb,copy,x)}function managePlots(){const a=chapter().plots||(chapter().plots=[]),list=a.map((p,i)=>(i+1)+'. '+(p.text||'内容未入力')).join('\n'),v=prompt('プロット管理：1 追加 / 2 編集 / 3 削除\n'+(list||'まだありません'),'1');if(v===null)return;if(v==='1'){const text=prompt('プロット内容');if(!text||!text.trim())return;const note=prompt('詳細（省略可）','')||'',target=Number(prompt('本文の目安文字数','0'))||0;a.push({id:uid(),text:text.trim(),note,target:Math.max(0,target),done:false})}else if(v==='2'||v==='3'){if(!a.length)return alert('プロットがありません');const i=Number(prompt('番号を入力','1'))-1;if(!Number.isInteger(i)||i<0||i>=a.length)return;if(v==='3'){if(confirm('削除しますか？'))a.splice(i,1)}else{const p=a[i],text=prompt('プロット内容',p.text||'');if(text===null)return;const note=prompt('詳細',p.note||'');if(note===null)return;const target=prompt('目安文字数',String(p.target||0));if(target===null)return;p.text=text;p.note=note;p.target=Math.max(0,Number(target)||0)}}save();renderPlots();renderInlinePlotRail()}function header(){ $('workTitle').textContent=(work().title||'無題の作品')+' ▾';$('chapterBtn').textContent=(chapter().title||'無題の章')+' ▾';$('chapterLabel').textContent=chapter().title||'無題の章';const cs=$('chapterSelect');if(cs){cs.innerHTML='';work().chapters.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.title||'無題の章';o.selected=c.id===chapter().id;cs.appendChild(o)})}}function renderEditor(){header();$('editor').value=chapter().body||'';renderPlots();renderTodos();updateCount()}function updateCount(){let n=countChars($('editor').value);$('count').textContent=n.toLocaleString()+'文字';const goal=Number(chapter().target)||Number(work().target)||0;$('topCount').textContent=n.toLocaleString()+'/'+(goal?goal.toLocaleString():'—')+'文字';$('countMode').textContent=data.settings.halfWidth?'文字数：半角も1文字として計算':'文字数：全角1・半角0.5の目安';renderPlots(false)}
function renderPlots(rebuild=true){let c=chapter(),list=$('plotList'),plots=c.plots||[];if(rebuild){list.innerHTML='';plots.forEach((p,i)=>{let d=document.createElement('div');d.className='plot';d.innerHTML='<div class="plotline"><input type="checkbox" aria-label="完了"><div class="plottext" contenteditable="true" spellcheck="false"></div></div><div class="plotmeta"><span class="muted">目標</span><input type="number" min="0" step="100" placeholder="文字数" aria-label="目標文字数"><span class="muted">文字</span><button class="small noteBtn">メモ</button><button class="small danger delBtn">削除</button></div><textarea class="plotnote" placeholder="補足メモ"></textarea><div class="plotactions"><button class="small upBtn">↑</button><button class="small downBtn">↓</button></div>';d.querySelector('.plottext').textContent=p.text||'';d.querySelector('input[type=checkbox]').checked=!!p.done;d.querySelector('input[type=number]').value=p.target||'';d.querySelector('.plotnote').value=p.note||'';d.querySelector('.plotnote').classList.toggle('hidden',!data.settings.showNotes);d.querySelector('.plottext').oninput=e=>{p.text=e.target.textContent;save()};d.querySelector('input[type=checkbox]').onchange=e=>{p.done=e.target.checked;save();renderPlots()};d.querySelector('input[type=number]').oninput=e=>{p.target=Number(e.target.value)||0;save();renderPlots(false)};d.querySelector('.plotnote').oninput=e=>{p.note=e.target.value;save()};d.querySelector('.noteBtn').onclick=()=>{let n=d.querySelector('.plotnote');n.classList.toggle('hidden');if(!n.classList.contains('hidden'))n.focus()};d.querySelector('.delBtn').onclick=()=>{if(confirm('このプロットを削除しますか？')){c.plots.splice(i,1);save();renderPlots()}};d.querySelector('.upBtn').onclick=()=>movePlot(i,-1);d.querySelector('.downBtn').onclick=()=>movePlot(i,1);list.appendChild(d)})}let current=countChars($('editor').value),cum=0,active=-1,total=0;plots.forEach((p,i)=>{let t=Number(p.target)||0;total+=t;if(t>0){if(active<0&&current>=cum&&current<cum+t)active=i;cum+=t}});if(active<0)active=plots.findIndex(p=>!p.done);[...list.children].forEach((el,i)=>{el.classList.toggle('active',i===active);el.classList.toggle('done',!!plots[i].done);el.querySelector('.plotnote').classList.toggle('hidden',!data.settings.showNotes)});$('progressBar').style.width=(total?Math.min(100,current/total*100):0)+'%';$('progressText').textContent=plots.length?`${plots.filter(p=>p.done).length}/${plots.length}項目完了 ・ 本文 ${current}文字${total?' / 目標合計 '+total+'文字':''}${active>=0?' ・ 現在の目安：'+(plots[active].text||'（内容未入力）'):''}`:'プロット未登録';renderPlotMarkers(plots,current,total,active)}function renderPlotMarkers(plots,current,total,active){const box=$('plotMarkers');if(!box)return;box.innerHTML='';if(!plots.length){box.innerHTML='<span class="plot-marker-empty">＋</span>';return}const targetTotal=plots.reduce((n,p)=>n+(Number(p.target)||0),0);let cumulative=0;plots.forEach((p,i)=>{let pct=targetTotal>0?(cumulative/targetTotal)*100:(i/Math.max(1,plots.length))*100;let marker=document.createElement('button');marker.type='button';marker.className='plot-marker'+(i===active?' current':'')+(p.done?' done':'');marker.style.top=Math.min(96,Math.max(2,pct))+'%';marker.textContent=String(i+1);marker.title=(p.text||('プロット'+(i+1)))+' ・ '+(Number(p.target)||0)+'文字目安';marker.onclick=()=>{box.classList.add('marker-detail-open');const item=$('plotList').children[i];if(item){item.scrollIntoView({block:'nearest',behavior:'smooth'});item.classList.add('active')}};box.appendChild(marker);cumulative+=Number(p.target)||0});if(targetTotal>0){const progress=document.createElement('div');progress.className='plot-marker-progress';progress.style.height=Math.min(100,current/targetTotal*100)+'%';box.appendChild(progress)}}
function movePlot(i,delta){let a=chapter().plots,j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderPlots()}
function renderTodos(){let box=$('todoList'),a=work().todos||[];box.innerHTML='';if(!a.length){box.innerHTML='<div class="empty">作品全体で忘れたくないことを登録できます。</div>';return}a.forEach((t,i)=>{let d=document.createElement('div');d.className='todorow'+(t.done?' done':'');d.innerHTML='<input type="checkbox"><button class="todo-detail"><span></span><small></small></button><button class="small danger">削除</button>';d.querySelector('input').checked=!!t.done;d.querySelector('.todo-detail span').textContent=t.text;d.querySelector('.todo-detail small').textContent=t.memo?'メモあり・タップして詳細':'タップして詳細・メモ';d.querySelector('input').onchange=e=>{t.done=e.target.checked;save();renderTodos()};d.querySelector('.todo-detail').onclick=()=>editTodo(t);d.querySelector('.danger').onclick=()=>{if(confirm('このToDoを削除しますか？')){a.splice(i,1);save();renderTodos()}};box.appendChild(d)})}
function editTodo(t){modal(t?'ToDoの詳細':'ToDoを追加',`<div class="field"><label>項目</label><input id="todoText" value="${esc(t?.text||'')}" placeholder="忘れたくないこと"></div><div class="field"><label>メモ・詳細</label><textarea id="todoMemo" placeholder="補足や具体的な内容">${esc(t?.memo||'')}</textarea></div>`);foot('保存',()=>{let text=$('todoText').value.trim();if(!text){alert('項目を入力してください');return}if(!t){work().todos||=[];work().todos.push({id:uid(),text,memo:$('todoMemo').value,done:false})}else{t.text=text;t.memo=$('todoMemo').value}save();close();renderTodos()},true)}
function close(){ $('modalRoot').innerHTML=''}function modal(title,html){let root=$('modalRoot');root.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="mhead"><button id="backModal" class="header-action hidden" aria-label="戻る">←</button><h2>${esc(title)}</h2><button id="modalWorkList" class="header-action hidden">作品一覧</button><button id="closeModal" class="closex" aria-label="閉じる" title="閉じる">×</button></div><div class="mbody">${html}</div><div class="mfoot" id="mfoot"></div></div></div>`;root.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))close()};$('closeModal').onclick=close;return root.querySelector('.modal')}function foot(label,fn,primary=false){let b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=fn;$('mfoot').appendChild(b)}
function workMenu(){modal('作品メニュー','<div class="grid"><button class="tile" id="editWork"><strong>作品設定</strong><span>作品名・メモを編集</span></button><button class="tile" id="backup"><strong>バックアップ</strong><span>データを書き出す・読み込む</span></button></div>');$('editWork').onclick=editWork;$('backup').onclick=backup;let b=$('modalWorkList');b.classList.remove('hidden');b.onclick=workList}function editWork(){let w=work();modal('作品設定',`<div class="field"><label>作品名</label><input id="wname" value="${esc(w.title)}"></div><div class="field"><label>メモ</label><textarea id="wmemo">${esc(w.memo||'')}</textarea></div>`);foot('保存',()=>{w.title=$('wname').value.trim()||'無題の作品';w.memo=$('wmemo').value;save();close();header()},true);$('backModal').classList.remove('hidden');$('backModal').onclick=workMenu}function workList(){let html='<div class="rows">'+data.works.map(w=>`<div class="itemrow"><div class="rowmain"><div class="rowtitle">${esc(w.title||'無題の作品')}</div><div class="rowsub">${w.chapters.length}章</div></div><button class="small" data-open="${w.id}">開く</button><button class="small danger" data-delete="${w.id}">削除</button></div>`).join('')+'</div><p><button id="newWork" class="primary">＋ 新しい作品</button></p>';modal('作品一覧',html);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{data.activeWork=b.dataset.open;save();close();renderEditor()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(data.works.length<2){alert('最後の1作品は削除できません');return}if(confirm('この作品を削除しますか？')){data.works=data.works.filter(w=>w.id!==b.dataset.delete);if(data.activeWork===b.dataset.delete)data.activeWork=data.works[0].id;save();workList();renderEditor()}});$('newWork').onclick=()=>{let w={id:uid(),title:'新しい作品',memo:'',chapters:[{id:uid(),title:'第1章',body:'',plots:[]}],todos:[],terms:[]};data.works.push(w);data.activeWork=w.id;save();close();renderEditor()}}

 const options=w.chapters.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===active.id?'selected':'')+'>'+esc(chapterDisplay(c))+'</option>').join('');
 modal('章の管理','<div class="field"><label>表示する章</label><select id="v22ChapterPick">'+options+'</select></div><div class="field"><label>章タイトル</label><input id="v22ChapterTitle" value="'+esc(active.title||'')+'"></div><div class="field"><label>章詳細</label><textarea id="v22ChapterDetail">'+esc(active.detail||'')+'</textarea></div><div class="field"><label>目標文字数</label><input id="v22ChapterTarget" type="number" min="0" step="100" value="'+(Number(active.target)||'')+'"></div><div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button id="v22ChapterAdd" type="button">＋ 章を追加</button><button id="v22ChapterDelete" type="button" class="danger">この章を削除</button></div>');
 const fill=id=>{const c=w.chapters.find(x=>x.id===id);if(!c)return;$('v22ChapterTitle').value=c.title||'';$('v22ChapterDetail').value=c.detail||'';$('v22ChapterTarget').value=Number(c.target)||''};
 $('v22ChapterPick').onchange=()=>fill($('v22ChapterPick').value);
 $('v22ChapterAdd').onclick=()=>{const current=v22CommitChapterForm();if(!current)return;const c={id:uid(),title:'第'+(w.chapters.length+1)+'章',detail:'',target:0,body:'',plots:[]};w.chapters.push(c);save();close();v22ChapterManager();$('v22ChapterPick').value=c.id;fill(c.id)};
 $('v22ChapterDelete').onclick=()=>{const id=$('v22ChapterPick').value;if(w.chapters.length<2)return alert('最後の1章は削除できません。');if(!confirm('この章と本文・プロットを削除しますか？'))return;w.chapters=w.chapters.filter(c=>c.id!==id);if(w.activeChapter===id)w.activeChapter=w.chapters[0].id;save();close();renderEditor();v22ApplySettings()};
 foot('保存',()=>{const c=v22CommitChapterForm();if(!c)return;w.activeChapter=c.id;save();close();renderEditor();v22ApplySettings()},true);
}
const v22Heading=$('chapterHeading');if(v22Heading){v22Heading.onclick=v22ChapterManager;v22Heading.title='タップして章の切り替え・編集・追加';}
function v22SetCount(){
 const ta=$('editor'),n=countChars(ta?ta.value:'');
 const goal=Number(chapter().target)||Number(work().target)||0;
 const mode=data.settings.countDisplay||'currentTarget',out=$('topCount');
 if(out)out.textContent=mode==='currentOnly'?n.toLocaleString()+'文字':mode==='remaining'?(goal?'残り '+Math.max(0,goal-n).toLocaleString()+'文字':'残り —'):n.toLocaleString()+' / '+(goal?goal.toLocaleString():'—')+'文字';
 const hc=$('chapterHeadingCount');if(hc)hc.textContent=n.toLocaleString()+'文字';
 const c=$('count');if(c)c.textContent=n.toLocaleString()+'文字';
}
const v22OldUpdateCount=updateCount;

 const s=data.settings||(data.settings={});
 modal('設定','<div class="field"><label>上部の文字数表示</label><select id="v22CountMode"><option value="currentTarget">現在の文字数 ／ 目標文字数</option><option value="currentOnly">現在の文字数のみ</option><option value="remaining">目標までの残り文字数</option></select></div><label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0"><input type="checkbox" id="v22Half"><span><strong>半角も1文字として数える</strong><br><span class="muted">オフの場合は半角を0.5文字として数えます。</span></span></label><label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0"><input type="checkbox" id="v22Lock"><span><strong>ルビ・ツールボタンを固定</strong><br><span class="muted">オンにすると長押しで移動できなくなります。</span></span></label><label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0"><input type="checkbox" id="v22Notes"><span><strong>プロットの補足メモを表示</strong></span></label><div class="field"><label>画面デザイン</label><select id="v22Design"><option value="chic">シック</option><option value="light">明るい</option><option value="sepia">セピア</option></select></div>');
 $('v22CountMode').value=s.countDisplay||'currentTarget';$('v22Half').checked=!!s.halfWidth;$('v22Lock').checked=!!s.lockFloating;$('v22Notes').checked=s.showNotes!==false;$('v22Design').value=s.design||'chic';
 foot('保存',()=>{s.countDisplay=$('v22CountMode').value;s.halfWidth=$('v22Half').checked;s.lockFloating=$('v22Lock').checked;s.showNotes=$('v22Notes').checked;s.design=$('v22Design').value;save();close();v22ApplySettings();renderEditor();v22SetCount()},true);
};
tools=function(){
 modal('ツール','<div class="grid"><button class="tile" id="proof"><strong>文章の見直しメモ</strong><span>推敲時の確認事項</span></button><button class="tile" id="gloss"><strong>用語集</strong><span>用語の検索・登録・編集</span></button><button class="tile" id="settings"><strong>設定</strong><span>文字数表示・ボタン固定・デザイン</span></button><button class="tile" id="backupTool"><strong>バックアップ</strong><span>保存データを書き出す・読み込む</span></button></div>');
 $('proof').onclick=proof;$('gloss').onclick=glossary;$('settings').onclick=()=>settings();$('backupTool').onclick=backup;

function v22CleanButton(id){const old=$(id);if(!old)return null;const el=old.cloneNode(true);old.replaceWith(el);return el}
const v22Tools=v22CleanButton('toolsBtn'),v22Ruby=v22CleanButton('rubyFab');
function v22Drag(el,key){
 if(!el)return;
 let timer=null,active=false,moved=false,sx=0,sy=0,lastX=0,lastY=0,pid=null;
 try{const p=JSON.parse(localStorage.getItem(key)||'null');if(p&&Number.isFinite(p.x)&&Number.isFinite(p.y)){el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.right='auto';el.style.bottom='auto'}}catch(e){}
 el.style.touchAction='none';
 el.addEventListener('pointerdown',e=>{
  if(data.settings.lockFloating|| (e.button!==undefined&&e.button!==0))return;
  pid=e.pointerId;sx=lastX=e.clientX;sy=lastY=e.clientY;active=false;moved=false;
  timer=setTimeout(()=>{active=true;el.classList.add('is-dragging');try{el.setPointerCapture(pid)}catch(e){}},380);
 });
 el.addEventListener('pointermove',e=>{
  if(timer&&!active&&Math.hypot(e.clientX-sx,e.clientY-sy)>14){clearTimeout(timer);timer=null;return}
  if(!active)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>4)moved=true;
  const r=el.getBoundingClientRect();
  el.style.left=Math.max(0,Math.min(window.innerWidth-r.width,r.left+dx))+'px';
  el.style.top=Math.max(0,Math.min(window.innerHeight-r.height,r.top+dy))+'px';
  el.style.right='auto';el.style.bottom='auto';lastX=e.clientX;lastY=e.clientY;
 });
 const end=()=>{if(timer)clearTimeout(timer);timer=null;if(active){const r=el.getBoundingClientRect();try{localStorage.setItem(key,JSON.stringify({x:r.left,y:r.top}))}catch(e){}el.classList.remove('is-dragging')}active=false;setTimeout(()=>{moved=false},0)};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopImmediatePropagation();moved=false}},true);
}
if(v22Tools)v22Tools.onclick=()=>tools();
let v22RubyRange=null;const v22TA=$('editor');
if(v22TA){const keep=()=>{v22RubyRange={s:v22TA.selectionStart,e:v22TA.selectionEnd}};['select','keyup','mouseup','touchend','input'].forEach(ev=>v22TA.addEventListener(ev,keep));}
if(v22Ruby){
 v22Ruby.addEventListener('pointerdown',()=>{if(v22TA)v22RubyRange={s:v22TA.selectionStart,e:v22TA.selectionEnd}},true);
 v22Ruby.onclick=()=>{
  const ta=$('editor');if(!ta)return;
  const rg=v22RubyRange||{s:ta.selectionStart,e:ta.selectionEnd},s=rg.s,e=rg.e,txt=ta.value.slice(s,e);
  if(!txt){alert('先に本文の文字を選択してください。');return}
  modal('ルビを設定','<div class="field"><label>対象の文字</label><div class="hint" id="v22RubyTarget"></div></div><div class="field"><label>読み方</label><input id="v22RubyReading" placeholder="ひらがなで入力"></div><p class="muted">本文には「｜対象の文字《読み方》」の形式で挿入します。</p>');
  $('v22RubyTarget').textContent=txt;
  foot('挿入',()=>{const reading=$('v22RubyReading').value.trim();if(!reading)return alert('読み方を入力してください。');ta.setRangeText('｜'+txt+'《'+reading+'》',s,e,'end');chapter().body=ta.value;v22RubyRange=null;save();close();updateCount();ta.focus()},true);
 };
}
v22Drag(v22Tools,'tsuzuriba_tools_btn_pos');v22Drag(v22Ruby,'tsuzuriba_ruby_btn_pos');
v22ApplySettings();
renderEditor();

// v24: make the compact chapter heading open a working chapter manager.
v22ChapterManager=function(){
 const w=work();
 const draw=()=>{
  const rows=w.chapters.map((c,i)=>'<div class="itemrow" style="align-items:center;gap:6px"><button type="button" data-v24-select="'+esc(c.id)+'" style="flex:1;text-align:left;background:transparent;border:0;padding:4px 2px;min-width:0"><strong style="display:block;overflow-wrap:anywhere">'+esc(chapterDisplay(c))+'</strong><span class="muted">'+countChars(c.body||'')+'文字'+(c.id===w.activeChapter?' ・編集中':'')+'</span></button><button type="button" data-v24-edit="'+esc(c.id)+'" class="small">編集</button><button type="button" data-v24-delete="'+esc(c.id)+'" class="small danger">削除</button></div>').join('');
  modal('章の管理','<p class="muted" style="margin-top:0">章のタイトルをタップすると、その章に切り替わります。</p><div class="rows">'+rows+'</div><button type="button" id="v24AddChapter" class="primary" style="width:100%;margin-top:12px">＋ 章を追加</button>');
  document.querySelectorAll('[data-v24-select]').forEach(b=>b.onclick=()=>{const id=b.getAttribute('data-v24-select');if(!w.chapters.some(c=>c.id===id))return;w.activeChapter=id;save();close();renderEditor()});
  document.querySelectorAll('[data-v24-edit]').forEach(b=>b.onclick=()=>v24EditChapter(b.getAttribute('data-v24-edit')));
  document.querySelectorAll('[data-v24-delete]').forEach(b=>b.onclick=()=>{const id=b.getAttribute('data-v24-delete');if(w.chapters.length<2)return alert('最後の1章は削除できません。');const c=w.chapters.find(x=>x.id===id);if(!c)return;if(!confirm('「'+(c.title||'無題の章')+'」と本文・プロットを削除しますか？'))return;w.chapters=w.chapters.filter(x=>x.id!==id);if(w.activeChapter===id)w.activeChapter=w.chapters[0].id;save();v22ChapterManager();renderEditor()});
  $('v24AddChapter').onclick=()=>v24AddChapter();
 };
 draw();
};
function v24EditChapter(id){
 const w=work(),c=w.chapters.find(x=>x.id===id);if(!c)return;
 modal('章を編集','<div class="field"><label>章タイトル</label><input id="v24Title" value="'+esc(c.title||'')+'" placeholder="章タイトル"></div><div class="field"><label>章の詳細</label><textarea id="v24Detail">'+esc(c.detail||'')+'</textarea></div><div class="field"><label>目標文字数</label><input id="v24Target" type="number" min="0" step="100" value="'+(Number(c.target)||'')+'"></div>');
 const back=document.createElement('button');back.type='button';back.textContent='戻る';back.onclick=()=>v22ChapterManager();$('mfoot').appendChild(back);
 foot('保存',()=>{const title=$('v24Title').value.trim();if(!title)return alert('章タイトルを入力してください。');c.title=title;c.detail=$('v24Detail').value.trim();c.target=Math.max(0,Number($('v24Target').value)||0);save();close();renderEditor()},true);
}
function v24AddChapter(){
 modal('章を追加','<div class="field"><label>章タイトル</label><input id="v24Title" placeholder="章タイトル"></div><div class="field"><label>章の詳細（任意）</label><textarea id="v24Detail"></textarea></div><div class="field"><label>目標文字数（任意）</label><input id="v24Target" type="number" min="0" step="100"></div>');
 const back=document.createElement('button');back.type='button';back.textContent='戻る';back.onclick=()=>v22ChapterManager();$('mfoot').appendChild(back);
 foot('追加',()=>{const title=$('v24Title').value.trim();if(!title)return alert('章タイトルを入力してください。');const c={id:uid(),title,detail:$('v24Detail').value.trim(),target:Math.max(0,Number($('v24Target').value)||0),body:'',plots:[]};const w=work();w.chapters.push(c);w.activeChapter=c.id;save();close();renderEditor()},true);
}

if(v24Heading){v24Heading.onclick=()=>v22ChapterManager();v24Heading.setAttribute('role','button');v24Heading.setAttribute('tabindex','0');v24Heading.setAttribute('aria-label','章の選択・編集・追加・削除');v24Heading.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();v22ChapterManager()}}}

})();
