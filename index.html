<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chic Novelist Studio - UI Mockup V1.1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Inter', 'Noto Serif JP', serif;
            touch-action: manipulation;
        }
        /* Custom scrollbar for chic look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Draggable buttons style */
        .draggable-btn {
            touch-action: none;
            user-select: none;
            cursor: grab;
        }
        .draggable-btn:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-200 min-h-screen flex flex-col antialiased selection:bg-slate-700 selection:text-white">

    <!-- Top Banner -->
    <header class="bg-dark-800/90 backdrop-blur-md border-b border-dark-700 px-4 py-2.5 sticky top-0 z-40 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <!-- App Icon -->
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-slate-700 to-dark-900 flex items-center justify-center border border-slate-600 shadow-inner">
                <i class="fa-solid fa-feather-pointed text-[11px] text-slate-300"></i>
            </div>
            <!-- Work Title & Toggle Button Container -->
            <div class="flex items-center space-x-3">
                <div class="flex flex-col">
                    <span class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">GitHub Connected</span>
                    <h1 class="text-xs md:text-sm font-semibold tracking-wide text-slate-100">深夜特急のレプリカント - 第3章</h1>
                </div>
                <!-- Target Toggle Button -->
                <button id="toggleTargetBtn" title="文字目標の表示切替" class="px-2 py-1 rounded bg-dark-700/60 hover:bg-dark-700 text-slate-300 hover:text-white transition border border-dark-600/50 text-[11px] flex items-center space-x-1">
                    <i id="toggleIcon" class="fa-solid fa-chart-pie"></i>
                    <span class="hidden sm:inline" id="toggleText">目標非表示</span>
                </button>
            </div>
        </div>

        <!-- Focus Mode Button -->
        <button id="focusModeBtn" title="集中モード" class="p-1.5 px-2.5 rounded-lg bg-dark-700/60 hover:bg-dark-700 text-slate-300 hover:text-white transition border border-dark-600/50 flex items-center space-x-1.5 text-xs">
            <i class="fa-solid fa-expand"></i>
            <span class="hidden sm:inline">集中モード</span>
        </button>
    </header>

    <!-- Compact Progress Dashboard (Collapsible with memory) -->
    <section id="targetSection" class="bg-dark-800/50 border-b border-dark-700/60 px-4 py-2 text-xs transition-all duration-300 overflow-hidden">
        <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-2.5">
            <!-- Overall Progress -->
            <div class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span class="text-slate-400">全体目標</span>
                    <span class="font-mono text-slate-200">12,450 / <span class="text-slate-400">50,000字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div class="bg-slate-400 h-1.5 rounded-full" style="width: 25%;"></div>
                </div>
            </div>
            <!-- Chapter Progress -->
            <div class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span class="text-slate-400">第3章目標</span>
                    <span class="font-mono text-slate-200">3,200 / <span class="text-slate-400">5,000字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div class="bg-slate-500 h-1.5 rounded-full" style="width: 64%;"></div>
                </div>
            </div>
            <!-- Episode Progress -->
            <div class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span class="text-slate-400">本話（第12話）</span>
                    <span class="font-mono text-slate-200">850 / <span class="text-slate-400">1,500字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div class="bg-slate-300 h-1.5 rounded-full" style="width: 56%;"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col space-y-3">

        <!-- Chapter & Title Header (More Compact) -->
        <div class="bg-dark-800/60 border border-dark-700/70 rounded-xl px-3.5 py-2.5 shadow-sm flex flex-col space-y-2">
            <div class="flex items-center space-x-3">
                <div class="px-2.5 py-0.5 bg-dark-700/80 border border-dark-600 rounded text-[11px] font-semibold text-slate-300 shrink-0">
                    第3章
                </div>
                <input type="text" value="雨音のプロムナード" class="bg-transparent border-b border-dark-600/60 focus:border-slate-400 outline-none text-sm md:text-base font-semibold text-slate-100 py-0.5 transition w-full" placeholder="章タイトルを入力...">
            </div>
            <!-- Synopsis Field (Compact) -->
            <div class="relative">
                <span class="absolute -top-2 left-2.5 px-1 bg-dark-800 text-[9px] text-slate-400 font-medium uppercase tracking-wider border border-dark-700 rounded">あらすじ</span>
                <textarea rows="1" class="w-full bg-dark-900/60 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-slate-500 transition resize-none" placeholder="章のあらすじやプロットの指針を記入...">主人公がネオン街の裏路地で情報屋と接触し、過去の記憶の手がかりとなる古いデータチップを受け取る。</textarea>
            </div>
        </div>

        <!-- Editor Section with Plot Column on the Left -->
        <div class="flex-1 grid grid-cols-12 gap-3 items-stretch">
            
            <!-- Plot No. Vertical Column (Left Side) -->
            <div class="col-span-3 md:col-span-2 bg-dark-800/40 border border-dark-700/60 rounded-xl p-2.5 flex flex-col space-y-2.5">
                <div class="flex items-center justify-between border-b border-dark-700 pb-1.5">
                    <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">プロットNo.</span>
                    <button title="プロット追加" class="text-slate-400 hover:text-slate-200 text-xs"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="flex flex-col space-y-2 overflow-y-auto max-h-[500px] pr-0.5">
                    <!-- Plot Item 1 (Active) -->
                    <div class="p-2 rounded-lg bg-dark-700/60 border border-slate-600 cursor-pointer text-xs transition shadow-sm">
                        <div class="font-mono text-[10px] text-slate-400">#PLOT-012</div>
                        <div class="font-medium text-slate-200 truncate mt-0.5">裏路地での密会</div>
                    </div>
                    <!-- Plot Item 2 -->
                    <div class="p-2 rounded-lg bg-dark-800/80 border border-dark-700/60 hover:bg-dark-700/40 cursor-pointer text-xs transition text-slate-400">
                        <div class="font-mono text-[10px] text-slate-500">#PLOT-013</div>
                        <div class="truncate mt-0.5">雨のハイウェイ</div>
                    </div>
                    <!-- Plot Item 3 -->
                    <div class="p-2 rounded-lg bg-dark-800/80 border border-dark-700/60 hover:bg-dark-700/40 cursor-pointer text-xs transition text-slate-400">
                        <div class="font-mono text-[10px] text-slate-500">#PLOT-014</div>
                        <div class="truncate mt-0.5">記憶の残響</div>
                    </div>
                </div>
            </div>

            <!-- Main Body Writing Field -->
            <div class="col-span-9 md:col-span-10 bg-dark-800/50 border border-dark-700/70 rounded-xl p-3.5 flex flex-col shadow-inner relative">
                <div class="flex justify-between items-center mb-2 text-xs text-slate-400 border-b border-dark-700/50 pb-1.5">
                    <div class="flex items-center space-x-1.5">
                        <i class="fa-solid fa-pen-nib"></i>
                        <span>本文エディタ</span>
                    </div>
                    <span class="font-mono text-[10px]">Markdown / 縦書き風プレビュー対応予定</span>
                </div>
                <textarea rows="16" class="w-full flex-1 bg-transparent border-none text-slate-200 text-sm md:text-base leading-relaxed focus:outline-none resize-none font-serif" placeholder="ここに本文を記入してください...">ネオンの光がアスファルトの雨粒に反射し、まるで細かな星屑が地面に散らばっているかのように揺れていた。
襟を立てたコートのポケットの中で、冷え切った指先がかすかに震える。

「……遅かったな」

影の中から低く枯れた声が響く。振り返ると、古びた自動販売機の光に照らされた男が、煙草の火を赤く点滅させていた。</textarea>
            </div>
        </div>
    </main>

    <!-- Version Footer -->
    <footer class="py-3 text-center border-t border-dark-800 text-[11px] text-slate-500 font-mono tracking-wider">
        Chic Novelist Studio &mdash; V1.1
    </footer>

    <!-- Draggable Floating Action Buttons -->
    <!-- Tool Button (Default bottom-left) -->
    <div id="toolBtnContainer" class="draggable-btn fixed z-50 select-none" style="left: 24px; bottom: 24px;">
        <button id="toolBtn" class="w-11 h-11 rounded-full bg-dark-800 hover:bg-dark-700 text-slate-300 hover:text-white border border-dark-600 shadow-xl flex items-center justify-center transition active:scale-95" title="ツール（ドラッグで移動可能）">
            <i class="fa-solid fa-toolbox text-xs"></i>
        </button>
    </div>

    <!-- Ruby Button (Default bottom-right) -->
    <div id="rubyBtnContainer" class="draggable-btn fixed z-50 select-none" style="right: 24px; bottom: 24px;">
        <button id="rubyBtn" class="w-11 h-11 rounded-full bg-dark-800 hover:bg-dark-700 text-slate-300 hover:text-white border border-dark-600 shadow-xl flex items-center justify-center transition active:scale-95" title="ルビ付与（ドラッグで移動可能）">
            <i class="fa-solid fa-font text-xs"></i>
        </button>
    </div>

    <!-- Interactive Scripts -->
    <script>
        // Notification toast helper (No alert/confirm used)
        function showNotice(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-14 right-4 z-50 bg-dark-800 border border-slate-600 text-slate-200 px-3.5 py-2 rounded-lg shadow-xl text-xs flex items-center space-x-2 transition-all duration-300';
            toast.innerHTML = `<i class="fa-solid fa-info-circle text-slate-400"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2200);
        }

        // Target Section Toggle with localStorage Memory
        const targetSection = document.getElementById('targetSection');
        const toggleTargetBtn = document.getElementById('toggleTargetBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        const toggleText = document.getElementById('toggleText');

        // Load saved state (default: expanded)
        const savedTargetState = localStorage.getItem('novelist_target_collapsed');
        if (savedTargetState === 'true') {
            targetSection.style.maxHeight = '0px';
            targetSection.style.paddingTop = '0px';
            targetSection.style.paddingBottom = '0px';
            targetSection.style.opacity = '0';
            toggleText.textContent = '目標表示';
            toggleIcon.className = 'fa-solid fa-chart-pie text-slate-400';
        } else {
            targetSection.style.maxHeight = '120px';
            toggleText.textContent = '目標非表示';
            toggleIcon.className = 'fa-solid fa-chart-pie';
        }

        toggleTargetBtn.addEventListener('click', () => {
            const isCollapsed = targetSection.style.maxHeight === '0px' || targetSection.style.maxHeight === '';
            if (isCollapsed) {
                targetSection.style.maxHeight = '120px';
                targetSection.style.paddingTop = '0.5rem';
                targetSection.style.paddingBottom = '0.5rem';
                targetSection.style.opacity = '1';
                toggleText.textContent = '目標非表示';
                toggleIcon.className = 'fa-solid fa-chart-pie';
                localStorage.setItem('novelist_target_collapsed', 'false');
            } else {
                targetSection.style.maxHeight = '0px';
                targetSection.style.paddingTop = '0px';
                targetSection.style.paddingBottom = '0px';
                targetSection.style.opacity = '0';
                toggleText.textContent = '目標表示';
                toggleIcon.className = 'fa-solid fa-chart-pie text-slate-400';
                localStorage.setItem('novelist_target_collapsed', 'true');
            }
        });

        // Focus mode button action
        document.getElementById('focusModeBtn').addEventListener('click', () => {
            showNotice('集中モードは次のステップで実装予定です');
        });

        document.getElementById('toolBtn').addEventListener('click', (e) => {
            if (!e.defaultPrevented) showNotice('ツールメニュー（文字数詳細・設定など）');
        });

        document.getElementById('rubyBtn').addEventListener('click', (e) => {
            if (!e.defaultPrevented) showNotice('ルビ付与パネル・自動振替機能');
        });

        // Draggable Functionality for Floating Buttons (Mouse & Touch support)
        function makeDraggable(elm) {
            let startX = 0, startY = 0, initialX = 0, initialY = 0;
            let isDragging = false;
            let hasMoved = false;

            function dragStart(e) {
                isDragging = true;
                hasMoved = false;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                startX = clientX;
                startY = clientY;
                
                const rect = elm.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;

                // Switch from right/bottom positioning to absolute pixel positioning based on screen
                elm.style.left = initialX + 'px';
                elm.style.top = initialY + 'px';
                elm.style.right = 'auto';
                elm.style.bottom = 'auto';

                document.addEventListener('mousemove', dragMove);
                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchmove', dragMove, { passive: false });
                document.addEventListener('touchend', dragEnd);
            }

            function dragMove(e) {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dx = clientX - startX;
                const dy = clientY - startY;

                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    hasMoved = true;
                }

                let newX = initialX + dx;
                let newY = initialY + dy;

                // Boundary constraints
                const maxX = window.innerWidth - elm.offsetWidth;
                const maxY = window.innerHeight - elm.offsetHeight;

                newX = Math.max(10, Math.min(newX, maxX - 10));
                newY = Math.max(10, Math.min(newY, maxY - 10));

                elm.style.left = newX + 'px';
                elm.style.top = newY + 'px';

                if (e.touches && hasMoved) {
                    e.preventDefault(); // Prevent scrolling on mobile while dragging button
                }
            }

            function dragEnd(e) {
                if (!isDragging) return;
                isDragging = false;

                document.removeEventListener('mousemove', dragMove);
                document.removeEventListener('mouseup', dragEnd);
                document.removeEventListener('touchmove', dragMove);
                document.removeEventListener('touchend', dragEnd);

                if (hasMoved) {
                    // Prevent click event firing right after drag release
                    const innerBtn = elm.querySelector('button');
                    const clickPreventer = (event) => {
                        event.preventDefault();
                        event.stopPropagation();
                        innerBtn.removeEventListener('click', clickPreventer, true);
                    };
                    innerBtn.addEventListener('click', clickPreventer, true);
                }
            }

            elm.addEventListener('mousedown', dragStart);
            elm.addEventListener('touchstart', dragStart, { passive: false });
        }

        makeDraggable(document.getElementById('toolBtnContainer'));
        makeDraggable(document.getElementById('rubyBtnContainer'));
    </script>
</body>
</html>
