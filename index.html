<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chic Novelist Studio - Plot & Flag v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{dark:{900:'#0f172a',800:'#1e293b',700:'#334155',600:'#475569'}}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap');
body{font-family:Inter,'Noto Serif JP',serif;touch-action:manipulation}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#1e293b}::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}.plot-segment{position:absolute;left:0;right:0;border:1px solid;border-radius:5px;min-height:14px;display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1.1;padding:2px 1px;overflow:hidden;cursor:pointer;pointer-events:auto;box-shadow:0 1px 4px #02061799}.plot-segment span{writing-mode:vertical-rl;max-height:100%;overflow:hidden;white-space:nowrap}.modal-scroll{max-height:90dvh;overflow-y:auto}.hidden{display:none!important}
</style>
</head>
<body class="bg-dark-900 text-slate-200 min-h-screen flex flex-col antialiased">
<header class="bg-dark-800/90 border-b border-dark-700 px-4 py-3 sticky top-0 z-40 flex items-center justify-between shadow-sm"><div><div class="text-sm font-semibold tracking-wide" id="workTitle">深夜特急のレプリカント</div><div class="text-[10px] text-slate-400" id="workSubtitle">第1部・覚醒編</div></div><button id="focusBtn" class="p-2 rounded-lg bg-dark-700 text-xs"><i class="fa-solid fa-expand"></i> 集中</button></header>
<section id="stats" class="bg-dark-800/50 border-b border-dark-700 px-4 py-2"><div class="max-w-5xl mx-auto grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs"><div class="bg-dark-800 p-2 rounded-lg border border-dark-700"><div class="flex justify-between"><span class="text-slate-400">作品</span><span><b id="workCount">0</b> / <span id="workGoal">50,000</span>字</span></div><div class="h-1.5 bg-dark-900 rounded mt-1"><div id="workBar" class="h-1.5 bg-slate-400 rounded" style="width:0%"></div></div></div><div class="bg-dark-800 p-2 rounded-lg border border-dark-700"><div class="flex justify-between"><span class="text-slate-400" id="chapterLabel">第1章</span><span><b id="chapterCount">0</b> / <span id="chapterGoal">5,000</span>字</span></div><div class="h-1.5 bg-dark-900 rounded mt-1"><div id="chapterBar" class="h-1.5 bg-slate-500 rounded" style="width:0%"></div></div></div><div class="bg-dark-800 p-2 rounded-lg border border-dark-700"><div class="flex justify-between"><span class="text-slate-400" id="episodeLabel">第1話</span><span><b id="episodeCount">0</b> / <span id="episodeGoal">1,500</span>字</span></div><div class="h-1.5 bg-dark-900 rounded mt-1"><div id="episodeBar" class="h-1.5 bg-sky-500 rounded" style="width:0%"></div></div></div></div></section>
<main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-5 flex flex-col gap-3">
<div class="flex items-center gap-2"><button id="chapterPicker" class="text-xs rounded bg-dark-800 border border-dark-700 px-3 py-2"><i class="fa-solid fa-bookmark mr-1"></i><span id="chapterNum">第1章</span> ▾</button><input id="chapterTitle" class="min-w-0 flex-1 text-center text-sm font-bold bg-transparent border-b border-dark-700 focus:outline-none focus:border-slate-400 p-2" placeholder="章タイトル"><button id="editChapter" class="rounded bg-dark-800 border border-dark-700 px-3 py-2 text-xs" title="章を編集"><i class="fa-solid fa-pen"></i></button></div>
<div class="bg-dark-800/80 border border-dark-700 rounded-xl p-3 flex flex-col gap-2"><div class="flex items-center gap-2"><button id="episodePicker" class="text-xs rounded-lg bg-slate-700 px-3 py-2 font-bold whitespace-nowrap"><i class="fa-solid fa-book-open mr-1"></i><span id="episodeNum">第1話</span> ▾</button><input id="episodeTitle" class="min-w-0 flex-1 bg-transparent border-b border-dark-600 focus:outline-none focus:border-slate-300 p-2 font-semibold" placeholder="話タイトル"><button id="editEpisode" class="text-xs rounded bg-dark-700 px-3 py-2"><i class="fa-solid fa-pen"></i></button></div><textarea id="episodeSynopsis" rows="2" class="w-full bg-dark-900/80 border border-dark-700 rounded-lg p-2 text-xs resize-y" placeholder="話のあらすじ・構成ノート"></textarea></div>
<div class="grid grid-cols-12 gap-3 min-h-[430px]"><aside class="col-span-2 sm:col-span-1 bg-dark-800/60 border border-dark-700 rounded-xl p-2 flex flex-col items-center"><div id="gaugeCount" class="text-[10px] font-mono text-center">0字</div><div class="relative flex-1 w-full min-h-[300px] my-3 flex justify-center"><div class="absolute inset-y-0 w-3 bg-dark-900 border border-dark-700 rounded-full overflow-hidden"><div id="gaugeFill" class="absolute bottom-0 w-full bg-gradient-to-t from-emerald-400 via-indigo-500 to-sky-500 rounded-full" style="height:0%"></div></div><div id="plotTrack" class="absolute inset-0 pointer-events-none"></div></div><div id="gaugeGoal" class="text-[10px] font-mono text-slate-400 text-center">1.5k字</div><button id="addPlot" class="mt-3 w-8 h-8 rounded-full bg-dark-700 border border-dark-600"><i class="fa-solid fa-plus"></i></button></aside>
<section class="col-span-10 sm:col-span-11 bg-dark-800/50 border border-dark-700 rounded-xl p-3 flex flex-col"><div class="flex justify-between items-center border-b border-dark-700 pb-2 mb-2 text-xs text-slate-400"><span><i class="fa-solid fa-pen-nib mr-1"></i>本文エディタ</span><span id="saveStatus" class="text-emerald-400">自動保存</span></div><textarea id="editor" class="flex-1 min-h-[350px] bg-transparent resize-y focus:outline-none text-sm sm:text-base leading-8 font-serif" placeholder="ここに本文を記入してください..."></textarea></section></div>
<section class="bg-dark-800/50 border border-dark-700 rounded-xl p-3"><div class="flex items-center justify-between gap-2 mb-2"><h2 class="text-sm font-semibold"><i class="fa-solid fa-flag mr-2 text-amber-300"></i>伏線フラグ一覧</h2><span class="text-[10px] text-slate-400">配置済み・回収済みを管理</span></div><div id="flagList" class="flex flex-col gap-2 text-xs"></div></section>
</main><footer class="text-center text-[10px] text-slate-500 py-3 border-t border-dark-800">Chic Novelist Studio — Plot & Flag v1</footer>
<!-- Plot modal -->
<div id="plotModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center p-3"><div class="modal-scroll bg-dark-800 border border-dark-600 rounded-xl p-4 w-full max-w-lg shadow-2xl"><div class="flex justify-between items-center border-b border-dark-700 pb-3 mb-3"><h2 id="plotModalHeading" class="font-semibold text-sm">プロット追加</h2><button data-close="plotModal" class="text-slate-400 p-1"><i class="fa-solid fa-xmark"></i></button></div><input id="plotId" type="hidden"><div class="grid grid-cols-2 gap-3 text-xs"><label class="flex flex-col gap-1"><span class="text-slate-400">プロットNo.</span><input id="plotCode" class="bg-dark-900 border border-dark-700 rounded p-2" placeholder="#01"></label><label class="flex flex-col gap-1"><span class="text-slate-400">終了文字数（この展開の終わり）</span><input id="plotEnd" type="number" min="1" class="bg-dark-900 border border-dark-700 rounded p-2" placeholder="例：400"></label></div><label class="flex flex-col gap-1 text-xs mt-3"><span class="text-slate-400">展開内容・やること</span><textarea id="plotContent" rows="3" class="bg-dark-900 border border-dark-700 rounded p-2" placeholder="このブロックで起こること"></textarea></label><div class="mt-3 text-xs"><div class="text-slate-400 mb-2">役割タイプ</div><div class="grid grid-cols-3 gap-2"><label class="flex items-center gap-1.5 bg-dark-900 p-2 rounded border border-dark-700"><input type="radio" name="plotFlagType" value="normal" checked>通常</label><label class="flex items-center gap-1.5 bg-dark-900 p-2 rounded border border-amber-800"><input type="radio" name="plotFlagType" value="setup">伏線配置</label><label class="flex items-center gap-1.5 bg-dark-900 p-2 rounded border border-emerald-800"><input type="radio" name="plotFlagType" value="payoff">伏線回収</label></div></div><div id="setupFlagFields" class="mt-3 rounded-lg border border-amber-800/70 bg-amber-950/20 p-3"><label class="flex flex-col gap-1 text-xs"><span class="text-amber-300">登録する伏線フラグ名</span><input id="setupFlagName" class="bg-dark-900 border border-amber-900 rounded p-2" placeholder="例：情報屋が隠した記憶"></label><p class="text-[10px] text-slate-400 mt-1">この名前をフラグ一覧に登録し、あとで回収側から選べます。</p></div><div id="payoffFlagFields" class="hidden mt-3 rounded-lg border border-emerald-800/70 bg-emerald-950/20 p-3"><label class="flex flex-col gap-1 text-xs"><span class="text-emerald-300">回収する未回収フラグを選択</span><select id="payoffFlagSelect" class="bg-dark-900 border border-emerald-900 rounded p-2"></select></label><p id="noOpenFlags" class="hidden text-[10px] text-amber-300 mt-2">回収できる未回収フラグがありません。先に「伏線配置」を保存してください。</p></div><div class="flex items-center justify-between border-t border-dark-700 mt-4 pt-3"><button id="deletePlot" class="hidden text-rose-300 bg-rose-950/50 border border-rose-900 rounded px-3 py-2 text-xs">削除</button><div class="ml-auto flex gap-2"><button data-close="plotModal" class="bg-dark-700 rounded px-3 py-2 text-xs">キャンセル</button><button id="savePlot" class="bg-slate-600 hover:bg-slate-500 rounded px-4 py-2 text-xs font-semibold">保存</button></div></div></div></div>
<!-- chapter/episode simple selector -->
<div id="simpleModal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-3"><div class="bg-dark-800 border border-dark-600 rounded-xl p-4 w-full max-w-md"><div class="flex justify-between items-center mb-3"><h2 id="simpleTitle" class="font-semibold text-sm">選択</h2><button data-close="simpleModal"><i class="fa-solid fa-xmark"></i></button></div><div id="simpleBody" class="flex flex-col gap-2 max-h-[65dvh] overflow-auto"></div><div class="flex justify-end mt-4"><button data-close="simpleModal" class="bg-dark-700 rounded px-3 py-2 text-xs">閉じる</button></div></div></div>
<script>
'use strict';
const DB_KEY='novelist_studio_plot_flags_v1';
const seed={currentWorkId:'w1',works:[{id:'w1',title:'深夜特急のレプリカント',subtitle:'第1部・覚醒編',goal:50000,currentChapterId:'c1',chapters:[{id:'c1',number:'第1章',title:'雨音のプロムナード',goal:5000,synopsis:'主人公が情報屋と接触し、記憶の手がかりを得る。',currentEpisodeId:'e1',episodes:[{id:'e1',number:'第1話',title:'裏路地の情報屋',synopsis:'ネオン街の裏路地で情報屋と接触する導入シーケンス。',goal:1500,content:'ネオンの光がアスファルトの雨粒に反射し、まるで細かな星屑が地面に散らばっているかのように揺れていた。\n\n「……遅かったな」\n\n影の中から低く枯れた声が響く。',plots:[{id:'p1',code:'#01',endChar:300,content:'雨の裏路地での待ち合わせと雰囲気描写',flag:'normal'},{id:'p2',code:'#02',endChar:800,content:'情報屋からデータチップを受け取る',flag:'setup',flagId:'f1',flagName:'情報屋が隠した記憶'},{id:'p3',code:'#03',endChar:1300,content:'過去の事故の記憶フラッシュバック',flag:'payoff',flagRef:'f1'}]}]}]}]};
function loadDB(){try{let d=JSON.parse(localStorage.getItem(DB_KEY)||'null');if(!d){d=seed;localStorage.setItem(DB_KEY,JSON.stringify(d));}return normalize(d)}catch(e){return structuredClone(seed)}}
function normalize(db){db.works ||= structuredClone(seed.works);for(const w of db.works){w.chapters ||= [];for(const c of w.chapters){c.episodes ||= [];for(const ep of c.episodes){ep.plots ||= [];let previous=0;ep.plots.sort((a,b)=>(Number(a.endChar??a.targetChar)||0)-(Number(b.endChar??b.targetChar)||0));for(const p of ep.plots){if(p.endChar==null)p.endChar=Number(p.targetChar)||0;delete p.targetChar;if(p.flag==='setup'&&!p.flagId){p.flagId='f_'+p.id;p.flagName=p.flagName||p.content||'未命名の伏線'}if(p.flag==='payoff'&&!p.flagRef&&p.flagId)p.flagRef=p.flagId;}}}}return db}
function dbSave(){localStorage.setItem(DB_KEY,JSON.stringify(db))}let db=loadDB();
function work(){return db.works.find(x=>x.id===db.currentWorkId)||db.works[0]}function chapter(){let w=work();return w.chapters.find(x=>x.id===w.currentChapterId)||w.chapters[0]}function episode(){let c=chapter();return c.episodes.find(x=>x.id===c.currentEpisodeId)||c.episodes[0]}function uid(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notice(s){const n=document.createElement('div');n.className='fixed top-16 right-3 z-[100] bg-dark-700 border border-dark-600 rounded-lg px-3 py-2 text-xs shadow-xl';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),2000)}function pct(n,goal){return Math.max(0,Math.min(100,goal>0?n/goal*100:0))}
function allPlots(){return work().chapters.flatMap(c=>c.episodes.flatMap(e=>e.plots||[]))}function allFlags(){const ps=allPlots();const setups=ps.filter(p=>p.flag==='setup'&&p.flagId).map(p=>({id:p.flagId,name:p.flagName||p.content,source:p}));const recovered=new Set(ps.filter(p=>p.flag==='payoff'&&p.flagRef).map(p=>p.flagRef));return setups.map(f=>({...f,recovered:recovered.has(f.id)}))}
function render(){const w=work(),c=chapter(),e=episode();if(!w||!c||!e)return;document.getElementById('workTitle').textContent=w.title;document.getElementById('workSubtitle').textContent=w.subtitle||'';document.getElementById('chapterNum').textContent=c.number;document.getElementById('chapterTitle').value=c.title;document.getElementById('episodeNum').textContent=e.number;document.getElementById('episodeTitle').value=e.title;document.getElementById('episodeSynopsis').value=e.synopsis||'';if(document.activeElement!==document.getElementById('editor'))document.getElementById('editor').value=e.content||'';
let ec=(e.content||'').length,eg=Number(e.goal)||1500,cc=c.episodes.reduce((a,x)=>a+(x.content||'').length,0),cg=Number(c.goal)||5000,wc=w.chapters.reduce((a,x)=>a+x.episodes.reduce((b,y)=>b+(y.content||'').length,0),0),wg=Number(w.goal)||50000;
[['episodeCount',ec],['episodeGoal',eg],['chapterCount',cc],['chapterGoal',cg],['workCount',wc],['workGoal',wg]].forEach(([id,v])=>document.getElementById(id).textContent=Number(v).toLocaleString());document.getElementById('episodeLabel').textContent=e.number;document.getElementById('chapterLabel').textContent=c.number;document.getElementById('episodeBar').style.width=pct(ec,eg)+'%';document.getElementById('chapterBar').style.width=pct(cc,cg)+'%';document.getElementById('workBar').style.width=pct(wc,wg)+'%';document.getElementById('gaugeCount').textContent=ec.toLocaleString()+'字';document.getElementById('gaugeGoal').textContent=eg>=1000?(eg/1000).toFixed(1)+'k字':eg+'字';document.getElementById('gaugeFill').style.height=pct(ec,eg)+'%';renderPlots(e,eg);renderFlags();}
function renderPlots(e,goal){const track=document.getElementById('plotTrack');track.innerHTML='';let start=0;const ps=[...(e.plots||[])].sort((a,b)=>a.endChar-b.endChar);for(const p of ps){const end=Math.max(start+1,Number(p.endChar)||start+1);const top=Math.min(100,start/goal*100),height=Math.max(3,(end-start)/goal*100);const node=document.createElement('button');node.type='button';node.className='plot-segment '+(p.flag==='setup'?'bg-amber-950/90 border-amber-400 text-amber-200':p.flag==='payoff'?'bg-emerald-950/90 border-emerald-400 text-emerald-200':'bg-slate-700/95 border-slate-400 text-slate-100');node.style.top=top+'%';node.style.height=Math.max(14,Math.min(100-top,height))+'%';node.style.minHeight='14px';node.title=`${p.code}：${start.toLocaleString()}〜${end.toLocaleString()}字\n${p.content}${p.flag==='setup'?'\n伏線：'+(p.flagName||''):p.flag==='payoff'?'\n回収：'+(allFlags().find(f=>f.id===p.flagRef)?.name||'紐付け先なし'):''}`;node.innerHTML=`<span>${esc(p.code)}${p.flag==='setup'?' ⚑':p.flag==='payoff'?' ✓':''}</span>`;node.addEventListener('click',()=>openPlot(p));track.appendChild(node);start=end;}}
function renderFlags(){const el=document.getElementById('flagList');const flags=allFlags();if(!flags.length){el.innerHTML='<div class="text-slate-400">まだ伏線フラグはありません。「＋」からプロットを追加し、役割タイプを「伏線配置」にして登録してください。</div>';return}el.innerHTML=flags.map(f=>`<div class="flex items-center gap-2 p-2 rounded border ${f.recovered?'border-emerald-900 bg-emerald-950/20':'border-amber-900 bg-amber-950/20'}"><span class="${f.recovered?'text-emerald-300':'text-amber-300'}"><i class="fa-solid ${f.recovered?'fa-check-circle':'fa-flag'}"></i></span><div class="min-w-0 flex-1"><div class="font-semibold">${esc(f.name)}</div><div class="text-[10px] text-slate-400">配置元：${esc(f.source.code)}・終了 ${Number(f.source.endChar).toLocaleString()}字</div></div><span class="text-[10px] rounded px-2 py-1 ${f.recovered?'bg-emerald-900/60 text-emerald-200':'bg-amber-900/60 text-amber-200'}">${f.recovered?'回収済み':'未回収'}</span></div>`).join('')}
const plotModal=document.getElementById('plotModal');function modalOpen(el){el.classList.remove('hidden');el.classList.add('flex')}function modalClose(el){el.classList.add('hidden');el.classList.remove('flex')}
function currentFlagsForSelect(excludePlotId){const flags=allFlags().filter(f=>!f.recovered&&f.source.id!==excludePlotId);const sel=document.getElementById('payoffFlagSelect');sel.innerHTML='';if(!flags.length){sel.innerHTML='<option value="">未回収フラグなし</option>';document.getElementById('noOpenFlags').classList.remove('hidden')}else{document.getElementById('noOpenFlags').classList.add('hidden');sel.innerHTML='<option value="">回収する伏線を選択…</option>'+flags.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}（${esc(f.source.code)}・${Number(f.source.endChar).toLocaleString()}字）</option>`).join('')}}
function updateFlagFields(){const type=document.querySelector('input[name="plotFlagType"]:checked').value;document.getElementById('setupFlagFields').classList.toggle('hidden',type!=='setup');document.getElementById('payoffFlagFields').classList.toggle('hidden',type!=='payoff');if(type==='payoff')currentFlagsForSelect(document.getElementById('plotId').value)}document.querySelectorAll('input[name="plotFlagType"]').forEach(r=>r.addEventListener('change',updateFlagFields));
function openPlot(p=null){const e=episode(),ps=e.plots||[];document.getElementById('plotId').value=p?.id||'';document.getElementById('plotModalHeading').textContent=p?'プロット編集':'プロット追加';document.getElementById('plotCode').value=p?.code||('#'+String(ps.length+1).padStart(2,'0'));document.getElementById('plotEnd').value=p?.endChar??Math.min(Number(e.goal)||1500,(ps.length?Math.max(...ps.map(x=>Number(x.endChar)||0))+300:300));document.getElementById('plotContent').value=p?.content||'';document.getElementById('setupFlagName').value=p?.flagName||'';document.querySelector(`input[name="plotFlagType"][value="${p?.flag||'normal'}"]`).checked=true;document.getElementById('deletePlot').classList.toggle('hidden',!p);updateFlagFields();if(p?.flag==='payoff'&&p.flagRef){const sel=document.getElementById('payoffFlagSelect');if(![...sel.options].some(o=>o.value===p.flagRef)){const flag=allFlags().find(f=>f.id===p.flagRef);if(flag)sel.add(new Option(flag.name+'（現在紐付け中）',flag.id))}sel.value=p.flagRef}modalOpen(plotModal)}
document.getElementById('addPlot').addEventListener('click',()=>openPlot());document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>modalClose(document.getElementById(b.dataset.close))));plotModal.addEventListener('click',e=>{if(e.target===plotModal)modalClose(plotModal)});
document.getElementById('savePlot').addEventListener('click',()=>{const id=document.getElementById('plotId').value,code=document.getElementById('plotCode').value.trim(),endChar=Number(document.getElementById('plotEnd').value),content=document.getElementById('plotContent').value.trim(),flag=document.querySelector('input[name="plotFlagType"]:checked').value;if(!code||!content||!Number.isFinite(endChar)||endChar<1){notice('No.・終了文字数・内容を正しく入力してください');return}const e=episode();e.plots||=[];const old=e.plots.find(x=>x.id===id);let item={...(old||{}),id:id||uid('p'),code,endChar,content,flag};delete item.targetChar;delete item.flagId;delete item.flagName;delete item.flagRef;if(flag==='setup'){const flagName=document.getElementById('setupFlagName').value.trim();if(!flagName){notice('登録する伏線フラグ名を入力してください');return}item.flagId=old?.flag==='setup'&&old.flagId?old.flagId:uid('f');item.flagName=flagName;if(old?.flag==='setup'&&old.flagId&&old.flagName!==flagName){/* keep same identity so existing recovery references remain valid */}}
if(flag==='payoff'){const flagRef=document.getElementById('payoffFlagSelect').value;if(!flagRef){notice('回収する未回収フラグを選択してください');return}const selected=allFlags().find(f=>f.id===flagRef);if(!selected){notice('選択したフラグが見つかりません');return}if(selected.source.id===id){notice('同じプロット自身の伏線は回収できません');return}item.flagRef=flagRef;item.flagName=selected.name}
if(old){e.plots=e.plots.map(x=>x.id===id?item:x)}else e.plots.push(item);e.plots.sort((a,b)=>a.endChar-b.endChar);dbSave();render();modalClose(plotModal);notice('プロットを保存しました')});
document.getElementById('deletePlot').addEventListener('click',()=>{const id=document.getElementById('plotId').value;if(!id||!confirm('このプロットを削除しますか？'))return;const e=episode();e.plots=e.plots.filter(p=>p.id!==id);dbSave();render();modalClose(plotModal);notice('プロットを削除しました')});
// Keep the editor autosave immediate and update gauge/progress while typing.
let saveTimer;document.getElementById('editor').addEventListener('input',e=>{episode().content=e.target.value;dbSave();render();document.getElementById('saveStatus').textContent='保存中…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>document.getElementById('saveStatus').textContent='自動保存完了',350)});
function saveField(id,field){document.getElementById(id).addEventListener('change',e=>{episode()[field]=e.target.value;dbSave();render()})}saveField('episodeTitle','title');saveField('episodeSynopsis','synopsis');document.getElementById('chapterTitle').addEventListener('change',e=>{chapter().title=e.target.value;dbSave();render()});
const simpleModal=document.getElementById('simpleModal');function simple(title,body){document.getElementById('simpleTitle').textContent=title;document.getElementById('simpleBody').innerHTML=body;modalOpen(simpleModal)}simpleModal.addEventListener('click',e=>{if(e.target===simpleModal)modalClose(simpleModal)});
document.getElementById('chapterPicker').addEventListener('click',()=>{const w=work();simple('章の切替・管理',w.chapters.map(c=>`<button data-ch="${esc(c.id)}" class="text-left p-3 rounded border ${c.id===w.currentChapterId?'border-slate-400 bg-dark-700':'border-dark-700 bg-dark-900'}"><b>${esc(c.number)} ${esc(c.title)}</b><div class="text-slate-400 mt-1">${esc(c.synopsis||'あらすじなし')}</div></button>`).join('')+`<button id="newChapter" class="p-3 rounded bg-slate-700">＋ 新しい章</button>`);document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{w.currentChapterId=b.dataset.ch;dbSave();render();modalClose(simpleModal)});document.getElementById('newChapter').onclick=()=>{const number=prompt('章番号',`第${w.chapters.length+1}章`);if(!number)return;const title=prompt('章タイトル','新しい章');if(!title)return;const eid=uid('e'),cid=uid('c');w.chapters.push({id:cid,number,title,goal:5000,synopsis:'',currentEpisodeId:eid,episodes:[{id:eid,number:'第1話',title:'第1話',synopsis:'',goal:1500,content:'',plots:[]}]});w.currentChapterId=cid;dbSave();render();modalClose(simpleModal)}});
document.getElementById('episodePicker').addEventListener('click',()=>{const c=chapter();simple('話の切替・管理',c.episodes.map(e=>`<button data-ep="${esc(e.id)}" class="text-left p-3 rounded border ${e.id===c.currentEpisodeId?'border-slate-400 bg-dark-700':'border-dark-700 bg-dark-900'}"><b>${esc(e.number)} ${esc(e.title)}</b><div class="text-slate-400 mt-1">${(e.content||'').length.toLocaleString()}字</div></button>`).join('')+`<button id="newEpisode" class="p-3 rounded bg-slate-700">＋ 新しい話</button>`);document.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{c.currentEpisodeId=b.dataset.ep;dbSave();render();modalClose(simpleModal)});document.getElementById('newEpisode').onclick=()=>{const number=prompt('話数',`第${c.episodes.length+1}話`);if(!number)return;const title=prompt('話タイトル','新しい話');if(!title)return;const id=uid('e');c.episodes.push({id,number,title,synopsis:'',goal:1500,content:'',plots:[]});c.currentEpisodeId=id;dbSave();render();modalClose(simpleModal)}});
document.getElementById('editChapter').addEventListener('click',()=>{const c=chapter();const title=prompt('章タイトル',c.title);if(title===null)return;const number=prompt('章番号',c.number);if(number===null)return;c.title=title;c.number=number;const goal=prompt('章の目標文字数',c.goal||5000);if(goal!==null&&Number(goal)>0)c.goal=Number(goal);dbSave();render()});document.getElementById('editEpisode').addEventListener('click',()=>{const e=episode();const title=prompt('話タイトル',e.title);if(title===null)return;const number=prompt('話数',e.number);if(number===null)return;e.title=title;e.number=number;const goal=prompt('話の目標文字数',e.goal||1500);if(goal!==null&&Number(goal)>0)e.goal=Number(goal);dbSave();render()});
document.getElementById('focusBtn').addEventListener('click',()=>{const active=document.body.classList.toggle('focus');document.getElementById('stats').classList.toggle('hidden',active);document.querySelector('header').classList.toggle('hidden',active);document.getElementById('focusBtn').innerHTML=active?'<i class="fa-solid fa-compress"></i> 通常':'<i class="fa-solid fa-expand"></i> 集中'});
render();
</script>
</body></html>
