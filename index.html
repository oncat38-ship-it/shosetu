<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chic Novelist Studio - UI Mockup V1.5</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Inter', 'Noto Serif JP', serif;
            touch-action: manipulation;
        }
        /* Custom scrollbar for chic look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Draggable buttons style */
        .draggable-btn {
            touch-action: none;
            user-select: none;
            cursor: grab;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .draggable-btn:active {
            cursor: grabbing;
        }
        .draggable-btn.locked {
            cursor: pointer;
        }
        .draggable-btn.hidden-mode {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        /* Vertical Text Style */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-200 min-h-screen flex flex-col antialiased selection:bg-slate-700 selection:text-white">

    <!-- Top Banner -->
    <header class="bg-dark-800/90 backdrop-blur-md border-b border-dark-700 px-4 py-2.5 sticky top-0 z-40 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <!-- App Icon -->
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-slate-700 to-dark-900 flex items-center justify-center border border-slate-600 shadow-inner">
                <i class="fa-solid fa-feather-pointed text-[11px] text-slate-300"></i>
            </div>
            <!-- Work Title & Subtitle Container -->
            <div class="flex items-center space-x-3">
                <button id="openWorkSelectorBtn" class="text-left group flex flex-col focus:outline-none" title="作品の切り替え・編集・新規登録">
                    <div class="flex items-center space-x-1.5">
                        <h1 id="currentWorkTitleDisplay" class="text-xs md:text-sm font-semibold tracking-wide text-slate-100 group-hover:text-white transition">深夜特急のレプリカント</h1>
                        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 group-hover:text-slate-200 transition"></i>
                    </div>
                    <span id="currentWorkSubTitleDisplay" class="text-[10px] text-slate-400 font-medium tracking-wide">第1部・覚醒編</span>
                </button>
            </div>
        </div>

        <!-- Focus Mode Button -->
        <button id="focusModeBtn" title="集中モード" class="p-1.5 px-2.5 rounded-lg bg-dark-700/60 hover:bg-dark-700 text-slate-300 hover:text-white transition border border-dark-600/50 flex items-center space-x-1.5 text-xs">
            <i id="focusIcon" class="fa-solid fa-expand"></i>
            <span class="hidden sm:inline" id="focusText">集中モード</span>
        </button>
    </header>

    <!-- Compact Progress Dashboard (Controlled by Focus Mode) -->
    <section id="targetSection" class="bg-dark-800/50 border-b border-dark-700/60 px-4 py-2 text-xs transition-all duration-300 overflow-hidden">
        <div id="targetGridContainer" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-2.5">
            <!-- Overall Progress -->
            <div id="goalOverall" class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span class="text-slate-400">全体目標</span>
                    <span class="font-mono text-slate-200"><span id="overallCurrentText">0</span> / <span id="overallGoalText" class="text-slate-400">50,000字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div id="overallBar" class="bg-slate-400 h-1.5 rounded-full" style="width: 0%;"></div>
                </div>
            </div>
            <!-- Chapter Progress -->
            <div id="goalChapter" class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span id="chapterGoalLabel" class="text-slate-400">章目標（第3章）</span>
                    <span class="font-mono text-slate-200"><span id="chapterCurrentText">0</span> / <span id="chapterGoalText" class="text-slate-400">5,000字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div id="chapterBar" class="bg-slate-500 h-1.5 rounded-full" style="width: 0%;"></div>
                </div>
            </div>
            <!-- Episode Progress -->
            <div id="goalEpisode" class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span id="episodeGoalLabel" class="text-slate-400">本話（第12話）</span>
                    <span class="font-mono text-slate-200"><span id="episodeCurrentText">0</span> / <span id="episodeGoalText" class="text-slate-400">1,500字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div id="episodeBar" class="bg-slate-300 h-1.5 rounded-full" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col space-y-3">

        <!-- Navigation Stack Container -->
        <div class="flex flex-col space-y-2">
            
            <!-- 1. Chapter Banner (Left: Compact Badge / Center: Large Title / Right: Minimal Buttons) -->
            <div class="relative flex items-center justify-center w-full py-1 min-h-[36px]">
                <!-- Chapter Selector Badge (Fixed to Left Edge) -->
                <button id="selectChapterBtn" class="absolute left-0 flex items-center space-x-1 bg-dark-800/90 hover:bg-dark-700 border border-dark-700 hover:border-dark-600 rounded px-2 py-0.5 shrink-0 text-slate-300 transition text-[10px]" title="章の切替・一覧">
                    <i class="fa-solid fa-bookmark text-[8px] text-slate-400"></i>
                    <span id="currentChapterNumDisplay" class="font-semibold">第3章</span>
                    <i class="fa-solid fa-chevron-down text-[7px] text-slate-400"></i>
                </button>
                
                <!-- Chapter Title (Centered & Large) -->
                <div class="flex justify-center w-full max-w-md px-16">
                    <input type="text" id="chapterTitleInput" value="雨音のプロムナード" class="bg-transparent border-b border-transparent hover:border-dark-600 focus:border-slate-400 outline-none text-sm md:text-base font-bold text-slate-200 py-0.5 transition w-full text-center truncate" placeholder="章タイトル...">
                </div>

                <!-- Minimized Chapter Actions (Fixed to Right Edge, Extra Small) -->
                <div class="absolute right-0 flex items-center space-x-1 shrink-0">
                    <button id="openChapterSynopsisModalBtn" class="p-1 px-1.5 rounded bg-dark-800/80 hover:bg-dark-700 text-slate-400 hover:text-slate-200 text-[10px] transition border border-dark-700" title="章のあらすじ">
                        <i class="fa-solid fa-file-lines text-[10px]"></i>
                    </button>
                    <button id="editChapterBtn" class="p-1 px-1.5 rounded bg-dark-800/80 hover:bg-dark-700 text-slate-400 hover:text-slate-200 text-[10px] transition border border-dark-700" title="章の編集">
                        <i class="fa-solid fa-pen text-[10px]"></i>
                    </button>
                </div>
            </div>

            <!-- 2. Episode (話) Banner (Prominent, Center-oriented & Larger) -->
            <div class="w-full max-w-2xl mx-auto bg-dark-800/80 border border-dark-700 rounded-xl p-3.5 shadow-md flex flex-col space-y-2.5">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2.5 flex-1 mr-2">
                        <!-- Larger Episode Selector Badge Button -->
                        <button id="selectEpisodeBtn" class="flex items-center space-x-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg px-3 py-1.5 shrink-0 transition shadow text-xs md:text-sm font-bold" title="話の切替・一覧">
                            <i class="fa-solid fa-book-open text-xs text-slate-300"></i>
                            <span id="currentEpisodeNumDisplay">第12話</span>
                            <i class="fa-solid fa-chevron-down text-[10px] text-slate-300"></i>
                        </button>
                        <!-- Episode Title Input -->
                        <input type="text" id="episodeTitleInput" value="裏路地の情報屋" class="bg-transparent border-b border-dark-600 focus:border-slate-300 outline-none text-base md:text-lg font-bold text-slate-100 py-0.5 transition w-full" placeholder="話タイトルを入力...">
                    </div>

                    <button id="editEpisodeBtn" class="px-2.5 py-1.5 rounded-lg bg-dark-700 hover:bg-dark-600 text-slate-200 transition text-xs flex items-center space-x-1.5 border border-dark-600 shrink-0 font-medium" title="話の編集・削除">
                        <i class="fa-solid fa-pen text-[11px]"></i>
                        <span class="hidden sm:inline">話の編集</span>
                    </button>
                </div>

                <!-- Episode Synopsis Field (Minimum 2-lines visible) -->
                <div class="relative mt-1">
                    <span class="absolute -top-2 left-2.5 px-1 bg-dark-800 text-[9px] text-slate-400 font-medium uppercase tracking-wider border border-dark-700 rounded">話のあらすじ</span>
                    <textarea id="episodeSynopsisInput" rows="2" class="w-full bg-dark-900/80 border border-dark-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-slate-500 transition resize-y leading-relaxed min-h-[3.2rem]" placeholder="話のあらすじや構成ノート（最低2行分表示）...">ネオン街の裏路地で情報屋と接触。過去の記憶の手がかりとなるデータチップを入手するメインシーケンス。</textarea>
                </div>
            </div>

        </div>

        <!-- Editor Section with Plot Column & Vertical Counter on the Left -->
        <div class="flex-1 grid grid-cols-12 gap-3 items-stretch">
            
            <!-- 1. Plot No. Vertical Column (Left Side) -->
            <div class="col-span-3 md:col-span-2 bg-dark-800/40 border border-dark-700/60 rounded-xl p-2.5 flex flex-col space-y-2.5">
                <div class="flex items-center justify-between border-b border-dark-700 pb-1.5">
                    <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">プロットNo.</span>
                    <button title="プロット追加" class="text-slate-400 hover:text-slate-200 text-xs"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="flex flex-col space-y-2 overflow-y-auto max-h-[500px] pr-0.5">
                    <!-- Plot Item 1 (Active) -->
                    <div class="p-2 rounded-lg bg-dark-700/60 border border-slate-600 cursor-pointer text-xs transition shadow-sm">
                        <div class="font-mono text-[10px] text-slate-400">#PLOT-012</div>
                        <div class="font-medium text-slate-200 truncate mt-0.5">裏路地での密会</div>
                    </div>
                    <!-- Plot Item 2 -->
                    <div class="p-2 rounded-lg bg-dark-800/80 border border-dark-700/60 hover:bg-dark-700/40 cursor-pointer text-xs transition text-slate-400">
                        <div class="font-mono text-[10px] text-slate-500">#PLOT-013</div>
                        <div class="truncate mt-0.5">雨のハイウェイ</div>
                    </div>
                    <!-- Plot Item 3 -->
                    <div class="p-2 rounded-lg bg-dark-800/80 border border-dark-700/60 hover:bg-dark-700/40 cursor-pointer text-xs transition text-slate-400">
                        <div class="font-mono text-[10px] text-slate-500">#PLOT-014</div>
                        <div class="truncate mt-0.5">記憶の残響</div>
                    </div>
                </div>
            </div>

            <!-- 2. Vertical Episode Character Counter & Progress Bar (Next to Editor) -->
            <div class="col-span-1 bg-dark-800/50 border border-dark-700/60 rounded-xl p-2 flex flex-col items-center justify-between shadow-inner relative">
                <!-- Current Count Badge Top -->
                <div class="flex flex-col items-center space-y-1">
                    <span class="text-[9px] text-slate-400 font-medium vertical-text tracking-widest">現在の文字数</span>
                    <span id="sideEpCurrentText" class="font-mono text-xs font-bold text-slate-100">0</span>
                </div>

                <!-- Vertical Progress Bar -->
                <div class="w-2 flex-1 bg-dark-900/90 rounded-full my-2 relative overflow-hidden border border-dark-700/50 flex flex-col justify-end">
                    <div id="sideEpBar" class="w-full bg-gradient-to-t from-slate-500 to-slate-300 transition-all duration-300 rounded-full" style="height: 0%;"></div>
                </div>

                <!-- Goal Count Badge Bottom -->
                <div class="flex flex-col items-center space-y-1">
                    <span id="sideEpGoalText" class="font-mono text-[10px] text-slate-400">1,500</span>
                    <span class="text-[9px] text-slate-400 font-medium vertical-text tracking-widest">目標文字数</span>
                </div>
            </div>

            <!-- 3. Main Body Writing Field -->
            <div class="col-span-8 md:col-span-9 bg-dark-800/50 border border-dark-700/70 rounded-xl p-3.5 flex flex-col shadow-inner relative">
                <div class="flex justify-between items-center mb-2 text-xs text-slate-400 border-b border-dark-700/50 pb-1.5">
                    <div class="flex items-center space-x-1.5">
                        <i class="fa-solid fa-pen-nib"></i>
                        <span>本文エディタ</span>
                    </div>
                    <span class="font-mono text-[10px]">Markdown / 縦書き風プレビュー対応予定</span>
                </div>
                <textarea id="mainEditor" rows="16" class="w-full flex-1 bg-transparent border-none text-slate-200 text-sm md:text-base leading-relaxed focus:outline-none resize-none font-serif" placeholder="ここに本文を記入してください...">ネオンの光がアスファルトの雨粒に反射し、まるで細かな星屑が地面に散らばっているかのように揺れていた。
襟を立てたコートのポケットの中で、冷え切った指先がかすかに震える。

「……遅かったな」

影の中から低く枯れた声が響く。振り返ると、古びた自動販売機の光に照らされた男が、煙草の火を赤く点滅させていた。</textarea>
            </div>
        </div>
    </main>

    <!-- Version Footer -->
    <footer class="py-3 text-center border-t border-dark-800 text-[11px] text-slate-500 font-mono tracking-wider">
        Chic Novelist Studio &mdash; V1.5
    </footer>

    <!-- Chapter Synopsis Modal (Minimized Popup View) -->
    <div id="chapterSynopsisModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl max-w-md w-full p-5 shadow-2xl flex flex-col space-y-3">
            <div class="flex items-center justify-between border-b border-dark-700 pb-2.5">
                <div class="flex items-center space-x-2 text-slate-100 font-semibold text-sm">
                    <i class="fa-solid fa-file-lines text-slate-400"></i>
                    <span id="synopsisModalChapterTitle">章のあらすじ</span>
                </div>
                <button id="closeChapterSynopsisModalBtn" class="text-slate-400 hover:text-slate-200 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <textarea id="popupChapterSynopsisInput" rows="5" class="w-full bg-dark-900 border border-dark-700 rounded-lg p-3 text-xs text-slate-200 focus:outline-none focus:border-slate-500 transition resize-none leading-relaxed" placeholder="章のあらすじを入力..."></textarea>
            <div class="flex justify-end pt-1">
                <button id="savePopupSynopsisBtn" class="px-4 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 text-xs font-medium transition shadow">保存して閉じる</button>
            </div>
        </div>
    </div>

    <!-- Episode (話) Selector & Management Modal -->
    <div id="episodeModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl max-w-lg w-full p-5 shadow-2xl flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-dark-700 pb-3">
                <div id="episodeModalTitle" class="flex items-center space-x-2 text-slate-100 font-semibold text-sm">
                    <i class="fa-solid fa-book-open text-slate-400"></i>
                    <span>話（エピソード）の切替・管理</span>
                </div>
                <button id="closeEpisodeModalBtn" class="text-slate-400 hover:text-slate-200 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Tab Switcher -->
            <div id="episodeModalTabs" class="flex space-x-2 border-b border-dark-700 pb-2 text-xs">
                <button id="tabEpisodeListBtn" class="px-3 py-1.5 rounded-lg bg-dark-700 text-slate-100 font-medium transition">話一覧・切替</button>
                <button id="tabEpisodeNewBtn" class="px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition">新規話追加</button>
            </div>

            <!-- Episode List View -->
            <div id="episodeListView" class="flex flex-col space-y-2.5 max-h-64 overflow-y-auto pr-1 text-xs">
                <!-- Dynamically populated episodes -->
            </div>

            <!-- Episode Form View (Create / Edit) -->
            <div id="episodeFormView" class="hidden flex flex-col space-y-3 text-xs">
                <input type="hidden" id="editingEpisodeId" value="">
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1 flex flex-col space-y-1">
                        <label class="text-slate-400 font-medium">話数 <span class="text-rose-400">*</span></label>
                        <input type="text" id="formEpisodeNumInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 第1話">
                    </div>
                    <div class="col-span-2 flex flex-col space-y-1">
                        <label class="text-slate-400 font-medium">話タイトル <span class="text-rose-400">*</span></label>
                        <input type="text" id="formEpisodeTitleInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 裏路地の情報屋">
                    </div>
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">話のあらすじ</label>
                    <textarea id="formEpisodeSynopsisInput" rows="2" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500 resize-none" placeholder="この話の要点や出来事..."></textarea>
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">目標文字数</label>
                    <input type="number" id="formEpisodeGoalInput" value="1500" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500 font-mono">
                </div>
                <div class="flex items-center justify-between pt-2">
                    <button id="deleteEpisodeBtn" type="button" class="px-3 py-2 rounded-lg bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 transition border border-rose-800/50">この話を削除</button>
                    <div class="flex space-x-2 ml-auto">
                        <button id="cancelEpisodeFormBtn" type="button" class="px-3 py-2 rounded-lg bg-dark-700 hover:bg-dark-600 text-slate-300 transition">キャンセル</button>
                        <button id="saveEpisodeFormBtn" type="button" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium transition shadow">保存する</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chapter Selector Modal -->
    <div id="chapterModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl max-w-lg w-full p-5 shadow-2xl flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-dark-700 pb-3">
                <div id="chapterModalTitle" class="flex items-center space-x-2 text-slate-100 font-semibold text-sm">
                    <i class="fa-solid fa-bookmark text-slate-400"></i>
                    <span>章（チャプター）の切替・管理</span>
                </div>
                <button id="closeChapterModalBtn" class="text-slate-400 hover:text-slate-200 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="chapterModalTabs" class="flex space-x-2 border-b border-dark-700 pb-2 text-xs">
                <button id="tabChapterListBtn" class="px-3 py-1.5 rounded-lg bg-dark-700 text-slate-100 font-medium transition">章一覧・切替</button>
                <button id="tabChapterNewBtn" class="px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition">新規章作成</button>
            </div>

            <div id="chapterListView" class="flex flex-col space-y-2.5 max-h-64 overflow-y-auto pr-1 text-xs"></div>

            <div id="chapterFormView" class="hidden flex flex-col space-y-3 text-xs">
                <input type="hidden" id="editingChapterId" value="">
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1 flex flex-col space-y-1">
                        <label class="text-slate-400 font-medium">章番号 <span class="text-rose-400">*</span></label>
                        <input type="text" id="formChapterNumInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 第1章">
                    </div>
                    <div class="col-span-2 flex flex-col space-y-1">
                        <label class="text-slate-400 font-medium">章タイトル <span class="text-rose-400">*</span></label>
                        <input type="text" id="formChapterTitleInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 雨音のプロムナード">
                    </div>
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">章のあらすじ</label>
                    <textarea id="formChapterSynopsisInput" rows="2" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500 resize-none" placeholder="この章のあらすじや方針..."></textarea>
                </div>
                <div class="flex flex-col space-y-1">

    <!-- Draggable Floating Action Buttons -->
    <div id="toolBtnContainer" class="draggable-btn fixed z-50 select-none" style="left: 24px; bottom: 24px;">
        <button id="toolBtn" class="w-11 h-11 rounded-full bg-dark-800 hover:bg-dark-700 text-slate-300 hover:text-white border border-dark-600 shadow-xl flex items-center justify-center transition active:scale-95" title="ツール・設定">

        </button>

    <div id="rubyBtnContainer" class="draggable-btn fixed z-50 select-none" style="right: 24px; bottom: 24px;">
        <button id="rubyBtn" class="w-11 h-11 rounded-full bg-dark-800 hover:bg-dark-700 text-slate-300 hover:text-white border border-dark-600 shadow-xl flex items-center justify-center transition active:scale-95" title="ルビ付与">
            <i class="fa-solid fa-font text-xs"></i>
        </button>
    </div>

    <!-- Interactive Scripts -->
    <script>
        // Notification toast helper
        function showNotice(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-14 right-4 z-50 bg-dark-800 border border-slate-600 text-slate-200 px-3.5 py-2 rounded-lg shadow-xl text-xs flex items-center space-x-2 transition-all duration-300';
            toast.innerHTML = `<i class="fa-solid fa-info-circle text-slate-400"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2200);
        }

        // Focus Mode Toggle
        const targetSection = document.getElementById('targetSection');
        const focusModeBtn = document.getElementById('focusModeBtn');
        const focusIcon = document.getElementById('focusIcon');
        const focusText = document.getElementById('focusText');
        const toolBtnContainer = document.getElementById('toolBtnContainer');
        const rubyBtnContainer = document.getElementById('rubyBtnContainer');

        let isFocusMode = false;
        focusModeBtn.addEventListener('click', () => {
            isFocusMode = !isFocusMode;
            if (isFocusMode) {
                targetSection.style.maxHeight = '0px';
                targetSection.style.paddingTop = '0px';
                targetSection.style.paddingBottom = '0px';
                targetSection.style.opacity = '0';
                toolBtnContainer.classList.add('hidden-mode');
                rubyBtnContainer.classList.add('hidden-mode');
                focusText.textContent = '通常モード';
                focusIcon.className = 'fa-solid fa-compress';
                showNotice('集中モードに切り替えました');
            } else {
                targetSection.style.maxHeight = '120px';
                targetSection.style.paddingTop = '0.5rem';
                targetSection.style.paddingBottom = '0.5rem';
                targetSection.style.opacity = '1';
                toolBtnContainer.classList.remove('hidden-mode');
                rubyBtnContainer.classList.remove('hidden-mode');
                focusText.textContent = '集中モード';
                focusIcon.className = 'fa-solid fa-expand';
                showNotice('通常モードに戻りました');
            }
        });

        document.getElementById('rubyBtn').addEventListener('click', (e) => {
            if (!e.defaultPrevented) showNotice('ルビ付与パネル・自動振替機能');
        });

        // --- Real-time Character Count Logic ---
        const mainEditor = document.getElementById('mainEditor');
        const episodeGoalLabel = document.getElementById('episodeGoalLabel');
        const episodeCurrentText = document.getElementById('episodeCurrentText');
        const episodeGoalText = document.getElementById('episodeGoalText');
        const episodeBar = document.getElementById('episodeBar');

        // Vertical Side Counter Elements
        const sideEpCurrentText = document.getElementById('sideEpCurrentText');
        const sideEpGoalText = document.getElementById('sideEpGoalText');
        const sideEpBar = document.getElementById('sideEpBar');
        
        const overallCurrentText = document.getElementById('overallCurrentText');
        const overallGoalText = document.getElementById('overallGoalText');
        const overallBar = document.getElementById('overallBar');

        const chapterGoalLabel = document.getElementById('chapterGoalLabel');
        const chapterCurrentText = document.getElementById('chapterCurrentText');
        const chapterGoalText = document.getElementById('chapterGoalText');
        const chapterBar = document.getElementById('chapterBar');

        function updateCharacterCount() {
            const text = mainEditor.value;
            const count = text.length;

            // Episode Count
            const currentEp = getCurrentEpisode();
            const epGoal = currentEp.goal || 1500;
            episodeGoalLabel.textContent = `本話（${currentEp.number}）`;
            episodeCurrentText.textContent = count.toLocaleString();
            episodeGoalText.textContent = epGoal.toLocaleString() + '字';
            const epPercent = Math.min(100, Math.round((count / epGoal) * 100));
            episodeBar.style.width = epPercent + '%';

            // Vertical Counter Update
            sideEpCurrentText.textContent = count.toLocaleString();
            sideEpGoalText.textContent = epGoal.toLocaleString();
            sideEpBar.style.height = epPercent + '%';

            // Chapter Count logic
            const currentChapter = getCurrentChapter();
            const chGoal = currentChapter.goal || 5000;
            const chCurrent = (currentChapter.currentCount || 3200) + count;
            chapterGoalLabel.textContent = `章目標（${currentChapter.number}）`;
            chapterCurrentText.textContent = chCurrent.toLocaleString();
            chapterGoalText.textContent = chGoal.toLocaleString() + '字';
            const chPercent = Math.min(100, Math.round((chCurrent / chGoal) * 100));
            chapterBar.style.width = chPercent + '%';

            // Overall Count logic
            const overallTotal = 11600 + count;
            overallCurrentText.textContent = overallTotal.toLocaleString();
            
            const works = getStoredWorks();
            const currentWork = works.find(w => w.id === getCurrentWorkId()) || works[0];
            const goalVal = currentWork.goal || 50000;
            overallGoalText.textContent = goalVal.toLocaleString() + '字';
            
            const overallPercent = Math.min(100, Math.round((overallTotal / goalVal) * 100));
            overallBar.style.width = overallPercent + '%';
        }

        mainEditor.addEventListener('input', updateCharacterCount);

        // --- Data Mock Store & Helpers ---
        const defaultWorks = [
            { id: 'work_1', title: '深夜特急のレプリカント', subtitle: '第1部・覚醒編', goal: 50000 },
            { id: 'work_2', title: '星屑のグリモワール', subtitle: '外伝・始まりの図書館', goal: 30000 }
        ];

        const defaultChapters = {
            work_1: [
                { id: 'ch_1_1', number: '第1章', title: '雨の予兆', synopsis: '物語の始まりと主要キャラクターの登場', goal: 5000, currentCount: 5200 },
                { id: 'ch_1_2', number: '第2章', title: 'ネオン街の影', synopsis: '情報屋との対峙と秘密の取引', goal: 5000, currentCount: 4800 },
                { id: 'ch_1_3', number: '第3章', title: '雨音のプロムナード', synopsis: '主人公がネオン街の裏路地で情報屋と接触し、過去の記憶の手がかりとなる古いデータチップを受け取る。', goal: 5000, currentCount: 3200 }
            ],
            work_2: [
                { id: 'ch_2_1', number: '序幕', title: '地下書庫の出会い', synopsis: '禁断の魔導書を発見した見習い魔術師の運命が動き出す。', goal: 3000, currentCount: 2900 }
            ]
        };

        const defaultEpisodes = {
            ch_1_3: [
                { id: 'ep_1_3_11', number: '第11話', title: '路地裏の静寂', synopsis: '雨が強まる中、目的地へ向かう。', goal: 1500 },
                { id: 'ep_1_3_12', number: '第12話', title: '裏路地の情報屋', synopsis: 'ネオン街の裏路地で情報屋と接触。過去の記憶の手がかりとなるデータチップを入手するメインシーケンス。', goal: 1500 },
                { id: 'ep_1_3_13', number: '第13話', title: '残響のデータ', synopsis: 'チップを解析し衝撃の真実を知る。', goal: 2000 }
            ]
        };

        function getStoredWorks() {
            const stored = localStorage.getItem('novelist_works_list');
            if (!stored) {
                localStorage.setItem('novelist_works_list', JSON.stringify(defaultWorks));
                return defaultWorks;
            }
            return JSON.parse(stored);
        }

        function getCurrentWorkId() {
            return localStorage.getItem('novelist_current_work_id') || 'work_1';
        }

        function getStoredChapters(workId = getCurrentWorkId()) {
            const stored = localStorage.getItem(`novelist_chapters_${workId}`);
            if (!stored) {
                const initial = defaultChapters[workId] || [{ id: `ch_${workId}_1`, number: '第1章', title: '第一話', synopsis: '', goal: 5000, currentCount: 0 }];
                localStorage.setItem(`novelist_chapters_${workId}`, JSON.stringify(initial));
                return initial;
            }
            return JSON.parse(stored);
        }

        function getCurrentChapterId() {
            const workId = getCurrentWorkId();
            return localStorage.getItem(`novelist_current_chapter_id_${workId}`) || (getStoredChapters(workId)[0]?.id || 'ch_1_3');
        }

        function getCurrentChapter() {
            const chapters = getStoredChapters();
            const currentId = getCurrentChapterId();
            return chapters.find(c => c.id === currentId) || chapters[0];
        }

        function getStoredEpisodes(chapterId = getCurrentChapterId()) {
            const stored = localStorage.getItem(`novelist_episodes_${chapterId}`);
            if (!stored) {
                const initial = defaultEpisodes[chapterId] || [{ id: `ep_${chapterId}_1`, number: '第1話', title: 'エピソードタイトル', synopsis: '', goal: 1500 }];
                localStorage.setItem(`novelist_episodes_${chapterId}`, JSON.stringify(initial));
                return initial;
            }
            return JSON.parse(stored);
        }

        function getCurrentEpisodeId() {
            const chapterId = getCurrentChapterId();
            return localStorage.getItem(`novelist_current_ep_id_${chapterId}`) || (getStoredEpisodes(chapterId)[0]?.id || 'ep_1_3_12');
        }

        function getCurrentEpisode() {
            const episodes = getStoredEpisodes();
            const currentId = getCurrentEpisodeId();
            return episodes.find(e => e.id === currentId) || episodes[0];
        }

        // --- Render Views ---
        function loadCurrentWorkData() {
            const works = getStoredWorks();
            const currentWorkId = getCurrentWorkId();
            const work = works.find(w => w.id === currentWorkId) || works[0];

            document.getElementById('currentWorkTitleDisplay').textContent = work.title;
            document.getElementById('currentWorkSubTitleDisplay').textContent = work.subtitle || '';

            loadCurrentChapterData();
        }

        function loadCurrentChapterData() {
            const chapter = getCurrentChapter();
            document.getElementById('currentChapterNumDisplay').textContent = chapter.number || '第1章';
            document.getElementById('chapterTitleInput').value = chapter.title || '';

            loadCurrentEpisodeData();
        }

        function loadCurrentEpisodeData() {
            const ep = getCurrentEpisode();
            document.getElementById('currentEpisodeNumDisplay').textContent = ep.number || '第1話';
            document.getElementById('episodeTitleInput').value = ep.title || '';
            document.getElementById('episodeSynopsisInput').value = ep.synopsis || '';
            updateCharacterCount();
        }

        loadCurrentWorkData();

        // --- Chapter Synopsis Popup Handlers ---
        const chapterSynopsisModal = document.getElementById('chapterSynopsisModal');
        const openChapterSynopsisModalBtn = document.getElementById('openChapterSynopsisModalBtn');
        const closeChapterSynopsisModalBtn = document.getElementById('closeChapterSynopsisModalBtn');
        const savePopupSynopsisBtn = document.getElementById('savePopupSynopsisBtn');
        const popupChapterSynopsisInput = document.getElementById('popupChapterSynopsisInput');

        openChapterSynopsisModalBtn.addEventListener('click', () => {
            const chapter = getCurrentChapter();
            document.getElementById('synopsisModalChapterTitle').textContent = `${chapter.number}「${chapter.title}」のあらすじ`;
            popupChapterSynopsisInput.value = chapter.synopsis || '';
            chapterSynopsisModal.classList.remove('hidden');
        });

        closeChapterSynopsisModalBtn.addEventListener('click', () => chapterSynopsisModal.classList.add('hidden'));
        savePopupSynopsisBtn.addEventListener('click', () => {
            const chapter = getCurrentChapter();
            chapter.synopsis = popupChapterSynopsisInput.value.trim();
            const workId = getCurrentWorkId();
            let chapters = getStoredChapters(workId);
            chapters = chapters.map(c => c.id === chapter.id ? chapter : c);
            localStorage.setItem(`novelist_chapters_${workId}`, JSON.stringify(chapters));
            chapterSynopsisModal.classList.add('hidden');
            showNotice('章のあらすじを更新しました');
        });

        // --- Episode Selector & Management Modal Logic ---
        const episodeModal = document.getElementById('episodeModal');
        const selectEpisodeBtn = document.getElementById('selectEpisodeBtn');
        const editEpisodeBtn = document.getElementById('editEpisodeBtn');
        const closeEpisodeModalBtn = document.getElementById('closeEpisodeModalBtn');
        const tabEpisodeListBtn = document.getElementById('tabEpisodeListBtn');
        const tabEpisodeNewBtn = document.getElementById('tabEpisodeNewBtn');
        const episodeListView = document.getElementById('episodeListView');
        const episodeFormView = document.getElementById('episodeFormView');
        const episodeModalTabs = document.getElementById('episodeModalTabs');
        const episodeModalTitle = document.getElementById('episodeModalTitle');
        const deleteEpisodeBtn = document.getElementById('deleteEpisodeBtn');

        selectEpisodeBtn.addEventListener('click', () => {
            showEpisodeListView();
            renderEpisodeList();
            episodeModal.classList.remove('hidden');
        });

        editEpisodeBtn.addEventListener('click', () => {
            const ep = getCurrentEpisode();
            showEpisodeFormView(ep);
            episodeModal.classList.remove('hidden');
        });

        closeEpisodeModalBtn.addEventListener('click', () => episodeModal.classList.add('hidden'));
        episodeModal.addEventListener('click', (e) => { if (e.target === episodeModal) episodeModal.classList.add('hidden'); });

        tabEpisodeListBtn.addEventListener('click', showEpisodeListView);
        tabEpisodeNewBtn.addEventListener('click', () => showEpisodeFormView());

        function showEpisodeListView() {
            tabEpisodeListBtn.className = 'px-3 py-1.5 rounded-lg bg-dark-700 text-slate-100 font-medium transition';
            tabEpisodeNewBtn.className = 'px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition';
            episodeListView.classList.remove('hidden');
            episodeModalTabs.classList.remove('hidden');
            episodeFormView.classList.add('hidden');
            episodeModalTitle.innerHTML = `<i class="fa-solid fa-book-open text-slate-400"></i><span>話（エピソード）の切替・管理</span>`;
            document.getElementById('editingEpisodeId').value = '';
        }

        function showEpisodeFormView(epToEdit = null) {
            episodeListView.classList.add('hidden');
            episodeModalTabs.classList.add('hidden');
            episodeFormView.classList.remove('hidden');

            if (epToEdit) {
                episodeModalTitle.innerHTML = `<i class="fa-solid fa-pen text-slate-400"></i><span>話の編集・削除</span>`;
                document.getElementById('editingEpisodeId').value = epToEdit.id;
                document.getElementById('formEpisodeNumInput').value = epToEdit.number || '';
                document.getElementById('formEpisodeTitleInput').value = epToEdit.title || '';
                document.getElementById('formEpisodeSynopsisInput').value = epToEdit.synopsis || '';
                document.getElementById('formEpisodeGoalInput').value = epToEdit.goal || 1500;
                deleteEpisodeBtn.classList.remove('hidden');
            } else {
                episodeModalTitle.innerHTML = `<i class="fa-solid fa-plus text-slate-400"></i><span>新規話追加</span>`;
                const episodes = getStoredEpisodes();
                const nextNum = `第${episodes.length + 1}話`;
                document.getElementById('editingEpisodeId').value = '';
                document.getElementById('formEpisodeNumInput').value = nextNum;
                document.getElementById('formEpisodeTitleInput').value = '';
                document.getElementById('formEpisodeSynopsisInput').value = '';
                document.getElementById('formEpisodeGoalInput').value = '1500';
                deleteEpisodeBtn.classList.add('hidden');
            }
        }

        document.getElementById('cancelEpisodeFormBtn').addEventListener('click', showEpisodeListView);

        function renderEpisodeList() {
            const episodes = getStoredEpisodes();
            const currentId = getCurrentEpisodeId();
            episodeListView.innerHTML = '';

            episodes.forEach(ep => {
                const isSelected = ep.id === currentId;
                const item = document.createElement('div');
                item.className = `p-3 rounded-lg border flex items-center justify-between transition ${isSelected ? 'bg-dark-700/80 border-slate-500 shadow-sm' : 'bg-dark-900/50 border-dark-700/60 hover:border-slate-600'}`;
                item.innerHTML = `

            localStorage.setItem('goal_chapter_visible', chkChapter.checked);
            localStorage.setItem('goal_episode_visible', chkEpisode.checked);
            localStorage.setItem('tool_btn_locked', chkLockToolBtn.checked);
            localStorage.setItem('ruby_btn_locked', chkLockRubyBtn.checked);

            applyGoalVisibility(chkOverall.checked, chkChapter.checked, chkEpisode.checked);
            applyToolLock(chkLockToolBtn.checked);
            applyRubyLock(chkLockRubyBtn.checked);

            settingsModal.classList.add('hidden');
            showNotice('設定を保存しました');
        });

        // Draggable Functionality
        function makeDraggable(elm, isLockedCheck, storageKey) {
            let startX = 0, startY = 0, initialX = 0, initialY = 0;
            let isDragging = false;
            let hasMoved = false;

            function dragStart(e) {
                if (isLockedCheck() || isFocusMode) return;
                isDragging = true;
                hasMoved = false;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                startX = clientX;
                startY = clientY;
                
                const rect = elm.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;

                elm.style.left = initialX + 'px';
                elm.style.top = initialY + 'px';
                elm.style.right = 'auto';
                elm.style.bottom = 'auto';

                document.addEventListener('mousemove', dragMove);
                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchmove', dragMove, { passive: false });
                document.addEventListener('touchend', dragEnd);
            }

            function dragMove(e) {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dx = clientX - startX;
                const dy = clientY - startY;

                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    hasMoved = true;
                }

                let newX = initialX + dx;
                let newY = initialY + dy;

                const maxX = window.innerWidth - elm.offsetWidth;
                const maxY = window.innerHeight - elm.offsetHeight;

                newX = Math.max(10, Math.min(newX, maxX - 10));
                newY = Math.max(10, Math.min(newY, maxY - 10));

                elm.style.left = newX + 'px';
                elm.style.top = newY + 'px';

                if (e.touches && hasMoved) {
                    e.preventDefault();
                }
            }

            function dragEnd(e) {
                if (!isDragging) return;
                isDragging = false;

                document.removeEventListener('mousemove', dragMove);
                document.removeEventListener('mouseup', dragEnd);
                document.removeEventListener('touchmove', dragMove);
                document.removeEventListener('touchend', dragEnd);

                if (hasMoved) {
                    const currentRect = elm.getBoundingClientRect();
                    localStorage.setItem(storageKey, JSON.stringify({
                        left: currentRect.left + 'px',
                        top: currentRect.top + 'px'
                    }));

                    const innerBtn = elm.querySelector('button');
                    const clickPreventer = (event) => {
                        event.preventDefault();
                        event.stopPropagation();
                        innerBtn.removeEventListener('click', clickPreventer, true);
                    };
                    innerBtn.addEventListener('click', clickPreventer, true);
                }
            }

            elm.addEventListener('mousedown', dragStart);
            elm.addEventListener('touchstart', dragStart, { passive: false });
        }

        makeDraggable(document.getElementById('toolBtnContainer'), () => isToolLockedCurrent, 'tool_btn_pos');
        makeDraggable(document.getElementById('rubyBtnContainer'), () => isRubyLockedCurrent, 'ruby_btn_pos');
    </script>
