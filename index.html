<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chic Novelist Studio - UI Mockup V3.0 (Full Functional)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Inter', 'Noto Serif JP', serif;
            touch-action: manipulation;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .draggable-btn {
            touch-action: none;
            user-select: none;
            cursor: grab;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .draggable-btn:active {
            cursor: grabbing;
        }
        .draggable-btn.locked {
            cursor: pointer;
        }
        .draggable-btn.hidden-mode {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-200 min-h-screen flex flex-col antialiased selection:bg-slate-700 selection:text-white">

    <!-- Top Banner -->
    <header class="bg-dark-800/90 backdrop-blur-md border-b border-dark-700 px-4 py-2.5 sticky top-0 z-40 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-slate-700 to-dark-900 flex items-center justify-center border border-slate-600 shadow-inner">
                <i class="fa-solid fa-feather-pointed text-[11px] text-slate-300"></i>
            </div>
            <div class="flex items-center space-x-3">
                <button id="openWorkSelectorBtn" class="text-left group flex flex-col focus:outline-none" title="作品の切り替え・編集・新規登録">
                    <div class="flex items-center space-x-1.5">
                        <h1 id="currentWorkTitleDisplay" class="text-xs md:text-sm font-semibold tracking-wide text-slate-100 group-hover:text-white transition">作品名読み込み中...</h1>
                        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 group-hover:text-slate-200 transition"></i>
                    </div>
                    <span id="currentWorkSubTitleDisplay" class="text-[10px] text-slate-400 font-medium tracking-wide">サブタイトル</span>
                </button>
            </div>
        </div>

        <button id="focusModeBtn" title="集中モード" class="p-1.5 px-2.5 rounded-lg bg-dark-700/60 hover:bg-dark-700 text-slate-300 hover:text-white transition border border-dark-600/50 flex items-center space-x-1.5 text-xs">
            <i id="focusIcon" class="fa-solid fa-expand"></i>
            <span class="hidden sm:inline" id="focusText">集中モード</span>
        </button>
    </header>

    <!-- Compact Progress Dashboard -->
    <section id="targetSection" class="bg-dark-800/50 border-b border-dark-700/60 px-4 py-2 text-xs transition-all duration-300 overflow-hidden">
        <div id="targetGridContainer" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-2.5">
            <!-- Overall Progress -->
            <div id="goalOverall" class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span class="text-slate-400">全体目標（作品）</span>
                    <span class="font-mono text-slate-200"><span id="overallCurrentText">0</span> / <span id="overallGoalText" class="text-slate-400">50,000 chars</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div id="overallBar" class="bg-slate-400 h-1.5 rounded-full transition-all duration-300" style="width: 0%;"></div>
                </div>
            </div>
            <!-- Chapter Progress -->
            <div id="goalChapter" class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span id="chapterGoalLabel" class="text-slate-400">章目標（第1章）</span>
                    <span class="font-mono text-slate-200"><span id="chapterCurrentText">0</span> / <span id="chapterGoalText" class="text-slate-400">5,000 chars</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div id="chapterBar" class="bg-slate-500 h-1.5 rounded-full transition-all duration-300" style="width: 0%;"></div>
                </div>
            </div>
            <!-- Episode Progress -->
            <div id="goalEpisode" class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span id="episodeGoalLabel" class="text-slate-400">本話（第1話）</span>
                    <span class="font-mono text-slate-200"><span id="episodeCurrentText">0</span> / <span id="episodeGoalText" class="text-slate-400">1,500 chars</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div id="episodeBar" class="bg-slate-300 h-1.5 rounded-full transition-all duration-300" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col space-y-3">

        <!-- Navigation Stack Container -->
        <div class="flex flex-col space-y-2">
            
            <!-- 1. Chapter Banner -->
            <div class="relative flex items-center justify-center w-full py-1 min-h-[36px]">
                <button id="selectChapterBtn" class="absolute left-0 flex items-center space-x-1 bg-dark-800/90 hover:bg-dark-700 border border-dark-700 hover:border-dark-600 rounded px-2 py-0.5 shrink-0 text-slate-300 transition text-[10px]" title="章の切替・一覧">
                    <i class="fa-solid fa-bookmark text-[8px] text-slate-400"></i>
                    <span id="currentChapterNumDisplay" class="font-semibold">第1章</span>
                    <i class="fa-solid fa-chevron-down text-[7px] text-slate-400"></i>
                </button>
                
                <div class="flex justify-center w-full max-w-md px-16">
                    <input type="text" id="chapterTitleInput" value="" class="bg-transparent border-b border-transparent hover:border-dark-600 focus:border-slate-400 outline-none text-sm md:text-base font-bold text-slate-200 py-0.5 transition w-full text-center truncate" placeholder="章タイトル...">
                </div>

                <div class="absolute right-0 flex items-center space-x-1 shrink-0">
                    <button id="openChapterSynopsisModalBtn" class="p-1 px-1.5 rounded bg-dark-800/80 hover:bg-dark-700 text-slate-400 hover:text-slate-200 text-[10px] transition border border-dark-700" title="章のあらすじ">
                        <i class="fa-solid fa-file-lines text-[10px]"></i>
                    </button>
                    <button id="editChapterBtn" class="p-1 px-1.5 rounded bg-dark-800/80 hover:bg-dark-700 text-slate-400 hover:text-slate-200 text-[10px] transition border border-dark-700" title="章の編集">
                        <i class="fa-solid fa-pen text-[10px]"></i>
                    </button>
                </div>
            </div>

            <!-- 2. Episode Banner -->
            <div class="w-full max-w-2xl mx-auto bg-dark-800/80 border border-dark-700 rounded-xl p-3.5 shadow-md flex flex-col space-y-2.5">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2.5 flex-1 mr-2">
                        <button id="selectEpisodeBtn" class="flex items-center space-x-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg px-3 py-1.5 shrink-0 transition shadow text-xs md:text-sm font-bold" title="話の切替・一覧">
                            <i class="fa-solid fa-book-open text-xs text-slate-300"></i>
                            <span id="currentEpisodeNumDisplay">第1話</span>
                            <i class="fa-solid fa-chevron-down text-[10px] text-slate-300"></i>
                        </button>
                        <input type="text" id="episodeTitleInput" value="" class="bg-transparent border-b border-dark-600 focus:border-slate-300 outline-none text-base md:text-lg font-bold text-slate-100 py-0.5 transition w-full" placeholder="話タイトルを入力...">
                    </div>

                    <button id="editEpisodeBtn" class="px-2.5 py-1.5 rounded-lg bg-dark-700 hover:bg-dark-600 text-slate-200 transition text-xs flex items-center space-x-1.5 border border-dark-600 shrink-0 font-medium" title="話の編集・削除">
                        <i class="fa-solid fa-pen text-[11px]"></i>
                        <span class="hidden sm:inline">話の編集</span>
                    </button>
                </div>

                <div class="relative mt-1">
                    <span class="absolute -top-2 left-2.5 px-1 bg-dark-800 text-[9px] text-slate-400 font-medium uppercase tracking-wider border border-dark-700 rounded">話のあらすじ</span>
                    <textarea id="episodeSynopsisInput" rows="2" class="w-full bg-dark-900/80 border border-dark-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-slate-500 transition resize-y leading-relaxed min-h-[3.2rem]" placeholder="話のあらすじや構成ノート..."></textarea>
                </div>
            </div>

        </div>

        <!-- Editor Section with Interactive Dynamic Gauge Left Column -->
        <div class="flex-1 grid grid-cols-12 gap-3 items-stretch">
            
            <!-- Gauge Column -->
            <div class="col-span-1 md:col-span-1 bg-dark-800/50 border border-dark-700/60 rounded-xl p-2 flex flex-col items-center justify-between shadow-inner relative">
                <div class="flex flex-col items-center w-full border-b border-dark-700/50 pb-1.5">
                    <span id="sideEpCurrentText" class="font-mono text-[11px] md:text-xs font-bold text-slate-100 tracking-tight">0 chars</span>
                </div>

                <div class="relative w-full flex-1 my-2 flex justify-center items-stretch min-h-[220px]">
                    <div class="w-3 bg-dark-900/90 rounded-full relative overflow-hidden border border-dark-700/70 flex flex-col justify-start shadow-inner">
                        <div id="sideEpBar" class="w-full bg-gradient-to-b from-sky-500 via-indigo-500 to-emerald-400 transition-all duration-300 rounded-full shadow-md" style="height: 0%;"></div>
                    </div>
                    <div id="gaugePointerIcon" class="absolute z-20 left-1/2 -translate-x-1/2 transition-all duration-300 pointer-events-none flex items-center justify-center" style="top: 0%;">
                        <div class="w-5 h-5 rounded-full bg-dark-800 border border-slate-400 text-sky-400 shadow-lg flex items-center justify-center text-[9px]">
                            <i class="fa-solid fa-feather-pointed"></i>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col items-center w-full pt-1 border-t border-dark-700/50">
                    <span id="sideEpGoalText" class="font-mono text-[10px] md:text-[11px] font-semibold text-slate-400 tracking-tight">1.5k chars</span>
                </div>

                <button id="addPlotBtn" title="プロットを追加" class="mt-2 w-7 h-7 rounded-full bg-dark-700/80 hover:bg-dark-600 text-slate-300 hover:text-white transition flex items-center justify-center border border-dark-600/70 shadow active:scale-95 shrink-0">
                    <i class="fa-solid fa-plus text-[11px]"></i>
                </button>
            </div>

            <!-- Main Body Writing Field -->
            <div class="col-span-11 md:col-span-11 bg-dark-800/50 border border-dark-700/70 rounded-xl p-3.5 flex flex-col shadow-inner relative">
                <div class="flex justify-between items-center mb-2 text-xs text-slate-400 border-b border-dark-700/50 pb-1.5">
                    <div class="flex items-center space-x-1.5">
                        <i class="fa-solid fa-pen-nib"></i>
                        <span>本文エディタ (自動保存対応)</span>
                    </div>
                    <span id="autoSaveStatus" class="font-mono text-[10px] text-emerald-400"><i class="fa-solid fa-check"></i> 変更は自動保存されます</span>
                </div>
                <textarea id="mainEditor" rows="16" class="w-full flex-1 bg-transparent border-none text-slate-200 text-sm md:text-base leading-relaxed focus:outline-none resize-none font-serif" placeholder="ここに本文を記入してください..."></textarea>
            </div>
        </div>
    </main>

    <footer class="py-3 text-center border-t border-dark-800 text-[11px] text-slate-500 font-mono tracking-wider">
        Chic Novelist Studio &mdash; V3.0 Fully Integrated
    </footer>

    <!-- Modals -->
    <!-- Chapter Synopsis Modal -->
    <div id="chapterSynopsisModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl max-w-md w-full p-5 shadow-2xl flex flex-col space-y-3">
            <div class="flex items-center justify-between border-b border-dark-700 pb-2.5">
                <div class="flex items-center space-x-2 text-slate-100 font-semibold text-sm">
                    <i class="fa-solid fa-file-lines text-slate-400"></i>
                    <span id="synopsisModalChapterTitle">章のあらすじ</span>
                </div>
                <button id="closeChapterSynopsisModalBtn" class="text-slate-400 hover:text-slate-200 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <textarea id="popupChapterSynopsisInput" rows="5" class="w-full bg-dark-900 border border-dark-700 rounded-lg p-3 text-xs text-slate-200 focus:outline-none focus:border-slate-500 transition resize-none leading-relaxed" placeholder="章のあらすじを入力..."></textarea>
            <div class="flex justify-end pt-1">
                <button id="savePopupSynopsisBtn" class="px-4 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 text-xs font-medium transition shadow">保存して閉じる</button>
            </div>
        </div>
    </div>

    <!-- Episode Selector Modal -->
    <div id="episodeModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl max-w-lg w-full p-5 shadow-2xl flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-dark-700 pb-3">
                <div id="episodeModalTitle" class="flex items-center space-x-2 text-slate-100 font-semibold text-sm">
                    <i class="fa-solid fa-book-open text-slate-400"></i>
                    <span>話（エピソード）の切替・管理</span>
                </div>
                <button id="closeEpisodeModalBtn" class="text-slate-400 hover:text-slate-200 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="episodeModalTabs" class="flex space-x-2 border-b border-dark-700 pb-2 text-xs">
                <button id="tabEpisodeListBtn" class="px-3 py-1.5 rounded-lg bg-dark-700 text-slate-100 font-medium transition">話一覧・切替</button>
                <button id="tabEpisodeNewBtn" class="px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition">新規話追加</button>
            </div>

            <div id="episodeListView" class="flex flex-col space-y-2.5 max-h-64 overflow-y-auto pr-1 text-xs"></div>

            <div id="episodeFormView" class="hidden flex flex-col space-y-3 text-xs">
                <input type="hidden" id="editingEpisodeId" value="">
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1 flex flex-col space-y-1">
                        <label class="text-slate-400 font-medium">話数 <span class="text-rose-400">*</span></label>
                        <input type="text" id="formEpisodeNumInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 第1話">
                    </div>
                    <div class="col-span-2 flex flex-col space-y-1">
                        <label class="text-slate-400 font-medium">話タイトル <span class="text-rose-400">*</span></label>
                        <input type="text" id="formEpisodeTitleInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 裏路地の情報屋">
                    </div>
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">話のあらすじ</label>
                    <textarea id="formEpisodeSynopsisInput" rows="2" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500 resize-none" placeholder="この話の要点や出来事..."></textarea>
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">目標文字数</label>
                    <input type="number" id="formEpisodeGoalInput" value="1500" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500 font-mono">
                </div>
                <div class="flex items-center justify-between pt-2">
                    <button id="deleteEpisodeBtn" type="button" class="px-3 py-2 rounded-lg bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 transition border border-rose-800/50">この話を削除</button>
                    <div class="flex space-x-2 ml-auto">
                        <button id="cancelEpisodeFormBtn" type="button" class="px-3 py-2 rounded-lg bg-dark-700 hover:bg-dark-600 text-slate-300 transition">キャンセル</button>
                        <button id="saveEpisodeFormBtn" type="button" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium transition shadow">保存する</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chapter Selector Modal -->
    <div id="chapterModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl max-w-lg w-full p-5 shadow-2xl flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-dark-700 pb-3">
                <div id="chapterModalTitle" class="flex items-center space-x-2 text-slate-100 font-semibold text-sm">
                    <i class="fa-solid fa-bookmark text-slate-400"></i>
                    <span>章（チャプター）の切替・管理</span>
                </div>
                <button id="closeChapterModalBtn" class="text-slate-400 hover:text-slate-200 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="chapterModalTabs" class="flex space-x-2 border-b border-dark-700 pb-2 text-xs">
                <button id="tabChapterListBtn" class="px-3 py-1.5 rounded-lg bg-dark-700 text-slate-100 font-medium transition">章一覧・切替</button>
                <button id="tabChapterNewBtn" class="px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition">新規章作成</button>
            </div>

            <div id="chapterListView" class="flex flex-col space-y-2.5 max-h-64 overflow-y-auto pr-1 text-xs"></div>

            <div id="chapterFormView" class="hidden flex flex-col space-y-3 text-xs">
                <input type="hidden" id="editingChapterId" value="">
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1 flex flex-col space-y-1">
                        <label class="text-slate-400 font-medium">章番号 <span class="text-rose-400">*</span></label>
                        <input type="text" id="formChapterNumInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 第1章">
                    </div>
                    <div class="col-span-2 flex flex-col space-y-1">
                        <label class="text-slate-400 font-medium">章タイトル <span class="text-rose-400">*</span></label>
                        <input type="text" id="formChapterTitleInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 雨音のプロムナード">
                    </div>
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">章のあらすじ</label>
                    <textarea id="formChapterSynopsisInput" rows="2" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500 resize-none" placeholder="この章のあらすじ..."></textarea>
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">目標文字数</label>
                    <input type="number" id="formChapterGoalInput" value="5000" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500 font-mono">
                </div>
                <div class="flex items-center justify-between pt-2">
                    <button id="deleteChapterBtn" type="button" class="px-3 py-2 rounded-lg bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 transition border border-rose-800/50">この章を削除</button>
                    <div class="flex space-x-2 ml-auto">
                        <button id="cancelChapterFormBtn" type="button" class="px-3 py-2 rounded-lg bg-dark-700 hover:bg-dark-600 text-slate-300 transition">キャンセル</button>
                        <button id="saveChapterFormBtn" type="button" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium transition shadow">保存する</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Work Selector Modal -->
    <div id="workSelectorModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl max-w-lg w-full p-5 shadow-2xl flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-dark-700 pb-3">
                <div id="workModalTitle" class="flex items-center space-x-2 text-slate-100 font-semibold text-sm">
                    <i class="fa-solid fa-book-bookmark text-slate-400"></i>
                    <span>作品の選択・新規登録</span>
                </div>
                <button id="closeWorkSelectorBtn" class="text-slate-400 hover:text-slate-200 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="workModalTabs" class="flex space-x-2 border-b border-dark-700 pb-2 text-xs">
                <button id="tabListBtn" class="px-3 py-1.5 rounded-lg bg-dark-700 text-slate-100 font-medium transition">作品一覧・切替</button>
                <button id="tabNewBtn" class="px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition">新規作品登録</button>
                <button id="tabEditCurrentBtn" class="ml-auto px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition">現作品の編集・削除</button>
            </div>
            <div id="workListView" class="flex flex-col space-y-2.5 max-h-64 overflow-y-auto pr-1 text-xs"></div>
            <div id="workFormView" class="hidden flex flex-col space-y-3 text-xs">
                <input type="hidden" id="editingWorkId" value="">
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">作品名 <span class="text-rose-400">*</span></label>
                    <input type="text" id="formTitleInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 虚空のアンソロジー">
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">サブタイトル・シリーズ名</label>
                    <input type="text" id="formSubTitleInput" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500" placeholder="例: 第1部・覚醒編">
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">あらすじ</label>
                    <textarea id="formSynopsisInput" rows="2" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500 resize-none" placeholder="作品全体のあらすじ..."></textarea>
                </div>
                <div class="flex flex-col space-y-1">
                    <label class="text-slate-400 font-medium">目標文字数</label>
                    <input type="number" id="formGoalInput" value="50000" class="bg-dark-900 border border-dark-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-slate-500 font-mono">
                </div>
                <div class="flex items-center justify-between pt-2">
                    <button id="deleteWorkBtn" type="button" class="px-3 py-2 rounded-lg bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 transition border border-rose-800/50">この作品を削除</button>
                    <div class="flex space-x-2 ml-auto">
                        <button id="cancelFormBtn" type="button" class="px-3 py-2 rounded-lg bg-dark-700 hover:bg-dark-600 text-slate-300 transition">キャンセル</button>
                        <button id="saveWorkFormBtn" type="button" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium transition shadow">保存する</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl max-w-md w-full p-5 shadow-2xl flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-dark-700 pb-3">
                <div class="flex items-center space-x-2 text-slate-100 font-semibold text-sm">
                    <i class="fa-solid fa-gear text-slate-400"></i>
                    <span>アプリケーション設定</span>
                </div>
                <button id="closeSettingsBtn" class="text-slate-400 hover:text-slate-200 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex flex-col space-y-4 text-xs">
                <div class="flex flex-col space-y-2">
                    <span class="text-slate-400 font-medium uppercase tracking-wider text-[10px]">ボタン位置固定</span>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center justify-between bg-dark-900/50 p-2.5 rounded border border-dark-700/60 cursor-pointer hover:border-slate-600 transition">
                            <span class="text-slate-200 font-medium">ツールボタン固定</span>
                            <input type="checkbox" id="chkLockToolBtn" class="rounded bg-dark-700 border-dark-600 text-slate-500 focus:ring-0">
                        </label>
                        <label class="flex items-center justify-between bg-dark-900/50 p-2.5 rounded border border-dark-700/60 cursor-pointer hover:border-slate-600 transition">
                            <span class="text-slate-200 font-medium">ルビボタン固定</span>
                            <input type="checkbox" id="chkLockRubyBtn" class="rounded bg-dark-700 border-dark-600 text-slate-500 focus:ring-0">
                        </label>
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-2">
                <button id="saveSettingsBtn" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium transition shadow">設定を保存</button>
            </div>
        </div>
    </div>

    <!-- Draggable Floating Action Buttons -->
    <div id="toolBtnContainer" class="draggable-btn fixed z-50 select-none" style="left: 24px; bottom: 24px;">
        <button id="toolBtn" class="w-11 h-11 rounded-full bg-dark-800 hover:bg-dark-700 text-slate-300 hover:text-white border border-dark-600 shadow-xl flex items-center justify-center transition active:scale-95" title="ツール・設定">
            <i class="fa-solid fa-toolbox text-xs"></i>
        </button>
    </div>

    <div id="rubyBtnContainer" class="draggable-btn fixed z-50 select-none" style="right: 24px; bottom: 24px;">
        <button id="rubyBtn" class="w-11 h-11 rounded-full bg-dark-800 hover:bg-dark-700 text-slate-300 hover:text-white border border-dark-600 shadow-xl flex items-center justify-center transition active:scale-95" title="ルビ付与">
            <i class="fa-solid fa-font text-xs"></i>
        </button>
    </div>

    <!-- Core App Database & State Engine Script -->
    <script>
        function showNotice(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-14 right-4 z-50 bg-dark-800 border border-slate-600 text-slate-200 px-3.5 py-2 rounded-lg shadow-xl text-xs flex items-center space-x-2 transition-all duration-300';
            toast.innerHTML = `<i class="fa-solid fa-info-circle text-slate-400"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2200);
        }

        // --- Core Relational Database & Storage Schema ---
        const DB_KEY = 'novelist_studio_db_v3';

        const defaultDatabase = {
            currentWorkId: 'work_1',
            works: [
                {
                    id: 'work_1',
                    title: '深夜特急のレプリカント',
                    subtitle: '第1部・覚醒編',
                    synopsis: 'ネオン街を舞台にしたサイバーパンク・ハードボイルドノベル。',
                    goal: 50000,
                    currentChapterId: 'ch_1',
                    chapters: [
                        {
                            id: 'ch_1',
                            number: '第1章',
                            title: '雨音のプロムナード',
                            synopsis: '主人公が情報屋と接触し、記憶の手がかりを得る。',
                            goal: 5000,
                            currentEpisodeId: 'ep_1',
                            episodes: [
                                {
                                    id: 'ep_1',
                                    number: '第1話',
                                    title: '裏路地の情報屋',
                                    synopsis: 'ネオン街の裏路地で情報屋と接触する導入シーケンス。',
                                    goal: 1500,
                                    content: 'ネオンの光がアスファルトの雨粒に反射し、まるで細かな星屑が地面に散らばっているかのように揺れていた。\n襟を立てたコートのポケットの中で、冷え切った指先がかすかに震える。\n\n「……遅かったな」\n\n影の中から低く枯れた声が響く。振り返ると、古びた自動販売機の光に照らされた男が、煙草の火を赤く点滅させていた。'
                                },
                                {
                                    id: 'ep_2',
                                    number: '第2話',
                                    title: '雨のハイウェイ',
                                    synopsis: '情報屋から受け取ったチップを抱えて逃走する追跡劇。',
                                    goal: 2000,
                                    content: 'バイクのエンジン音が水たまりを引き裂くように轟く。背後からは追跡者のヘッドライトが容赦なく迫っていた。'
                                }
                            ]
                        },
                        {
                            id: 'ch_2',
                            number: '第2章',
                            title: '記憶の残響',
                            synopsis: 'データチップの解析と過去の真実へのアプローチ。',
                            goal: 6000,
                            currentEpisodeId: 'ep_3',
                            episodes: [
                                {
                                    id: 'ep_3',
                                    number: '第3話',
                                    title: 'データ解析室',
                                    synopsis: '古い端末にチップを挿入し、断片的な記憶の映像を再生する。',
                                    goal: 2500,
                                    content: 'モニターの青白い光が暗い部屋を照らし出す。画面に映し出されたのは、見覚えのない自身の顔だった。'
                                }
                            ]
                        }
                    ]
                }
            ]
        };

        function getDB() {
            const data = localStorage.getItem(DB_KEY);
            if (!data) {
                localStorage.setItem(DB_KEY, JSON.stringify(defaultDatabase));
                return defaultDatabase;
            }
            return JSON.parse(data);
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        // --- State Getters ---
        function getCurrentWork() {
            const db = getDB();
            return db.works.find(w => w.id === db.currentWorkId) || db.works[0];
        }

        function getCurrentChapter() {
            const work = getCurrentWork();
            return work.chapters.find(c => c.id === work.currentChapterId) || work.chapters[0];
        }

        function getCurrentEpisode() {
            const chapter = getCurrentChapter();
            return chapter.episodes.find(e => e.id === chapter.currentEpisodeId) || chapter.episodes[0];
        }

        // --- Focus Mode ---
        const targetSection = document.getElementById('targetSection');
        const focusModeBtn = document.getElementById('focusModeBtn');
        const focusIcon = document.getElementById('focusIcon');
        const focusText = document.getElementById('focusText');
        let isFocusMode = false;

        focusModeBtn.addEventListener('click', () => {
            isFocusMode = !isFocusMode;
            if (isFocusMode) {
                targetSection.style.maxHeight = '0px';
                targetSection.style.paddingTop = '0px';
                targetSection.style.paddingBottom = '0px';
                targetSection.style.opacity = '0';
                document.getElementById('toolBtnContainer').classList.add('hidden-mode');
                document.getElementById('rubyBtnContainer').classList.add('hidden-mode');
                focusText.textContent = '通常モード';
                focusIcon.className = 'fa-solid fa-compress';
                showNotice('集中モードに切り替えました');
            } else {
                targetSection.style.maxHeight = '120px';
                targetSection.style.paddingTop = '0.5rem';
                targetSection.style.paddingBottom = '0.5rem';
                targetSection.style.opacity = '1';
                document.getElementById('toolBtnContainer').classList.remove('hidden-mode');
                document.getElementById('rubyBtnContainer').classList.remove('hidden-mode');
                focusText.textContent = '集中モード';
                focusIcon.className = 'fa-solid fa-expand';
            }
        });

        // --- Main UI Rendering & Recalculation Engine ---
        const mainEditor = document.getElementById('mainEditor');
        const autoSaveStatus = document.getElementById('autoSaveStatus');

        function renderUI() {
            const work = getCurrentWork();
            const chapter = getCurrentChapter();
            const ep = getCurrentEpisode();

            // 1. Header & Banners
            document.getElementById('currentWorkTitleDisplay').textContent = work.title;
            document.getElementById('currentWorkSubTitleDisplay').textContent = work.subtitle || '';

            document.getElementById('currentChapterNumDisplay').textContent = chapter.number;
            document.getElementById('chapterTitleInput').value = chapter.title;

            document.getElementById('currentEpisodeNumDisplay').textContent = ep.number;
            document.getElementById('episodeTitleInput').value = ep.title;
            document.getElementById('episodeSynopsisInput').value = ep.synopsis || '';

            // 2. Editor Content Load (Only if not actively focused to avoid cursor jump)
            if (document.activeElement !== mainEditor) {
                mainEditor.value = ep.content || '';
            }

            // 3. Aggregate Calculations & Stats
            // Episode Stats
            const epCount = (ep.content || '').length;
            const epGoal = ep.goal || 1500;
            document.getElementById('episodeGoalLabel').textContent = `本話（${ep.number}）`;
            document.getElementById('episodeCurrentText').textContent = epCount.toLocaleString();
            document.getElementById('episodeGoalText').textContent = `${epGoal.toLocaleString()} chars`;
            const epPercent = Math.min(100, Math.round((epCount / epGoal) * 100));
            document.getElementById('episodeBar').style.width = `${epPercent}%`;

            document.getElementById('sideEpCurrentText').textContent = `${epCount.toLocaleString()} chars`;
            document.getElementById('sideEpGoalText').textContent = epGoal >= 1000 ? `${(epGoal / 1000).toFixed(1)}k chars` : `${epGoal} chars`;
            document.getElementById('sideEpBar').style.height = `${epPercent}%`;
            document.getElementById('gaugePointerIcon').style.top = `${epPercent}%`;

            // Chapter Stats (Sum of all episodes in this chapter)
            let chapterTotalCount = 0;
            let chapterTotalGoal = 0;
            chapter.episodes.forEach(e => {
                chapterTotalCount += (e.content || '').length;
                chapterTotalGoal += (e.goal || 1500);
            });
            document.getElementById('chapterGoalLabel').textContent = `章目標（${chapter.number}）`;
            document.getElementById('chapterCurrentText').textContent = chapterTotalCount.toLocaleString();
            document.getElementById('chapterGoalText').textContent = `${chapterTotalGoal.toLocaleString()} chars`;
            const chPercent = Math.min(100, Math.round((chapterTotalCount / chapterTotalGoal) * 100));
            document.getElementById('chapterBar').style.width = `${chPercent}%`;

            // Overall Work Stats (Sum of all chapters & episodes)
            let workTotalCount = 0;
            work.chapters.forEach(c => {
                c.episodes.forEach(e => {
                    workTotalCount += (e.content || '').length;
                });
            });
            const workGoal = work.goal || 50000;
            document.getElementById('overallCurrentText').textContent = workTotalCount.toLocaleString();
            document.getElementById('overallGoalText').textContent = `${workGoal.toLocaleString()} chars`;
            const workPercent = Math.min(100, Math.round((workTotalCount / workGoal) * 100));
            document.getElementById('overallBar').style.width = `${workPercent}%`;
        }

        // --- Real-time Auto Save & Character Count ---
        let saveTimeout;
        mainEditor.addEventListener('input', () => {
            const text = mainEditor.value;
            
            // Update DB state for current episode content
            const db = getDB();
            const work = db.works.find(w => w.id === db.currentWorkId);
            const chapter = work.chapters.find(c => c.id === work.currentChapterId);
            const ep = chapter.episodes.find(e => e.id === chapter.currentEpisodeId);
            ep.content = text;

            saveDB(db);
            renderUI();

            // Auto-save visual indicator feedback
            autoSaveStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 保存中...`;
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                autoSaveStatus.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> 自動保存完了`;
            }, 600);
        });

        // Instant property edits binding
        document.getElementById('episodeTitleInput').addEventListener('change', (e) => {
            const db = getDB();
            const work = db.works.find(w => w.id === db.currentWorkId);
            const chapter = work.chapters.find(c => c.id === work.currentChapterId);
            const ep = chapter.episodes.find(e => e.id === chapter.currentEpisodeId);
            ep.title = e.target.value.trim();
            saveDB(db);
            showNotice('話タイトルを更新しました');
        });

        document.getElementById('episodeSynopsisInput').addEventListener('change', (e) => {
            const db = getDB();
            const work = db.works.find(w => w.id === db.currentWorkId);
            const chapter = work.chapters.find(c => c.id === work.currentChapterId);
            const ep = chapter.episodes.find(e => e.id === chapter.currentEpisodeId);
            ep.synopsis = e.target.value.trim();
            saveDB(db);
        });

        document.getElementById('chapterTitleInput').addEventListener('change', (e) => {
            const db = getDB();
            const work = db.works.find(w => w.id === db.currentWorkId);
            const chapter = work.chapters.find(c => c.id === work.currentChapterId);
            chapter.title = e.target.value.trim();
            saveDB(db);
            showNotice('章タイトルを更新しました');
        });

        // --- Episode Selector Modal & CRUD Logic ---
        const episodeModal = document.getElementById('episodeModal');
        const selectEpisodeBtn = document.getElementById('selectEpisodeBtn');
        const editEpisodeBtn = document.getElementById('editEpisodeBtn');
        const closeEpisodeModalBtn = document.getElementById('closeEpisodeModalBtn');
        const tabEpisodeListBtn = document.getElementById('tabEpisodeListBtn');
        const tabEpisodeNewBtn = document.getElementById('tabEpisodeNewBtn');
        const episodeListView = document.getElementById('episodeListView');
        const episodeFormView = document.getElementById('episodeFormView');
        const episodeModalTabs = document.getElementById('episodeModalTabs');
        const episodeModalTitle = document.getElementById('episodeModalTitle');
        const deleteEpisodeBtn = document.getElementById('deleteEpisodeBtn');

        selectEpisodeBtn.addEventListener('click', () => {
            showEpisodeListView();
            renderEpisodeList();
            episodeModal.classList.remove('hidden');
        });

        editEpisodeBtn.addEventListener('click', () => {
            const ep = getCurrentEpisode();
            showEpisodeFormView(ep);
            episodeModal.classList.remove('hidden');
        });

        closeEpisodeModalBtn.addEventListener('click', () => episodeModal.classList.add('hidden'));
        episodeModal.addEventListener('click', (e) => { if (e.target === episodeModal) episodeModal.classList.add('hidden'); });

        tabEpisodeListBtn.addEventListener('click', showEpisodeListView);
        tabEpisodeNewBtn.addEventListener('click', () => showEpisodeFormView());

        function showEpisodeListView() {
            tabEpisodeListBtn.className = 'px-3 py-1.5 rounded-lg bg-dark-700 text-slate-100 font-medium transition';
            tabEpisodeNewBtn.className = 'px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition';
            episodeListView.classList.remove('hidden');
            episodeModalTabs.classList.remove('hidden');
            episodeFormView.classList.add('hidden');
            episodeModalTitle.innerHTML = `<i class="fa-solid fa-book-open text-slate-400"></i><span>話（エピソード）の切替・管理</span>`;
            document.getElementById('editingEpisodeId').value = '';
        }

        function showEpisodeFormView(epToEdit = null) {
            episodeListView.classList.add('hidden');
            episodeModalTabs.classList.add('hidden');
            episodeFormView.classList.remove('hidden');

            if (epToEdit) {
                episodeModalTitle.innerHTML = `<i class="fa-solid fa-pen text-slate-400"></i><span>話の編集・削除</span>`;
                document.getElementById('editingEpisodeId').value = epToEdit.id;
                document.getElementById('formEpisodeNumInput').value = epToEdit.number;
                document.getElementById('formEpisodeTitleInput').value = epToEdit.title;
                document.getElementById('formEpisodeSynopsisInput').value = epToEdit.synopsis || '';
                document.getElementById('formEpisodeGoalInput').value = epToEdit.goal || 1500;
                deleteEpisodeBtn.classList.remove('hidden');
            } else {
                episodeModalTitle.innerHTML = `<i class="fa-solid fa-plus text-slate-400"></i><span>新規話追加</span>`;
                const chapter = getCurrentChapter();
                const nextNum = `第${chapter.episodes.length + 1}話`;
                document.getElementById('editingEpisodeId').value = '';
                document.getElementById('formEpisodeNumInput').value = nextNum;
                document.getElementById('formEpisodeTitleInput').value = '';
                document.getElementById('formEpisodeSynopsisInput').value = '';
                document.getElementById('formEpisodeGoalInput').value = '1500';
                deleteEpisodeBtn.classList.add('hidden');
            }
        }

        document.getElementById('cancelEpisodeFormBtn').addEventListener('click', showEpisodeListView);

        function renderEpisodeList() {
            const chapter = getCurrentChapter();
            episodeListView.innerHTML = '';

            chapter.episodes.forEach(ep => {
                const isSelected = ep.id === chapter.currentEpisodeId;
                const charCount = (ep.content || '').length;
                const item = document.createElement('div');
                item.className = `p-3 rounded-lg border flex items-center justify-between transition ${isSelected ? 'bg-dark-700/80 border-slate-500 shadow-sm' : 'bg-dark-900/50 border-dark-700/60 hover:border-slate-600'}`;
                item.innerHTML = `
                    <div class="flex flex-col space-y-0.5 overflow-hidden pr-2 flex-1">
                        <div class="flex items-center space-x-2">
                            <span class="font-mono text-[11px] px-1.5 py-0.5 rounded bg-dark-800 text-slate-300 border border-dark-600">${ep.number}</span>
                            <span class="font-semibold text-slate-200 truncate">${ep.title}</span>
                            <span class="font-mono text-[10px] text-slate-400 ml-auto">${charCount} chars</span>
                        </div>
                        <span class="text-[10px] text-slate-400 truncate mt-1">${ep.synopsis || 'あらすじなし'}</span>
                    </div>
                    <div class="flex items-center space-x-1.5 shrink-0 ml-2">
                        <button class="px-2.5 py-1 rounded bg-dark-600 hover:bg-slate-500 text-slate-100 font-medium transition edit-ep-btn" data-id="${ep.id}">
                            <i class="fa-solid fa-pen text-[10px]"></i>
                        </button>
                        <button class="px-3 py-1 rounded ${isSelected ? 'bg-dark-700 text-slate-400 cursor-default' : 'bg-dark-600 hover:bg-slate-500 text-slate-100'} font-medium transition select-ep-btn" data-id="${ep.id}">
                            ${isSelected ? '選択中' : '切替'}
                        </button>
                    </div>
                `;
                episodeListView.appendChild(item);
            });

            document.querySelectorAll('.select-ep-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const db = getDB();
                    const work = db.works.find(w => w.id === db.currentWorkId);
                    const chapter = work.chapters.find(c => c.id === work.currentChapterId);
                    chapter.currentEpisodeId = id;
                    saveDB(db);
                    renderUI();
                    episodeModal.classList.add('hidden');
                    showNotice('話を切り替えました');
                });
            });

            document.querySelectorAll('.edit-ep-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const chapter = getCurrentChapter();
                    const ep = chapter.episodes.find(item => item.id === id);
                    if (ep) showEpisodeFormView(ep);
                });
            });
        }

        document.getElementById('saveEpisodeFormBtn').addEventListener('click', () => {
            const editingId = document.getElementById('editingEpisodeId').value;
            const number = document.getElementById('formEpisodeNumInput').value.trim();
            const title = document.getElementById('formEpisodeTitleInput').value.trim();
            const synopsis = document.getElementById('formEpisodeSynopsisInput').value.trim();
            const goal = parseInt(document.getElementById('formEpisodeGoalInput').value) || 1500;

            if (!number || !title) {
                showNotice('話数とタイトルを入力してください');
                return;
            }

            const db = getDB();
            const work = db.works.find(w => w.id === db.currentWorkId);
            const chapter = work.chapters.find(c => c.id === work.currentChapterId);

            if (editingId) {
                chapter.episodes = chapter.episodes.map(e => e.id === editingId ? { ...e, number, title, synopsis, goal } : e);
                saveDB(db);
                renderUI();
                episodeModal.classList.add('hidden');
                showNotice('話を更新しました');
            } else {
                const newId = 'ep_' + Date.now();
                chapter.episodes.push({ id: newId, number, title, synopsis, goal, content: '' });
                chapter.currentEpisodeId = newId;
                saveDB(db);
                renderUI();
                episodeModal.classList.add('hidden');
                showNotice('新しい話を追加しました');
            }
        });

        deleteEpisodeBtn.addEventListener('click', () => {
            const editingId = document.getElementById('editingEpisodeId').value;
            if (!editingId) return;

            const db = getDB();
            const work = db.works.find(w => w.id === db.currentWorkId);
            const chapter = work.chapters.find(c => c.id === work.currentChapterId);

            if (chapter.episodes.length <= 1) {
                showNotice('章内の最後の1話は削除できません');
                return;
            }

            if (!confirm('この話を削除しますか？ 本文データも削除されます。')) return;

            chapter.episodes = chapter.episodes.filter(e => e.id !== editingId);
            if (chapter.currentEpisodeId === editingId) {
                chapter.currentEpisodeId = chapter.episodes[0].id;
            }
            saveDB(db);
            renderUI();
            episodeModal.classList.add('hidden');
            showNotice('話を削除しました');
        });

        // --- Chapter Management Modal & CRUD ---
        const chapterModal = document.getElementById('chapterModal');
        const selectChapterBtn = document.getElementById('selectChapterBtn');
        const editChapterBtn = document.getElementById('editChapterBtn');
        const closeChapterModalBtn = document.getElementById('closeChapterModalBtn');
        const tabChapterListBtn = document.getElementById('tabChapterListBtn');
        const tabChapterNewBtn = document.getElementById('tabChapterNewBtn');
        const chapterListView = document.getElementById('chapterListView');
        const chapterFormView = document.getElementById('chapterFormView');
        const chapterModalTabs = document.getElementById('chapterModalTabs');
        const chapterModalTitle = document.getElementById('chapterModalTitle');
        const deleteChapterBtn = document.getElementById('deleteChapterBtn');

        selectChapterBtn.addEventListener('click', () => {
            showChapterListView();
            renderChapterList();
            chapterModal.classList.remove('hidden');
        });

        editChapterBtn.addEventListener('click', () => {
            const chapter = getCurrentChapter();
            showChapterFormView(chapter);
            chapterModal.classList.remove('hidden');
        });

        closeChapterModalBtn.addEventListener('click', () => chapterModal.classList.add('hidden'));
        chapterModal.addEventListener('click', (e) => { if (e.target === chapterModal) chapterModal.classList.add('hidden'); });

        tabChapterListBtn.addEventListener('click', showChapterListView);
        tabChapterNewBtn.addEventListener('click', () => showChapterFormView());

        function showChapterListView() {
            tabChapterListBtn.className = 'px-3 py-1.5 rounded-lg bg-dark-700 text-slate-100 font-medium transition';
            tabChapterNewBtn.className = 'px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition';
            chapterListView.classList.remove('hidden');
            chapterModalTabs.classList.remove('hidden');
            chapterFormView.classList.add('hidden');
            chapterModalTitle.innerHTML = `<i class="fa-solid fa-bookmark text-slate-400"></i><span>章（チャプター）の切替・管理</span>`;
            document.getElementById('editingChapterId').value = '';
        }

        function showChapterFormView(chToEdit = null) {
            chapterListView.classList.add('hidden');
            chapterModalTabs.classList.add('hidden');
            chapterFormView.classList.remove('hidden');

            if (chToEdit) {
                chapterModalTitle.innerHTML = `<i class="fa-solid fa-pen text-slate-400"></i><span>章の編集・削除</span>`;
                document.getElementById('editingChapterId').value = chToEdit.id;
                document.getElementById('formChapterNumInput').value = chToEdit.number;
                document.getElementById('formChapterTitleInput').value = chToEdit.title;
                document.getElementById('formChapterSynopsisInput').value = chToEdit.synopsis || '';
                document.getElementById('formChapterGoalInput').value = chToEdit.goal || 5000;
                deleteChapterBtn.classList.remove('hidden');
            } else {
                chapterModalTitle.innerHTML = `<i class="fa-solid fa-plus text-slate-400"></i><span>新規章作成</span>`;
                const work = getCurrentWork();
                const nextNum = `第${work.chapters.length + 1}章`;
                document.getElementById('editingChapterId').value = '';
                document.getElementById('formChapterNumInput').value = nextNum;
                document.getElementById('formChapterTitleInput').value = '';
                document.getElementById('formChapterSynopsisInput').value = '';
                document.getElementById('formChapterGoalInput').value = '5000';
                deleteChapterBtn.classList.add('hidden');
            }
        }

        document.getElementById('cancelChapterFormBtn').addEventListener('click', showChapterListView);

        function renderChapterList() {
            const work = getCurrentWork();
            chapterListView.innerHTML = '';

            work.chapters.forEach(ch => {
                const isSelected = ch.id === work.currentChapterId;
                let chCount = 0;
                ch.episodes.forEach(e => chCount += (e.content || '').length);

                const item = document.createElement('div');
                item.className = `p-3 rounded-lg border flex items-center justify-between transition ${isSelected ? 'bg-dark-700/80 border-slate-500 shadow-sm' : 'bg-dark-900/50 border-dark-700/60 hover:border-slate-600'}`;
                item.innerHTML = `
                    <div class="flex flex-col space-y-0.5 overflow-hidden pr-2 flex-1">
                        <div class="flex items-center space-x-2">
                            <span class="font-mono text-[11px] px-1.5 py-0.5 rounded bg-dark-800 text-slate-300 border border-dark-600">${ch.number}</span>
                            <span class="font-semibold text-slate-200 truncate">${ch.title}</span>
                            <span class="font-mono text-[10px] text-slate-400 ml-auto">${chCount} chars</span>
                        </div>
                        <span class="text-[10px] text-slate-400 truncate mt-1">${ch.synopsis || 'あらすじなし'}</span>
                    </div>
                    <div class="flex items-center space-x-1.5 shrink-0 ml-2">
                        <button class="px-2.5 py-1 rounded bg-dark-600 hover:bg-slate-500 text-slate-100 font-medium transition edit-ch-btn" data-id="${ch.id}">
                            <i class="fa-solid fa-pen text-[10px]"></i>
                        </button>
                        <button class="px-3 py-1 rounded ${isSelected ? 'bg-dark-700 text-slate-400 cursor-default' : 'bg-dark-600 hover:bg-slate-500 text-slate-100'} font-medium transition select-ch-btn" data-id="${ch.id}">
                            ${isSelected ? '選択中' : '切替'}
                        </button>
                    </div>
                `;
                chapterListView.appendChild(item);
            });

            document.querySelectorAll('.select-ch-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const db = getDB();
                    const work = db.works.find(w => w.id === db.currentWorkId);
                    work.currentChapterId = id;
                    saveDB(db);
                    renderUI();
                    chapterModal.classList.add('hidden');
                    showNotice('章を切り替えました');
                });
            });

            document.querySelectorAll('.edit-ch-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const work = getCurrentWork();
                    const ch = work.chapters.find(item => item.id === id);
                    if (ch) showChapterFormView(ch);
                });
            });
        }

        document.getElementById('saveChapterFormBtn').addEventListener('click', () => {
            const editingId = document.getElementById('editingChapterId').value;
            const number = document.getElementById('formChapterNumInput').value.trim();
            const title = document.getElementById('formChapterTitleInput').value.trim();
            const synopsis = document.getElementById('formChapterSynopsisInput').value.trim();
            const goal = parseInt(document.getElementById('formChapterGoalInput').value) || 5000;

            if (!number || !title) {
                showNotice('章番号とタイトルを入力してください');
                return;
            }

            const db = getDB();
            const work = db.works.find(w => w.id === db.currentWorkId);

            if (editingId) {
                work.chapters = work.chapters.map(c => c.id === editingId ? { ...c, number, title, synopsis, goal } : c);
                saveDB(db);
                renderUI();
                chapterModal.classList.add('hidden');
                showNotice('章を更新しました');
            } else {
                const newChId = 'ch_' + Date.now();
                const newEpId = 'ep_' + Date.now();
                work.chapters.push({
                    id: newChId,
                    number,
                    title,
                    synopsis,
                    goal,
                    currentEpisodeId: newEpId,
                    episodes: [{ id: newEpId, number: '第1話', title: '第1話', synopsis: '', goal: 1500, content: '' }]
                });
                work.currentChapterId = newChId;
                saveDB(db);
                renderUI();
                chapterModal.classList.add('hidden');
                showNotice('新しい章を追加しました');
            }
        });

        deleteChapterBtn.addEventListener('click', () => {
            const editingId = document.getElementById('editingChapterId').value;
            if (!editingId) return;

            const db = getDB();
            const work = db.works.find(w => w.id === db.currentWorkId);

            if (work.chapters.length <= 1) {
                showNotice('作品内の最後の1章は削除できません');
                return;
            }

            if (!confirm('この章を削除しますか？ 属する話と本文もすべて削除されます。')) return;

            work.chapters = work.chapters.filter(c => c.id !== editingId);
            if (work.currentChapterId === editingId) {
                work.currentChapterId = work.chapters[0].id;
            }
            saveDB(db);
            renderUI();
            chapterModal.classList.add('hidden');
            showNotice('章を削除しました');
        });

        // --- Work Selector Modal & CRUD ---
        const workSelectorModal = document.getElementById('workSelectorModal');
        const openWorkSelectorBtn = document.getElementById('openWorkSelectorBtn');
        const closeWorkSelectorBtn = document.getElementById('closeWorkSelectorBtn');
        const tabListBtn = document.getElementById('tabListBtn');
        const tabNewBtn = document.getElementById('tabNewBtn');
        const tabEditCurrentBtn = document.getElementById('tabEditCurrentBtn');
        const workListView = document.getElementById('workListView');
        const workFormView = document.getElementById('workFormView');
        const workModalTabs = document.getElementById('workModalTabs');
        const workModalTitle = document.getElementById('workModalTitle');
        const deleteWorkBtn = document.getElementById('deleteWorkBtn');

        openWorkSelectorBtn.addEventListener('click', () => {
            showWorkListView();
            renderWorkList();
            workSelectorModal.classList.remove('hidden');
        });

        closeWorkSelectorBtn.addEventListener('click', () => workSelectorModal.classList.add('hidden'));
        workSelectorModal.addEventListener('click', (e) => { if (e.target === workSelectorModal) workSelectorModal.classList.add('hidden'); });

        tabListBtn.addEventListener('click', showWorkListView);
        tabNewBtn.addEventListener('click', () => showWorkFormView());
        tabEditCurrentBtn.addEventListener('click', () => {
            showWorkFormView(getCurrentWork());
        });

        function showWorkListView() {
            tabListBtn.className = 'px-3 py-1.5 rounded-lg bg-dark-700 text-slate-100 font-medium transition';
            tabNewBtn.className = 'px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition';
            tabEditCurrentBtn.className = 'px-3 py-1.5 rounded-lg bg-dark-900/60 text-slate-400 hover:text-slate-200 font-medium transition';
            workListView.classList.remove('hidden');
            workModalTabs.classList.remove('hidden');
            workFormView.classList.add('hidden');
            workModalTitle.innerHTML = `<i class="fa-solid fa-book-bookmark text-slate-400"></i><span>作品の選択・新規登録</span>`;
            document.getElementById('editingWorkId').value = '';
        }

        function showWorkFormView(workToEdit = null) {
            workListView.classList.add('hidden');
            workModalTabs.classList.add('hidden');
            workFormView.classList.remove('hidden');

            if (workToEdit) {
                workModalTitle.innerHTML = `<i class="fa-solid fa-pen text-slate-400"></i><span>作品の編集・削除</span>`;
                document.getElementById('editingWorkId').value = workToEdit.id;
                document.getElementById('formTitleInput').value = workToEdit.title;
                document.getElementById('formSubTitleInput').value = workToEdit.subtitle || '';
                document.getElementById('formSynopsisInput').value = workToEdit.synopsis || '';
                document.getElementById('formGoalInput').value = workToEdit.goal || 50000;
                deleteWorkBtn.classList.remove('hidden');
            } else {
                workModalTitle.innerHTML = `<i class="fa-solid fa-plus text-slate-400"></i><span>新規作品登録</span>`;
                document.getElementById('editingWorkId').value = '';
                document.getElementById('formTitleInput').value = '';
                document.getElementById('formSubTitleInput').value = '';
                document.getElementById('formSynopsisInput').value = '';
                document.getElementById('formGoalInput').value = '50000';
                deleteWorkBtn.classList.add('hidden');
            }
        }

        document.getElementById('cancelFormBtn').addEventListener('click', showWorkListView);

        function renderWorkList() {
            const db = getDB();
            workListView.innerHTML = '';

            db.works.forEach(work => {
                const isSelected = work.id === db.currentWorkId;
                let wCount = 0;
                work.chapters.forEach(c => c.episodes.forEach(e => wCount += (e.content || '').length));

                const item = document.createElement('div');
                item.className = `p-3 rounded-lg border flex items-center justify-between transition ${isSelected ? 'bg-dark-700/80 border-slate-500 shadow-sm' : 'bg-dark-900/50 border-dark-700/60 hover:border-slate-600'}`;
                item.innerHTML = `
                    <div class="flex flex-col space-y-0.5 overflow-hidden pr-2 flex-1">
                        <div class="flex items-center space-x-2">
                            <span class="font-semibold text-slate-200 truncate">${work.title}</span>
                            <span class="font-mono text-[10px] text-slate-400 ml-auto">${wCount} chars</span>
                        </div>
                        <span class="text-[10px] text-slate-400 truncate">${work.subtitle || 'サブタイトルなし'}</span>
                    </div>
                    <div class="flex items-center space-x-1.5 shrink-0 ml-2">
                        <button class="px-2.5 py-1 rounded bg-dark-600 hover:bg-slate-500 text-slate-100 font-medium transition edit-work-btn" data-id="${work.id}">
                            <i class="fa-solid fa-pen text-[10px]"></i>
                        </button>
                        <button class="px-3 py-1 rounded ${isSelected ? 'bg-dark-700 text-slate-400 cursor-default' : 'bg-dark-600 hover:bg-slate-500 text-slate-100'} font-medium transition select-work-btn" data-id="${work.id}">
                            ${isSelected ? '選択中' : '切替'}
                        </button>
                    </div>
                `;
                workListView.appendChild(item);
            });

            document.querySelectorAll('.select-work-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const db = getDB();
                    db.currentWorkId = id;
                    saveDB(db);
                    renderUI();
                    workSelectorModal.classList.add('hidden');
                    showNotice('作品を切り替えました');
                });
            });

            document.querySelectorAll('.edit-work-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const db = getDB();
                    const work = db.works.find(w => w.id === id);
                    if (work) showWorkFormView(work);
                });
            });
        }

        document.getElementById('saveWorkFormBtn').addEventListener('click', () => {
            const editingId = document.getElementById('editingWorkId').value;
            const title = document.getElementById('formTitleInput').value.trim();
            const subtitle = document.getElementById('formSubTitleInput').value.trim();
            const synopsis = document.getElementById('formSynopsisInput').value.trim();
            const goal = parseInt(document.getElementById('formGoalInput').value) || 50000;

            if (!title) {
                showNotice('作品名を入力してください');
                return;
            }

            const db = getDB();

            if (editingId) {
                db.works = db.works.map(w => w.id === editingId ? { ...w, title, subtitle, synopsis, goal } : w);
                saveDB(db);
                renderUI();
                workSelectorModal.classList.add('hidden');
                showNotice('作品を更新しました');
            } else {
                const newWorkId = 'work_' + Date.now();
                const newChId = 'ch_' + Date.now();
                const newEpId = 'ep_' + Date.now();
                db.works.push({
                    id: newWorkId,
                    title,
                    subtitle,
                    synopsis,
                    goal,
                    currentChapterId: newChId,
                    chapters: [{
                        id: newChId,
                        number: '第1章',
                        title: '第1章',
                        synopsis: '',
                        goal: 5000,
                        currentEpisodeId: newEpId,
                        episodes: [{ id: newEpId, number: '第1話', title: '第1話', synopsis: '', goal: 1500, content: '' }]
                    }]
                });
                db.currentWorkId = newWorkId;
                saveDB(db);
                renderUI();
                workSelectorModal.classList.add('hidden');
                showNotice('新しい作品を登録しました');
            }
        });

        deleteWorkBtn.addEventListener('click', () => {
            const editingId = document.getElementById('editingWorkId').value;
            if (!editingId) return;

            const db = getDB();
            if (db.works.length <= 1) {
                showNotice('最後の作品は削除できません');
                return;
            }

            if (!confirm('この作品を本当に削除しますか？')) return;

            db.works = db.works.filter(w => w.id !== editingId);
            if (db.currentWorkId === editingId) {
                db.currentWorkId = db.works[0].id;
            }
            saveDB(db);
            renderUI();
            workSelectorModal.classList.add('hidden');
            showNotice('作品を削除しました');
        });

        // --- Chapter Synopsis Modal Handlers ---
        const chapterSynopsisModal = document.getElementById('chapterSynopsisModal');
        const openChapterSynopsisModalBtn = document.getElementById('openChapterSynopsisModalBtn');
        const closeChapterSynopsisModalBtn = document.getElementById('closeChapterSynopsisModalBtn');
        const savePopupSynopsisBtn = document.getElementById('savePopupSynopsisBtn');
        const popupChapterSynopsisInput = document.getElementById('popupChapterSynopsisInput');

        openChapterSynopsisModalBtn.addEventListener('click', () => {
            const ch = getCurrentChapter();
            document.getElementById('synopsisModalChapterTitle').textContent = `${ch.number}「${ch.title}」のあらすじ`;
            popupChapterSynopsisInput.value = ch.synopsis || '';
            chapterSynopsisModal.classList.remove('hidden');
        });

        closeChapterSynopsisModalBtn.addEventListener('click', () => chapterSynopsisModal.classList.add('hidden'));
        savePopupSynopsisBtn.addEventListener('click', () => {
            const db = getDB();
            const work = db.works.find(w => w.id === db.currentWorkId);
            const ch = work.chapters.find(c => c.id === work.currentChapterId);
            ch.synopsis = popupChapterSynopsisInput.value.trim();
            saveDB(db);
            chapterSynopsisModal.classList.add('hidden');
            showNotice('章のあらすじを更新しました');
        });

        // --- Settings & Lock Handlers ---
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const chkLockToolBtn = document.getElementById('chkLockToolBtn');
        const chkLockRubyBtn = document.getElementById('chkLockRubyBtn');
        const toolBtnContainer = document.getElementById('toolBtnContainer');
        const rubyBtnContainer = document.getElementById('rubyBtnContainer');

        function loadSettings() {
            const isToolLocked = localStorage.getItem('tool_btn_locked') === 'true';
            const isRubyLocked = localStorage.getItem('ruby_btn_locked') === 'true';
            chkLockToolBtn.checked = isToolLocked;
            chkLockRubyBtn.checked = isRubyLocked;
            applyToolLock(isToolLocked);
            applyRubyLock(isRubyLocked);
        }

        let isToolLockedCurrent = false;
        function applyToolLock(locked) {
            isToolLockedCurrent = locked;
            if (locked) toolBtnContainer.classList.add('locked');
            else toolBtnContainer.classList.remove('locked');
        }

        let isRubyLockedCurrent = false;
        function applyRubyLock(locked) {
            isRubyLockedCurrent = locked;
            if (locked) rubyBtnContainer.classList.add('locked');
            else rubyBtnContainer.classList.remove('locked');
        }

        document.getElementById('toolBtn').addEventListener('click', (e) => {
            if (!e.defaultPrevented) settingsModal.classList.remove('hidden');
        });
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
        
        saveSettingsBtn.addEventListener('click', () => {
            localStorage.setItem('tool_btn_locked', chkLockToolBtn.checked);
            localStorage.setItem('ruby_btn_locked', chkLockRubyBtn.checked);
            applyToolLock(chkLockToolBtn.checked);
            applyRubyLock(chkLockRubyBtn.checked);
            settingsModal.classList.add('hidden');
            showNotice('設定を保存しました');
        });

        loadSettings();

        // Initial Boot Render
        renderUI();
    </script>
</body>
</html>
