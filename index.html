<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chic Novelist Studio - UI Mockup</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Inter', 'Noto Serif JP', serif;
        }
        /* Custom scrollbar for chic look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-200 min-h-screen flex flex-col antialiased selection:bg-slate-700 selection:text-white">

    <!-- Top Banner -->
    <header class="bg-dark-800/90 backdrop-blur-md border-b border-dark-700 px-4 py-3 sticky top-0 z-40 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <!-- App Icon -->
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-slate-700 to-dark-900 flex items-center justify-center border border-slate-600 shadow-inner">
                <i class="fa-solid fa-feather-pointed text-xs text-slate-300"></i>
            </div>
            <!-- Work Title -->
            <div class="flex flex-col">
                <span class="text-xs text-slate-400 font-medium tracking-wider uppercase">GitHub Connected</span>
                <h1 class="text-sm md:text-base font-semibold tracking-wide text-slate-100">深夜特急のレプリカント - 第3章</h1>
            </div>
        </div>

        <!-- Focus Mode Button -->
        <button id="focusModeBtn" title="集中モード" class="p-2 rounded-lg bg-dark-700/60 hover:bg-dark-700 text-slate-300 hover:text-white transition border border-dark-600/50 flex items-center space-x-1.5 text-xs">
            <i class="fa-solid fa-expand"></i>
            <span class="hidden sm:inline">集中モード</span>
        </button>
    </header>

    <!-- Compact Progress Dashboard -->
    <section class="bg-dark-800/50 border-b border-dark-700/60 px-4 py-2.5 text-xs">
        <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-3">
            <!-- Overall Progress -->
            <div class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span class="text-slate-400">全体目標</span>
                    <span class="font-mono text-slate-200">12,450 / <span class="text-slate-400">50,000字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div class="bg-slate-400 h-1.5 rounded-full" style="width: 25%;"></div>
                </div>
            </div>
            <!-- Chapter Progress -->
            <div class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span class="text-slate-400">第3章目標</span>
                    <span class="font-mono text-slate-200">3,200 / <span class="text-slate-400">5,000字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div class="bg-slate-500 h-1.5 rounded-full" style="width: 64%;"></div>
                </div>
            </div>
            <!-- Episode Progress -->
            <div class="bg-dark-800/80 p-2 rounded-lg border border-dark-700/50 flex flex-col justify-between">
                <div class="flex justify-between mb-1">
                    <span class="text-slate-400">本話（第12話）</span>
                    <span class="font-mono text-slate-200">850 / <span class="text-slate-400">1,500字</span></span>
                </div>
                <div class="w-full bg-dark-900 rounded-full h-1.5 overflow-hidden">
                    <div class="bg-slate-300 h-1.5 rounded-full" style="width: 56%;"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col space-y-4">

        <!-- Chapter & Title Header -->
        <div class="bg-dark-800/60 border border-dark-700/70 rounded-xl p-4 shadow-sm flex flex-col space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center space-y-2 sm:space-y-0 sm:space-x-4">
                <div class="px-3 py-1 bg-dark-700/80 border border-dark-600 rounded-md text-xs font-semibold text-slate-300 w-fit">
                    第3章
                </div>
                <input type="text" value="雨音のプロムナード" class="bg-transparent border-b border-dark-600 focus:border-slate-400 outline-none text-base md:text-lg font-semibold text-slate-100 py-1 transition w-full" placeholder="章タイトルを入力...">
            </div>
            <!-- Synopsis Field -->
            <div class="relative">
                <span class="absolute -top-2.5 left-3 px-1.5 bg-dark-800 text-[10px] text-slate-400 font-medium uppercase tracking-wider border border-dark-700 rounded">章のあらすじ</span>
                <textarea rows="2" class="w-full bg-dark-900/60 border border-dark-700 rounded-lg p-3 text-xs md:text-sm text-slate-300 focus:outline-none focus:border-slate-500 transition resize-none" placeholder="この章のあらすじやプロットの指針を記入...">主人公がネオン街の裏路地で情報屋と接触し、過去の記憶の手がかりとなる古いデータチップを受け取る。</textarea>
            </div>
        </div>

        <!-- Editor Section with Plot Column on the Left -->
        <div class="flex-1 grid grid-cols-12 gap-4 items-stretch">
            
            <!-- Plot No. Vertical Column (Left Side) -->
            <div class="col-span-3 md:col-span-2 bg-dark-800/40 border border-dark-700/60 rounded-xl p-3 flex flex-col space-y-3">
                <div class="flex items-center justify-between border-b border-dark-700 pb-2">
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">プロットNo.</span>
                    <button title="プロット追加" class="text-slate-400 hover:text-slate-200 text-xs"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="flex flex-col space-y-2 overflow-y-auto max-h-[500px] pr-1">
                    <!-- Plot Item 1 (Active) -->
                    <div class="p-2 rounded-lg bg-dark-700/60 border border-slate-600 cursor-pointer text-xs transition shadow-sm">
                        <div class="font-mono text-[10px] text-slate-400">#PLOT-012</div>
                        <div class="font-medium text-slate-200 truncate mt-0.5">裏路地での密会</div>
                    </div>
                    <!-- Plot Item 2 -->
                    <div class="p-2 rounded-lg bg-dark-800/80 border border-dark-700/60 hover:bg-dark-700/40 cursor-pointer text-xs transition text-slate-400">
                        <div class="font-mono text-[10px] text-slate-500">#PLOT-013</div>
                        <div class="truncate mt-0.5">雨のハイウェイ</div>
                    </div>
                    <!-- Plot Item 3 -->
                    <div class="p-2 rounded-lg bg-dark-800/80 border border-dark-700/60 hover:bg-dark-700/40 cursor-pointer text-xs transition text-slate-400">
                        <div class="font-mono text-[10px] text-slate-500">#PLOT-014</div>
                        <div class="truncate mt-0.5">記憶の残響</div>
                    </div>
                </div>
            </div>

            <!-- Main Body Writing Field -->
            <div class="col-span-9 md:col-span-10 bg-dark-800/50 border border-dark-700/70 rounded-xl p-4 flex flex-col shadow-inner relative">
                <div class="flex justify-between items-center mb-2 text-xs text-slate-400 border-b border-dark-700/50 pb-2">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-pen-nib"></i>
                        <span>本文エディタ</span>
                    </div>
                    <span class="font-mono text-[11px]">Markdown / 縦書き風プレビュー対応予定</span>
                </div>
                <textarea rows="16" class="w-full flex-1 bg-transparent border-none text-slate-200 text-sm md:text-base leading-relaxed focus:outline-none resize-none font-serif" placeholder="ここに本文を記入してください...">ネオンの光がアスファルトの雨粒に反射し、まるで細かな星屑が地面に散らばっているかのように揺れていた。
襟を立てたコートのポケットの中で、冷え切った指先がかすかに震える。

「……遅かったな」

影の中から低く枯れた声が響く。振り返ると、古びた自動販売機の光に照らされた男が、煙草の火を赤く点滅させていた。</textarea>
            </div>
        </div>
    </main>

    <!-- Floating Action Buttons (Bottom Left: Tool / Bottom Right: Ruby) -->
    <!-- Bottom Left Tool Button -->
    <div class="fixed bottom-6 left-6 z-50">
        <button id="toolBtn" class="w-12 h-12 rounded-full bg-dark-800 hover:bg-dark-700 text-slate-300 hover:text-white border border-dark-600 shadow-lg flex items-center justify-center transition hover:scale-105 active:scale-95" title="ツール">
            <i class="fa-solid fa-toolbox text-sm"></i>
        </button>
    </div>

    <!-- Bottom Right Ruby Button -->
    <div class="fixed bottom-6 right-6 z-50">
        <button id="rubyBtn" class="w-12 h-12 rounded-full bg-dark-800 hover:bg-dark-700 text-slate-300 hover:text-white border border-dark-600 shadow-lg flex items-center justify-center transition hover:scale-105 active:scale-95" title="ルビ付与">
            <i class="fa-solid fa-font text-sm"></i>
        </button>
    </div>

    <!-- Basic Interactive Scripts -->
    <script>
        // Notification toast helper (No alert/confirm used)
        function showNotice(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-16 right-4 z-50 bg-dark-800 border border-slate-600 text-slate-200 px-4 py-2.5 rounded-lg shadow-xl text-xs flex items-center space-x-2 transition-all duration-300';
            toast.innerHTML = `<i class="fa-solid fa-info-circle text-slate-400"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Event Listeners for UI mock testing
        document.getElementById('focusModeBtn').addEventListener('click', () => {
            showNotice('集中モードは次のステップで実装予定です');
        });

        document.getElementById('toolBtn').addEventListener('click', () => {
            showNotice('ツールメニュー（文字数詳細・設定など）');
        });

        document.getElementById('rubyBtn').addEventListener('click', () => {
            showNotice('ルビ付与パネル・自動振替機能');
        });
    </script>
</body>
</html>
